<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splat Stack promo renderer</title>
<style>
@font-face { font-family: "Fredoka"; font-weight: 500 700; src: url("../../fonts/fredoka.woff2") format("woff2"); }
html, body { margin: 0; background: #0d0b1f; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="out"></canvas>
<script type="module">
// Renders store covers and promo-video frames with the real game renderer.
// Driven by tools/promo/render.cjs; not part of the shipped game.
import { LEVELS } from '../../src/levels.js';
import { parseLevel, createState, step, PW, PH, TILE } from '../../src/sim.js';
import { Renderer, SKINS } from '../../src/render.js';

const out = document.getElementById('out');
const ctx = out.getContext('2d');
const skin = SKINS[0];
const QUIPS = ['Thanks for the bridge.', 'You make a lovely floor.', 'Step 1: die. Step 2: climb.', 'Future you says thanks.', 'Recycling: 100%.'];

let R, world, L, S, inputs, cursor, camX, quip = 0, t = 0;

function makeWorld(scale) {
  world = document.createElement('canvas');
  R = new Renderer(world);
  R.resize(960 * scale, 544 * scale, 1);
}

// Copies the world canvas into the output, cropped to fill it. focusX is in world units.
// zoom > 1 crops tighter and keeps the bottom of the level (the floor) in view.
function composite(focusX, zoom = 1) {
  const sw = world.width, sh = world.height;
  const k = Math.max(out.width / sw, out.height / sh) * zoom;
  const cw = out.width / k, ch = out.height / k;
  const fx = (focusX / 960) * sw;
  const cx = Math.max(0, Math.min(sw - cw, fx - cw / 2));
  const cy = zoom > 1 ? sh - ch - sh * 0.02 : (sh - ch) / 2;
  ctx.drawImage(world, cx, cy, cw, ch, 0, 0, out.width, out.height);
}

function drawTitle(layout) {
  const w = out.width, h = out.height;
  const size = layout === 'landscape' ? h * 0.2 : layout === 'portrait' ? w * 0.24 : w * 0.2;
  const lines = layout === 'landscape' ? ['SPLAT STACK'] : ['SPLAT', 'STACK'];
  const top = layout === 'landscape' ? h * 0.2 : layout === 'portrait' ? h * 0.13 : h * 0.17;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${size}px Fredoka`;
  lines.forEach((text, i) => {
    const y = top + i * size * 0.95;
    ctx.save();
    ctx.translate(w / 2, y);
    ctx.rotate((i % 2 ? 1 : -1) * 0.035);
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.2; ctx.strokeStyle = '#1b1530'; ctx.strokeText(text, 0, size * 0.07);
    ctx.lineWidth = size * 0.2; ctx.strokeText(text, 0, 0);
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, '#c6ff8f'); g.addColorStop(0.55, '#7dff6b'); g.addColorStop(1, '#3fd14a');
    ctx.fillStyle = g; ctx.fillText(text, 0, 0);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.save(); ctx.beginPath(); ctx.rect(-w, -size / 2, 2 * w, size * 0.32); ctx.clip(); ctx.fillText(text, 0, 0); ctx.restore();
    ctx.restore();
  });
  ctx.restore();
}

// A hand-built scene that shows the whole idea at a glance: a tower of corpses, a jammed saw,
// a lava bridge and the jelly leaping for the door.
const COVER_MAP = [
  '##############################',
  '#............................#',
  '#............................#',
  '#............................#',
  '#............................#',
  '#............................#',
  '#............................#',
  '#............................#',
  '#............................#',
  '#........................D...#',
  '#...................##########',
  '#...................##########',
  '#...................##########',
  '#...................##########',
  '#.P...........^^^^^.##########',
  '####~~~~~~~###################',
  '##############################',
];

function coverState() {
  L = parseLevel({ name: 'cover', par: 0, map: COVER_MAP, saws: [[11, 14, 13, 14, 90, 0, 22]] });
  S = createState(L);
  const put = (col, y) => S.splats.push({ x: col * TILE - PW / 2, y, vy: 0 });
  put(5.5, 468); put(8.5, 468); // lava bridge
  put(12.6, 458); // jams the saw
  put(18.4, 434); put(18.5, 412); put(18.4, 390); put(17.6, 434); // the stack
  for (let i = 0; i < 60; i++) step(L, S, { l: false, r: false, j: false });
  S.p.x = 18.9 * TILE; S.p.y = 292; S.p.vy = -7; S.p.vx = 4; S.p.face = 1; S.p.ground = false;
  R.setLevel(L, 0);
  R.squash = 1.25;
}

window.promo = {
  async cover(w, h, layout) {
    await document.fonts.load('700 40px Fredoka');
    out.width = w; out.height = h;
    makeWorld(Math.ceil(Math.max(w / 960, h / 544)));
    coverState();
    for (let i = 0; i < 4; i++) R.tick();
    R.blink = 0; // eyes open on the cover
    R.draw(L, S, skin, 1, 1000);
    if (layout === 'landscape' || layout === 'video-landscape') composite(480);
    else composite(layout === 'portrait' ? 610 : 640, layout === 'portrait' ? 1.05 : 1.2);
    drawTitle(layout);
    return out.toDataURL('image/png');
  },

  async video(w, h, inputMap, order) {
    await document.fonts.load('600 20px Fredoka');
    out.width = w; out.height = h;
    // Follow the jelly with a closer camera; the whole level at once reads too small on a phone.
    this.zoom = h > w ? 1.35 : 1.45;
    makeWorld(Math.ceil(Math.max(w / 960, h / 544) * this.zoom));
    this.queue = order.map((n) => ({ n, frames: inputMap[n].split(' ') }));
    this.portrait = h > w;
    this.next();
  },

  next() {
    const item = this.queue.shift();
    if (!item) return false;
    L = parseLevel(LEVELS[item.n - 1]);
    S = createState(L);
    R.setLevel(L, Math.floor((item.n - 1) / 6));
    inputs = item.frames; cursor = 0;
    camX = S.p.x;
    return true;
  },

  // Advances one frame of gameplay and returns it as a JPEG data URL, or null when done.
  frame() {
    if (cursor >= inputs.length || S.won) {
      // Hold the win for a moment so the burst reads, then move on.
      if ((this.hold = (this.hold || 0) + 1) < 30) return this.draw();
      this.hold = 0;
      if (!this.next()) return null;
    }
    const c = inputs[cursor++] || '-';
    R.savePrev(S.p);
    step(L, S, { l: c.includes('l'), r: c.includes('r'), j: c.includes('j') });
    for (const e of S.events) {
      if (e.type === 'die') R.say(QUIPS[quip++ % QUIPS.length], e.x + 11, Math.max(40, e.y - 12));
      if (e.type === 'jam') R.say('Jammed!', e.x, e.y - 56, '#9ff7ea', true);
      if (e.type === 'door') { const d = L.doorAlt || L.door; R.say('Nope!', d.x + 16, d.y - 30, '#ffe58a', true); }
    }
    R.onEvents(S.events, skin, t);
    R.tick();
    return this.draw();
  },

  draw() {
    t += 1;
    R.draw(L, S, skin, 1, t * 16.67);
    const target = S.p.dead ? camX : S.p.x + PW / 2;
    camX += (target - camX) * 0.08;
    composite(camX, this.zoom);
    return out.toDataURL('image/jpeg', 0.93);
  },
};
window.promoReady = true;
</script>
</body>
</html>
