<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gobble Royale</title>
<meta name="description" content="Eat smaller monsters, run from bigger ones, pick a power every level and be the biggest when the clock hits zero.">
<link rel="stylesheet" href="style.css">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-left">
    <div class="pill" id="hud-time">3:00</div>
    <div class="pill" id="hud-alive"><span class="dot"></span><b id="alive">12</b> left</div>
  </div>
  <div class="hud-center">
    <div class="rank" id="hud-rank">#1</div>
    <div class="mass" id="hud-mass">10</div>
  </div>
  <div class="hud-right">
    <ol class="board" id="board"></ol>
    <button class="icon" id="btn-pause" aria-label="Pause" title="Pause (Esc)">
      <svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
  </div>
</div>

<div id="xp" class="hidden"><div id="xp-fill"></div><span id="xp-level">Lv 1</span></div>
<div id="combo" class="hidden"></div>

<div id="banner" class="hidden"><div id="banner-title"></div><div id="banner-hint"></div></div>

<div id="stick" class="hidden"><div id="knob"></div></div>
<button id="btn-dash" class="hidden" aria-label="Dash">
  <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
  <svg class="ring" viewBox="0 0 100 100"><circle id="dash-ring" cx="50" cy="50" r="46"/></svg>
</button>
<div id="dash-key" class="hidden"><kbd>Space</kbd> or click to dash</div>

<div id="overlay" class="hidden">
  <div class="panel" id="panel"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
