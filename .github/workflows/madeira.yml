name: Madeira

on:
  push:
    paths:
      - madeira/**
      - .github/workflows/madeira.yml
  workflow_dispatch:

concurrency:
  group: madeira-${{ github.ref }}
  cancel-in-progress: true

env:
  # Madeira revision the app is built from (our changes: madeira/patches).
  MADEIRA_REF: 48f976429c189f8396e23d251d8a82f43c705922
  # llvm-project commit Madeira's DXMT shader compiler is built against (docs/BUILDING.md).
  LLVM_SHORT_REF: 8dfdcc7b7
  # Our app's identity, so it installs next to the original Madeira.
  APP_NAME: PCEmu
  APP_BUNDLE_ID: com.felivivapintos.pcemu

jobs:
  llvm-ios:
    name: LLVM for iOS
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Resolve LLVM commit
        id: llvm
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/llvm/llvm-project/commits/$LLVM_SHORT_REF --jq .sha)" >> "$GITHUB_OUTPUT"

      - name: Restore cached LLVM
        id: cache
        uses: actions/cache@v4
        with:
          path: llvm-out
          key: llvm-ios-${{ steps.llvm.outputs.sha }}-v1

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SHA: ${{ steps.llvm.outputs.sha }}
        run: |
          brew install -q ninja
          git init -q llvm-project && cd llvm-project
          git fetch -q --depth 1 https://github.com/llvm/llvm-project.git "$SHA" && git checkout -q FETCH_HEAD
          cmake -G Ninja -S llvm -B ../host -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_INCLUDE_TESTS=Off -DLLVM_INCLUDE_BENCHMARKS=Off -DLLVM_ENABLE_ZLIB=Off -DLLVM_ENABLE_ZSTD=Off
          ninja -C ../host llvm-tblgen
          cmake -G Ninja -S llvm -B ../ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_BUILD_TYPE=Release -DCMAKE_MACOSX_BUNDLE=OFF \
            -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_TARGET_ARCH=host -DLLVM_TARGETS_TO_BUILD="" -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_BUILD_TOOLS=Off -DLLVM_INCLUDE_TOOLS=Off -DLLVM_INCLUDE_UTILS=Off \
            -DLLVM_INCLUDE_TESTS=Off -DLLVM_INCLUDE_BENCHMARKS=Off -DLLVM_INCLUDE_EXAMPLES=Off \
            -DLLVM_ENABLE_ZLIB=Off -DLLVM_ENABLE_ZSTD=Off -DLLVM_ENABLE_LIBXML2=Off \
            -DLLVM_TABLEGEN="$PWD/../host/bin/llvm-tblgen" -DLLVM_NATIVE_TOOL_DIR="$PWD/../host/bin"
          # Only the libraries: the iOS linker rejects the host-style flags of the tool targets.
          ninja -C ../ios $(ninja -C ../ios -t targets all | grep -oE '^lib/libLLVM[A-Za-z0-9_]+\.a' | sort -u)
          mkdir -p ../llvm-out/lib
          cp -R llvm/include ../llvm-out/src-include
          cp -R ../ios/include ../llvm-out/build-include
          cp ../ios/lib/*.a ../llvm-out/lib/
          echo "$SHA" > ../llvm-out/VERSION
          du -sh ../llvm-out

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-ios
          path: llvm-out
          retention-days: 7

  app:
    name: Madeira app
    needs: llvm-ios
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ours

      - name: Select Xcode 26+
        run: |
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$xcode" ] || { echo "No Xcode 26+ on this runner"; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch Madeira and submodules
        run: |
          git init -q madeira && cd madeira
          git fetch -q --depth 1 https://github.com/willfaust/Madeira.git "$MADEIRA_REF"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
          for patch in ../ours/madeira/patches/*.patch; do
            [ -e "$patch" ] || continue
            echo "Applying $patch"
            git apply "$patch"
          done

      - uses: actions/download-artifact@v4
        with:
          name: llvm-ios
          path: llvm-out

      - name: Install tools
        run: |
          brew install -q ninja meson bison ccache pkg-config autoconf automake libtool nasm
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios
          mkdir -p madeira/toolchains/llvm-project/llvm madeira/toolchains/llvm-ios-build
          mv llvm-out/src-include madeira/toolchains/llvm-project/llvm/include
          mv llvm-out/build-include madeira/toolchains/llvm-ios-build/include
          mv llvm-out/lib madeira/toolchains/llvm-ios-build/lib

      - name: Restore cached GnuTLS + FFmpeg
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            madeira/toolchains/gnutls-ios
            madeira/toolchains/ffmpeg-ios
            madeira/app/Madeira/libgmp.a
            madeira/app/Madeira/libnettle.a
            madeira/app/Madeira/libhogweed.a
            madeira/app/Madeira/libgnutls.a
            madeira/app/Madeira/libavformat.a
            madeira/app/Madeira/libavcodec.a
            madeira/app/Madeira/libswresample.a
            madeira/app/Madeira/libavutil.a
          key: deps-${{ env.MADEIRA_REF }}-v1

      - name: GnuTLS
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: madeira
        run: bash build/gnutls-ios/build.sh 2>&1 | tail -30

      - name: FFmpeg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: madeira
        run: bash build/ffmpeg/build.sh 2>&1 | tail -30

      - name: Save GnuTLS + FFmpeg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            madeira/toolchains/gnutls-ios
            madeira/toolchains/ffmpeg-ios
            madeira/app/Madeira/libgmp.a
            madeira/app/Madeira/libnettle.a
            madeira/app/Madeira/libhogweed.a
            madeira/app/Madeira/libgnutls.a
            madeira/app/Madeira/libavformat.a
            madeira/app/Madeira/libavcodec.a
            madeira/app/Madeira/libswresample.a
            madeira/app/Madeira/libavutil.a
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: FEX (iOS)
        working-directory: madeira
        run: |
          # Same options as build/fex-ios/build.sh, plus the processor: recent CMake leaves
          # CMAKE_SYSTEM_PROCESSOR empty for iOS and FEX refuses to configure without it.
          cmake -S FEX -B FEX/build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF -DENABLE_FEX_ALLOCATOR=OFF -DENABLE_ASSERTIONS=OFF \
            -DENABLE_CLANG_THUNKS=ON -DENABLE_CCACHE=ON -DTUNE_CPU=none -DTUNE_ARCH=generic > fex-configure.log 2>&1 \
            || { grep -B2 -A12 "CMake Error" fex-configure.log; exit 1; }
          bash build/fex-ios/build.sh 2>&1 | tail -30

      - name: FreeType
        working-directory: madeira
        run: |
          git clone -q --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh 2>&1 | tail -5

      - name: llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 20260421 -R mstorsjo/llvm-mingw -p '*-ucrt-macos-universal.tar.xz' -O "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C madeira/toolchains

      - name: Restore cached Wine macOS tree
        id: wine-cache
        uses: actions/cache/restore@v4
        with:
          path: madeira/wine/build-macos
          key: wine-build-macos-${{ env.MADEIRA_REF }}-v1

      - name: Wine macOS tree (config.h, generated headers, tools)
        if: steps.wine-cache.outputs.cache-hit != 'true'
        working-directory: madeira/wine
        run: |
          # Undocumented input of build/ntdll-unix, build/wineserver and build/win32u-unix:
          # a configured and built native Wine tree.
          export PATH="$PWD/../toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          mkdir -p build-macos && cd build-macos
          ../configure CC=/usr/bin/clang CXX=/usr/bin/clang++ --without-x --disable-tests \
            > configure.log 2>&1 || { tail -40 configure.log; exit 1; }
          # Madeira's fork does not link as a macOS Wine (win32u.so); only the generated
          # headers and tools are needed, so keep going past link errors.
          make -k -j"$(sysctl -n hw.ncpu)" > make.log 2>&1 || grep -E "\*\*\* \[" make.log | head -20
          ls -la include/config.h include/dwrite.h tools/winebuild/winebuild tools/widl/widl

      - name: Save Wine macOS tree
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: madeira/wine/build-macos
          key: ${{ steps.wine-cache.outputs.cache-primary-key }}

      - name: Wine unix side
        working-directory: madeira
        run: |
          show_errors() {
            for e in build/*/obj/*.err build/*/obj/err-*.txt; do
              [ -s "$e" ] && grep -q "error" "$e" && { echo "== $e"; grep -m8 -B2 "error" "$e"; }
            done
            return 1
          }
          # llvm-objcopy (wineserver symbol renames) from llvm-mingw, without its other tools.
          mkdir -p "$RUNNER_TEMP/bin" && ln -sf "$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/llvm-objcopy" "$RUNNER_TEMP/bin/"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash ../ours/madeira/tools/wineserver-base.sh
          for part in ntdll-unix wineserver win32u-unix; do
            bash build/$part/build.sh > $part.log 2>&1 || { tail -15 $part.log; show_errors; }
            grep -E "Results:|Failed:" $part.log || true
          done
          ls -la app/Madeira/lib{ntdll_unix,wineserver,win32u_unix}.a

      - name: DXMT
        working-directory: madeira
        run: |
          bash build/dxmt-ios/build.sh 2>&1 | tail -40
          libtool -static -o build/dxmt-ios/libdxmt_combined.a build/dxmt-ios/libdxmt_unix.a \
            toolchains/llvm-ios-build/lib/libLLVM*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/

      - name: Remote pairing (Rust)
        working-directory: madeira
        run: bash build/rppairing-ios/build.sh 2>&1 | tail -30

      - name: Build app
        working-directory: madeira/app
        run: |
          mkdir -p Madeira/x86_64-vcruntime
          xcodebuild -project Madeira.xcodeproj -scheme Madeira -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MADEIRA_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(missing|not found)|BUILD" | tail -80

      - name: Package IPA
        working-directory: madeira/app
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Debug-iphoneos/Madeira.app ipa/Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" ipa/Payload/Madeira.app/Info.plist
          codesign --force --sign - --entitlements Madeira/Madeira.entitlements ipa/Payload/Madeira.app || true
          cd ipa && zip -qry "../$APP_NAME.ipa" Payload && ls -la "../$APP_NAME.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: madeira/app/${{ env.APP_NAME }}.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            madeira/app/xcodebuild.log
            madeira/build/**/obj/err-*.txt
            madeira/build/**/*.log
