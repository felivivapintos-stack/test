name: Build

on:
  push:
  workflow_dispatch:

env:
  # FEX-Emu revision built into the app. Bump to update.
  FEX_REF: 14c92681f4d62cf84d901460e0358de09c8847a7
  # Wine release the iOS port is based on (patches in wine/patches).
  WINE_REF: wine-11.19

jobs:
  fex:
    name: FEX-Emu (ARM64EC/WOW64 DLLs)
    runs-on: ubuntu-24.04
    steps:
      - name: Restore cached build
        id: cache
        uses: actions/cache@v4
        with:
          path: fex-out
          key: fex-${{ env.FEX_REF }}-v1

      - name: Install llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
          gh release download -R mstorsjo/llvm-mingw -p '*-ucrt-ubuntu-*-x86_64.tar.xz' -O llvm-mingw.tar.xz
          mkdir llvm-mingw && tar -xf llvm-mingw.tar.xz -C llvm-mingw --strip-components=1
          echo "$PWD/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Fetch FEX-Emu
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q FEX && cd FEX
          git remote add origin https://github.com/FEX-Emu/FEX.git
          git fetch -q --depth 1 origin "$FEX_REF" && git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --recursive

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: FEX
        run: |
          for target in arm64ec wow64; do
            case $target in arm64ec) triple=arm64ec ;; wow64) triple=aarch64 ;; esac
            cmake -S . -B build_$target -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=Data/CMake/toolchain_mingw.cmake -DMINGW_TRIPLE=$triple-w64-mingw32 \
              -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=/usr/lib/wine/aarch64-windows \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
              -DBUILD_TESTING=False -DTUNE_ARCH=generic -DTUNE_CPU=none -DRANGES_NATIVE=OFF
            cmake --build build_$target
            DESTDIR="$PWD/../install" cmake --build build_$target -t install
          done
          mkdir -p ../fex-out
          cp ../install/usr/lib/wine/aarch64-windows/lib*.dll ../fex-out/
          echo "$FEX_REF" > ../fex-out/VERSION
          ls -la ../fex-out

      - uses: actions/upload-artifact@v4
        with:
          name: fex-dlls
          path: fex-out

  wine-macos:
    name: Wine (macOS ARM64 testbed)
    # Paused: upstream Wine is killed on macOS ARM when it runs PE code (no MAP_JIT
    # support); see docs/INVESTIGACAO.md. Run manually from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    needs: fex
    runs-on: macos-15
    timeout-minutes: 300
    env:
      WINE_INSTALL: ${{ github.workspace }}/wine-install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fex-dlls
          path: fex

      - name: Install tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          brew install -q bison flex coreutils
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          gh release download -R mstorsjo/llvm-mingw -p '*-ucrt-macos-universal.tar.xz' -O "$RUNNER_TEMP/llvm-mingw.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Restore cached Wine
        id: cache
        uses: actions/cache@v4
        with:
          path: wine-install
          key: wine-macos-${{ env.WINE_REF }}-${{ hashFiles('wine/patches/**') }}-v1

      - name: Fetch Wine and apply patches
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$WINE_REF" https://gitlab.winehq.org/wine/wine.git wine-src
          for patch in wine/patches/*.patch; do
            [ -e "$patch" ] || continue
            echo "Applying $patch"
            git -C wine-src apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Build Wine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir wine-build && cd wine-build
          ../wine-src/configure CC=/usr/bin/clang CXX=/usr/bin/clang++ \
            --prefix="$WINE_INSTALL" --enable-archs=arm64ec,aarch64 --disable-tests \
            --without-x --without-freetype --without-gstreamer --without-sane --without-cups \
            --without-krb5 --without-gphoto --without-pcap --without-usb --without-vulkan \
            > configure.log 2>&1 || { tail -50 configure.log; exit 1; }
          grep -iE "warning|error" configure.log | tail -40 || true
          make -j"$(sysctl -n hw.ncpu)" > make.log 2>&1 || { grep -B5 -A5 -iE " error|error:" make.log | tail -120; exit 1; }
          make install > install.log 2>&1 || { tail -50 install.log; exit 1; }

      - name: Build test programs
        run: |
          aarch64-w64-mingw32-clang -O2 wine/tests/hello.c -o hello-arm64.exe
          x86_64-w64-mingw32-clang -O2 wine/tests/hello.c -o hello-x64.exe

      - name: Diagnostics
        if: ${{ !cancelled() }}
        run: |
          ls -la "$WINE_INSTALL/bin" "$WINE_INSTALL/lib/wine" || true
          file "$WINE_INSTALL"/bin/* || true
          set +e
          "$WINE_INSTALL/bin/wine" --version; echo "wine --version exit=$?"
          WINEDEBUG=+loaddll,+process,err+all WINEPREFIX="$RUNNER_TEMP/diag" "$WINE_INSTALL/bin/wine" cmd /c echo hi 2>&1 | head -80
          echo "exit=${PIPESTATUS[0]}"

      - name: "Test: wineboot"
        if: ${{ !cancelled() }}
        run: |
          export WINEPREFIX="$RUNNER_TEMP/prefix" WINEDLLOVERRIDES="mscoree,mshtml="
          gtimeout 600 "$WINE_INSTALL/bin/wine" wineboot -i 2>&1 | tail -60
          test -d "$WINEPREFIX/drive_c/windows/system32"

      - name: "Test: native ARM64 exe"
        if: ${{ !cancelled() }}
        run: |
          export WINEPREFIX="$RUNNER_TEMP/prefix" WINEDEBUG=err+all
          gtimeout 300 "$WINE_INSTALL/bin/wine" ./hello-arm64.exe 2>&1 | tee arm64.log | tail -60
          grep -q "PCEmu bench" arm64.log

      - name: "Test: x86_64 exe through FEX"
        if: ${{ !cancelled() }}
        run: |
          export WINEPREFIX="$RUNNER_TEMP/prefix" WINEDEBUG=err+all
          cp fex/*.dll "$WINEPREFIX/drive_c/windows/system32/"
          "$WINE_INSTALL/bin/wine" reg add 'HKLM\Software\Microsoft\Wow64\amd64' /ve /d libarm64ecfex.dll /f
          gtimeout 300 "$WINE_INSTALL/bin/wine" ./hello-x64.exe 2>&1 | tee x64.log | tail -60
          grep -q "PCEmu bench" x64.log

  ios:
    name: iOS app
    needs: fex
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fex-dlls
          path: ios/Engine/fex

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project PCEmu.xcodeproj \
            -scheme PCEmu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/PCEmu.app build/ipa/Payload/
          # Ad-hoc signature so the entitlements (get-task-allow) travel with the app;
          # SideStore/AltStore re-sign it with the user's certificate.
          codesign --force --sign - --entitlements App/PCEmu.entitlements build/ipa/Payload/PCEmu.app
          cd build/ipa && zip -qry ../PCEmu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PCEmu-ipa
          path: ios/build/PCEmu.ipa
