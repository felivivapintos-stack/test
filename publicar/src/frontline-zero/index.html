<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Frontline Zero</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Fast military FPS in the browser: Team Deathmatch and Free-for-All against bots.">
<style>
:root {
  color-scheme: dark;
  --ink: #f2f4ef;
  --muted: #a9b0a3;
  --panel: rgba(16, 20, 18, 0.92);
  --panel-2: #222a25;
  --accent: #f2b33d;
  --accent-ink: #1b1405;
  --ally: #4d9bff;
  --enemy: #ff5544;
  --font: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #101411; color: var(--ink);
  font-family: var(--font); user-select: none; -webkit-user-select: none; touch-action: none;
}
canvas#game, canvas#tags { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
canvas#tags { pointer-events: none; z-index: 2; }
button { font-family: var(--font); cursor: pointer; border: 0; color: inherit; }
.hidden { display: none !important; }

#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }
#minimap {
  position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
  width: 168px; height: 168px; border-radius: 6px; background: rgba(10, 14, 12, 0.6);
  border: 1px solid rgba(255,255,255,0.15);
}
#scorebar {
  position: absolute; left: 50%; top: max(10px, env(safe-area-inset-top)); transform: translateX(-50%);
  display: flex; align-items: stretch; gap: 4px; font-weight: 700;
}
.sb { min-width: 64px; padding: 4px 12px; font-size: 26px; text-align: center; border-radius: 4px; }
.sb.ally { background: rgba(40, 110, 220, 0.75); }
.sb.enemy { background: rgba(210, 60, 45, 0.75); }
.sb-mid { background: rgba(10, 14, 12, 0.7); padding: 4px 14px; text-align: center; border-radius: 4px; }
#sb-time { font-size: 22px; letter-spacing: 1px; }
#sb-time.low { color: var(--enemy); }
#sb-mode { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

#feed {
  position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(56px, calc(env(safe-area-inset-top) + 44px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-size: 14px;
}
#feed div { background: rgba(10, 14, 12, 0.55); padding: 3px 9px; border-radius: 3px; animation: feedIn 0.2s ease-out; }
#feed .a { color: var(--ally); } #feed .e { color: var(--enemy); } #feed .me { color: var(--accent); }
#feed .w { color: var(--muted); font-size: 12px; margin: 0 6px; }
@keyframes feedIn { from { transform: translateX(20px); opacity: 0; } }

#xhair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transition: opacity 0.1s; }
#xhair i { position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
#xhair .l, #xhair .r { width: 9px; height: 2px; top: -1px; }
#xhair .t, #xhair .b { width: 2px; height: 9px; left: -1px; }
#xhair b { position: absolute; width: 2px; height: 2px; left: -1px; top: -1px; background: #fff; }
#xhair.enemy i, #xhair.enemy b { background: var(--enemy); }
#hitmark { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
#hitmark i { position: absolute; width: 10px; height: 2px; background: #fff; left: -5px; top: -1px; }
#hitmark i:nth-child(1) { transform: rotate(45deg) translateX(9px); }
#hitmark i:nth-child(2) { transform: rotate(135deg) translateX(9px); }
#hitmark i:nth-child(3) { transform: rotate(225deg) translateX(9px); }
#hitmark i:nth-child(4) { transform: rotate(315deg) translateX(9px); }
#hitmark.kill i { background: var(--enemy); }
#hitmark.show { animation: hit 0.25s ease-out; }
@keyframes hit { 0% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: scale(1); } }

#notices {
  position: absolute; left: 50%; top: 62%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
#notices div { font-weight: 700; font-size: 18px; color: var(--accent); animation: notice 1.6s ease-out forwards; white-space: nowrap; }
#notices div.big { font-size: 30px; color: #fff; letter-spacing: 2px; text-transform: uppercase; }
#notices div.bad { color: var(--enemy); }
@keyframes notice { 0% { opacity: 0; transform: translateY(8px) scale(1.15); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

#streaks {
  position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 4px; font-size: 13px;
}
#streaks div { background: rgba(10, 14, 12, 0.6); padding: 4px 10px; border-left: 3px solid #555; border-radius: 2px; min-width: 150px; }
#streaks div.ready { border-color: var(--accent); color: var(--accent); }
#streaks div.done { opacity: 0.45; }

#ammo {
  position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
  text-align: right;
}
#ammo-name { font-size: 14px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
#ammo-count b { font-size: 44px; line-height: 1; }
#ammo-count b.low { color: var(--enemy); }
#ammo-count span { font-size: 18px; color: var(--muted); margin-left: 6px; }
#ammo-extra { font-size: 14px; color: var(--muted); display: flex; gap: 12px; justify-content: flex-end; }
#ammo-hint { color: var(--accent); font-weight: 700; }
#hp {
  position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: 220px; height: 6px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden;
}
#hp-fill { height: 100%; width: 100%; background: #e9efe6; transition: width 0.1s; }
#hp-fill.low { background: var(--enemy); }
#blood {
  position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(150, 0, 0, 0.85) 100%);
}
#dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#dmgdir i {
  position: absolute; left: -60px; top: -170px; width: 120px; height: 40px; transform-origin: 60px 170px;
  background: radial-gradient(ellipse at 50% 100%, rgba(255, 40, 30, 0.85), transparent 70%);
  animation: dmg 1.2s ease-out forwards;
}
@keyframes dmg { from { opacity: 1; } to { opacity: 0; } }
#scope {
  position: absolute; inset: 0;
  background: radial-gradient(circle at center, transparent 0 34vmin, #000 34.3vmin);
}
#scope .ring {
  position: absolute; left: 50%; top: 50%; width: 68vmin; height: 68vmin; transform: translate(-50%, -50%);
  border-radius: 50%; border: 2px solid #000;
  background: linear-gradient(#000, #000) center / 100% 2px no-repeat, linear-gradient(#000, #000) center / 2px 100% no-repeat;
}
#death {
  position: absolute; left: 50%; top: 30%; transform: translateX(-50%); text-align: center;
  background: rgba(10, 14, 12, 0.7); padding: 12px 26px; border-radius: 4px;
}
#death-by { font-size: 22px; font-weight: 700; }
#death-by .e { color: var(--enemy); }
#death-t { font-size: 14px; color: var(--muted); margin-top: 4px; }
#btn-pause {
  position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
  width: 38px; height: 38px; border-radius: 4px; background: rgba(10, 14, 12, 0.6); pointer-events: auto; padding: 8px;
}
#btn-pause svg { fill: #fff; width: 100%; height: 100%; }
#click-to-play {
  position: absolute; left: 50%; top: 42%; transform: translateX(-50%);
  background: rgba(10,14,12,0.75); padding: 10px 22px; font-size: 18px; letter-spacing: 2px; text-transform: uppercase;
}

#board {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 8;
  background: var(--panel); padding: 16px 20px; border-radius: 6px; min-width: min(560px, 94vw);
  display: grid; gap: 14px;
}
#board table { width: 100%; border-collapse: collapse; font-size: 15px; }
#board th { text-align: left; color: var(--muted); font-weight: 400; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 6px; }
#board td { padding: 4px 6px; border-top: 1px solid rgba(255,255,255,0.06); }
#board td.n, #board th.n { text-align: right; width: 54px; }
#board tr.me td { color: var(--accent); font-weight: 700; }
#board h3 { margin: 0 0 4px; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
#board h3.a { color: var(--ally); } #board h3.e { color: var(--enemy); }

#overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: radial-gradient(ellipse at center, rgba(16, 22, 18, 0.55), rgba(5, 7, 6, 0.92));
  padding: 16px;
}
.panel { width: min(640px, 100%); max-height: 100%; overflow: auto; text-align: center; }
.logo { font-size: clamp(40px, 9vw, 72px); font-weight: 800; letter-spacing: 3px; line-height: 0.95; margin: 0; text-transform: uppercase; }
.logo span { color: var(--accent); }
.tag { color: var(--muted); margin: 10px 0 22px; letter-spacing: 1px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
.btn {
  background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 20px; letter-spacing: 2px;
  padding: 14px 34px; border-radius: 4px; text-transform: uppercase; transition: transform 0.1s, filter 0.1s;
}
.btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn.ghost { background: var(--panel-2); color: var(--ink); font-size: 15px; padding: 10px 18px; }
.btn.small { font-size: 14px; padding: 8px 14px; }
.seg { display: inline-flex; background: var(--panel-2); border-radius: 4px; padding: 3px; gap: 3px; }
.seg button { background: transparent; padding: 8px 14px; border-radius: 3px; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.seg button.on { background: var(--ink); color: #111; font-weight: 700; }
.label { font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin: 14px 0 6px; }
.guns { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.gun { background: var(--panel-2); border-radius: 4px; padding: 10px 8px; text-align: left; border: 2px solid transparent; }
.gun.on { border-color: var(--accent); }
.gun.locked { opacity: 0.45; cursor: default; }
.gun b { display: block; font-size: 14px; }
.gun small { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.bar { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.lvl { display: flex; align-items: center; gap: 10px; justify-content: center; color: var(--muted); font-size: 14px; }
.lvl .xp { width: 180px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.lvl .xp i { display: block; height: 100%; background: var(--accent); }
.result { font-size: clamp(36px, 8vw, 60px); font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
.result.win { color: var(--accent); } .result.lose { color: var(--enemy); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 18px 0; }
.stats div { background: var(--panel-2); padding: 10px 4px; border-radius: 4px; }
.stats b { display: block; font-size: 26px; }
.stats small { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.xplines { text-align: left; max-width: 320px; margin: 0 auto; font-size: 15px; }
.xplines div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.unlock { color: var(--accent); font-weight: 700; margin-top: 10px; }
.keys { color: var(--muted); font-size: 13px; line-height: 1.7; margin-top: 18px; }
kbd { background: var(--panel-2); border-radius: 3px; padding: 1px 6px; font-family: inherit; color: var(--ink); }
input[type=range] { width: 200px; accent-color: var(--accent); }

#touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
#stick {
  position: absolute; left: max(28px, env(safe-area-inset-left)); bottom: max(28px, env(safe-area-inset-bottom));
  width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2);
}
#knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.35); }
.tb {
  position: absolute; pointer-events: auto; border-radius: 50%; background: rgba(255,255,255,0.14);
  border: 2px solid rgba(255,255,255,0.3); font-weight: 700; font-size: 13px; letter-spacing: 1px;
}
.tb.on { background: rgba(242, 179, 61, 0.5); }
#t-fire { right: max(40px, env(safe-area-inset-right)); bottom: 120px; width: 84px; height: 84px; }
#t-ads { right: max(140px, env(safe-area-inset-right)); bottom: 150px; width: 56px; height: 56px; }
#t-jump { right: max(30px, env(safe-area-inset-right)); bottom: 30px; width: 56px; height: 56px; }
#t-crouch { right: max(100px, env(safe-area-inset-right)); bottom: 30px; width: 56px; height: 56px; }
#t-reload { right: max(170px, env(safe-area-inset-right)); bottom: 40px; width: 46px; height: 46px; }
#t-swap { right: max(140px, env(safe-area-inset-right)); bottom: 225px; width: 46px; height: 46px; }
#t-nade { right: max(60px, env(safe-area-inset-right)); bottom: 225px; width: 46px; height: 46px; }
body.touch #ammo { bottom: auto; top: 190px; }
body.touch #streaks { bottom: auto; top: 190px; }
@media (max-width: 640px) {
  #minimap { width: 110px; height: 110px; }
  .sb { font-size: 20px; min-width: 48px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}

</style>

<canvas id="game"></canvas>
<canvas id="tags"></canvas>

<div id="hud" class="hidden">

</div>

<script type="module">
// ---- data.js ----
// Game data: weapons, scorestreaks, levels, bot names. No logic here.

// range: metres before damage drops to `falloff` of its value.
// spread: radians (hip / aiming down sights). recoil: radians of pitch kick per shot.
const WEAPONS = {
  vanguard: {
    name: 'M7 Vanguard', kind: 'Assault rifle', slot: 0, unlock: 1, auto: true,
    dmg: 28, head: 1.5, rpm: 700, mag: 30, reserve: 150, reload: 2.1,
    range: 32, falloff: 0.72, hip: 0.05, ads: 0.006, recoil: 0.011, adsTime: 0.22, zoom: 1.35, move: 0.95,
    color: [0.22, 0.24, 0.26], len: 0.75,
  },
  kestrel: {
