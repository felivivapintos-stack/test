:root {
  --ink: #fff;
  --panel: #1d1838;
  --panel-2: #2c2456;
  --accent: #7dff6b;
  --accent-ink: #10230c;
  --muted: #b9b3e3;
  --gold: #ffd84d;
  --danger: #ff5a6e;
  --font-display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font: "Outfit", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #17122e; color: var(--ink);
  font-family: var(--font); user-select: none; -webkit-user-select: none; touch-action: none;
}
canvas { position: fixed; inset: 0; display: block; }
button { font-family: var(--font-display); cursor: pointer; border: 0; color: inherit; }
.hidden { display: none !important; }

#hud {
  position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
  pointer-events: none; z-index: 5; font-family: var(--font-display);
}
.hud-left, .hud-right { display: flex; gap: 8px; align-items: flex-start; flex: 1; }
.hud-right { justify-content: flex-end; }
.hud-right > * { pointer-events: auto; }
.pill {
  background: rgba(10, 8, 25, 0.6); border-radius: 999px; padding: 6px 14px; font-weight: 600;
  font-size: 17px; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px); white-space: nowrap;
}
#hud-time.low { color: #ffcf5a; animation: bump 1s ease-in-out infinite; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.hud-center { text-align: center; text-shadow: 0 3px 0 rgba(0,0,0,0.35); }
.rank { font-size: 34px; font-weight: 700; line-height: 1; }
.rank.first { color: var(--gold); }
.mass { font-size: 15px; color: var(--muted); font-weight: 600; }
.rank.bump { animation: bump 0.4s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 30% { transform: scale(1.25) rotate(-3deg); } 100% { transform: scale(1); } }

.board {
  list-style: none; margin: 0; padding: 8px 10px; min-width: 170px; background: rgba(10, 8, 25, 0.55);
  border-radius: 14px; font-size: 14px; backdrop-filter: blur(4px); pointer-events: none;
}
.board li { display: flex; gap: 6px; justify-content: space-between; padding: 1px 0; color: #e6e1ff; }
.board li .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
.board li.me { color: var(--accent); font-weight: 700; }
.board li.sep { justify-content: center; color: var(--muted); line-height: 0.6; }
.icon {
  width: 42px; height: 42px; border-radius: 50%; background: rgba(10, 8, 25, 0.6);
  display: grid; place-items: center; backdrop-filter: blur(4px); flex: none;
}
.icon svg { width: 22px; height: 22px; fill: #fff; }
.icon:hover, .icon:focus-visible { background: rgba(255, 255, 255, 0.2); outline: none; }

#xp {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom));
  width: min(420px, 60vw); height: 18px; background: rgba(10, 8, 25, 0.6); border-radius: 999px; overflow: hidden;
  z-index: 5; pointer-events: none;
}
#xp-fill { height: 100%; width: 0; background: linear-gradient(90deg, #5ad1ff, #b48cff); border-radius: 999px; transition: width 0.15s; }
#xp-level { position: absolute; inset: 0; display: grid; place-items: center; font: 700 12px var(--font-display); text-shadow: 0 1px 2px #000; }
#combo {
  position: fixed; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 28px); transform: translateX(-50%);
  font: 700 22px var(--font-display); color: #ff9f43; text-shadow: 0 3px 0 rgba(0,0,0,0.4); z-index: 5; pointer-events: none;
}

#banner {
  position: fixed; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; pointer-events: none;
  z-index: 4; width: min(92vw, 640px); animation: bannerIn 0.4s ease-out;
}
#banner.fade { transition: opacity 0.6s; opacity: 0; }
#banner-title { font: 700 clamp(26px, 5vw, 44px) var(--font-display); text-shadow: 0 4px 0 rgba(0,0,0,0.35); }
#banner-hint { margin-top: 6px; font-size: clamp(15px, 2.4vw, 20px); color: #f1edff; text-shadow: 0 2px 0 rgba(0,0,0,0.5); }
@keyframes bannerIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

#stick {
  position: fixed; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.25); z-index: 6; pointer-events: none;
}
#knob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.45);
}
#btn-dash {
  position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(40px, calc(env(safe-area-inset-bottom) + 28px));
  width: 88px; height: 88px; border-radius: 50%; background: rgba(255, 216, 77, 0.3); border: 2px solid rgba(255, 216, 77, 0.6);
  display: grid; place-items: center; z-index: 6; touch-action: none;
}
#btn-dash svg { width: 40px; height: 40px; fill: var(--gold); grid-area: 1 / 1; }
#btn-dash .ring { width: 100%; height: 100%; transform: rotate(-90deg); fill: none; }
#dash-ring { stroke: var(--gold); stroke-width: 6; stroke-dasharray: 289; stroke-dashoffset: 0; stroke-linecap: round; }
#btn-dash.cool { opacity: 0.55; }
#dash-key {
  position: fixed; right: 14px; bottom: 14px; font-size: 13px; color: var(--muted); z-index: 5; pointer-events: none;
}
kbd { background: rgba(255,255,255,0.14); border-radius: 6px; padding: 2px 6px; font: 600 12px var(--font); color: #fff; }

#overlay {
  position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
  background: rgba(8, 6, 20, 0.6); backdrop-filter: blur(3px); padding: 16px;
}
.panel {
  position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border-radius: 24px; padding: 22px 24px;
  width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; text-align: center;
  box-shadow: 0 12px 0 rgba(0, 0, 0, 0.3), 0 0 0 3px rgba(255, 255, 255, 0.08) inset; animation: pop 0.25s ease-out;
}
.panel.wide { width: min(760px, 100%); }
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
.panel h1 { margin: 0 0 4px; font: 700 clamp(28px, 6vw, 46px) var(--font-display); letter-spacing: 0.5px; line-height: 1.05; }
.panel h1.gold { color: var(--gold); text-shadow: 0 4px 0 #a86b00; }
.panel h2 { margin: 14px 0 8px; font: 600 15px var(--font-display); color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.panel p { margin: 6px 0; color: #e6e1ff; }
.big-rank { font: 700 clamp(56px, 14vw, 96px) var(--font-display); line-height: 1; margin: 6px 0; text-shadow: 0 6px 0 rgba(0,0,0,0.3); }
.big-rank small { font-size: 0.35em; color: var(--muted); }
.quip { color: var(--muted); min-height: 1.4em; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
.btn {
  background: rgba(255, 255, 255, 0.12); padding: 12px 20px; border-radius: 14px; font-weight: 600; font-size: 18px;
