<script type="module">
// ---- data.js ----
// Content tables shared by the simulation and the UI.
const PERKS = [
  { id: 'speed', name: 'Turbo Legs', desc: '+10% speed', icon: '💨', max: 5 },
  { id: 'magnet', name: 'Snack Magnet', desc: 'Pull crumbs from further away', icon: '🧲', max: 5 },
  { id: 'jaws', name: 'Mega Jaws', desc: 'Eat rivals closer to your size', icon: '🦷', max: 3 },
  { id: 'dash', name: 'Quick Dash', desc: 'Dash recharges 22% faster', icon: '⚡', max: 4 },
  { id: 'glutton', name: 'Glutton', desc: '+15% mass from snacks', icon: '🍩', max: 5 },
  { id: 'skin', name: 'Thick Skin', desc: 'Lose less to spikes, dashes and melting', icon: '🛡️', max: 3 },
  { id: 'combo', name: 'Combo King', desc: 'Combos last longer', icon: '🔥', max: 4 },
  { id: 'hunter', name: 'Hunter', desc: '+20% mass from eating rivals', icon: '🎯', max: 4 },
  { id: 'goldnose', name: 'Gold Nose', desc: 'Golden snacks give +50% mass', icon: '✨', max: 3 },
  { id: 'chonk', name: 'Instant Chonk', desc: 'Grow 15% right now', icon: '🍔', max: 6 },
];

const BOT_NAMES = [
  'NomNom', 'Chompy', 'Big Tony', 'xX_Gulp_Xx', 'Blobert', 'Mochi', 'Sir Snacks', 'Munchkin', 'Gloop',
  'Pudding', 'Jellybean', 'Marshmallow', 'Burp King', 'Wobbles', 'Taco', 'Dumpling', 'Noodle',
  'Grumble', 'Squishy', 'Bubbles', 'Tofu', 'Biscuit', 'Pickles', 'Waffle', 'Captain Crumb', 'Meatball',
  'Lil Gobbler', 'Snacky', 'Doughnut', 'Gummy', 'Nugget', 'Pancake',
];

// face: eyes style. price in coins; 0 = free.
const SKINS = [
  { id: 'lime', name: 'Limey', color: '#7dff6b', face: 'happy', price: 0 },
  { id: 'berry', name: 'Berry', color: '#ff5fa2', face: 'happy', price: 60 },
  { id: 'ocean', name: 'Ocean', color: '#4fc3ff', face: 'sleepy', price: 120 },
  { id: 'mango', name: 'Mango', color: '#ffb02e', face: 'angry', price: 200 },
  { id: 'grape', name: 'Grape', color: '#a77bff', face: 'cyclops', price: 300 },
  { id: 'cherry', name: 'Cherry', color: '#ff4848', face: 'angry', price: 450 },
  { id: 'mint', name: 'Minty', color: '#5cf2c8', face: 'star', price: 650 },
  { id: 'cool', name: 'Cool Cat', color: '#ffd84d', face: 'shades', price: 900 },
  { id: 'void', name: 'Void', color: '#3a2f6b', face: 'cyclops', price: 1300 },
  { id: 'rainbow', name: 'Rainbow', color: 'rainbow', face: 'star', price: 2000 },
];

const BOT_FACES = ['happy', 'angry', 'sleepy', 'cyclops', 'star', 'happy'];

// Permanent upgrades bought with coins between rounds.
const UPGRADES = [
  { id: 'start', name: 'Bigger Start', desc: '+3 starting mass', costs: [80, 160, 300, 500, 800] },
  { id: 'dash', name: 'Dash Training', desc: 'Dash recharges 8% faster', costs: [100, 220, 420, 700] },
  { id: 'coins', name: 'Piggy Bank', desc: '+15% coins per round', costs: [120, 260, 480, 800] },
];

// ---- sim.js ----
// Deterministic game simulation. No DOM: the balance tool (tools/balance.mjs) runs it in Node.

const ARENA = 3200;
const ROUND_TIME = 180;
const FRENZY_TIME = 30; // last seconds: gold rain
const DT = 1 / 60;
const CELL = 100;
const GRID = Math.ceil(ARENA / CELL);
const CRUMBS = 1100;
const CRITTERS = 70;
const GOLDS = 3;
const SPIKES = [40, 40, 40, 40, 40, 100, 100, 100, 100, 250, 250, 250, 250, 600];
const BASE_EAT = 1.25;
const BOT_COLORS = ['#ff6b8b', '#ffb84d', '#5ad1ff', '#b48cff', '#ff8f5a', '#4de3a5', '#ffd84d', '#ff7ad9', '#7d9bff', '#9be15d', '#ff5a5a', '#5af0e0'];

const radius = (mass) => 4.5 * Math.sqrt(mass);

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function xpNeed(level) { return Math.round(12 * Math.pow(1.42, level)); }

function makeBlob(S, { name, color, skin, isPlayer, mass, skill }) {
  const a = S.rand() * Math.PI * 2, d = 300 + S.rand() * (ARENA / 2 - 450);
  return {
    id: S.nextId++, name, color, skin, isPlayer, skill,
    x: ARENA / 2 + Math.cos(a) * d, y: ARENA / 2 + Math.sin(a) * d,
    vx: 0, vy: 0, dirX: Math.cos(a + Math.PI), dirY: Math.sin(a + Math.PI),
    mass, peak: mass, r: radius(mass), alive: true, placement: 0,
    dashCd: 0, dashT: 0, spikeT: 0, spawnT: 3,
    combo: 0, comboT: 0, kills: 0, eaten: 0, xp: 0, level: 0, pendingLevels: 0,
    perks: {}, killer: null, gold: 0,
    ai: { t: 0, tx: 0, ty: 0, dash: false, wanderA: a },
  };
}

function perkLevel(b, id) { return b.perks[id] || 0; }

function eatRatio(b) { return Math.max(1.1, BASE_EAT - 0.04 * perkLevel(b, 'jaws')); }

function blobSpeed(b) {
  return 270 * Math.pow(b.mass, -0.17) * (1 + 0.1 * perkLevel(b, 'speed'));
}

function dashCooldown(b, S) {
  return 2.6 * Math.pow(0.78, perkLevel(b, 'dash')) * (b.isPlayer ? S.meta.dashMul : 1);
}

function magnetRange(b) { return b.r * 0.6 + 26 * perkLevel(b, 'magnet') + 10; }

function comboWindow(b) { return 1.3 + 0.45 * perkLevel(b, 'combo'); }

function canEat(a, b) { return a.mass >= b.mass * eatRatio(a); }

function spawnFood(S, kind, x, y, mass) {
  if (x === undefined) {
    if (kind === 'crumb' && S.rand() < 0.55 && S.patches.length) {
      const p = S.patches[Math.floor(S.rand() * S.patches.length)];
      const a = S.rand() * Math.PI * 2, d = Math.sqrt(S.rand()) * p.r;
      x = p.x + Math.cos(a) * d; y = p.y + Math.sin(a) * d;
    } else {
      x = 40 + S.rand() * (ARENA - 80); y = 40 + S.rand() * (ARENA - 80);
    }
  }
  if (mass === undefined) {
    if (kind === 'crumb') mass = 1 + (S.rand() < 0.15 ? 1 : 0);
    else if (kind === 'critter') mass = 3 + Math.floor(Math.pow(S.rand(), 2.5) * 36);
    else if (kind === 'gold') mass = 22;
    else mass = 1;
  }
  const f = {
    id: S.nextId++, kind, x: clampA(x), y: clampA(y), vx: 0, vy: 0, mass,
    r: kind === 'crumb' ? 4 + mass * 1.5 : kind === 'bit' ? Math.min(14, 4 + Math.sqrt(mass) * 1.6) : radius(mass) * 0.85,
    hue: Math.floor(S.rand() * 6), a: S.rand() * Math.PI * 2, t: S.rand() * 10, dead: false, age: 0,
  };
  S.food.push(f);
  return f;
}

function clampA(v) { return Math.max(20, Math.min(ARENA - 20, v)); }

function spawnSpike(S, mass) {
  for (let tries = 0; tries < 30; tries++) {
    const x = 150 + S.rand() * (ARENA - 300), y = 150 + S.rand() * (ARENA - 300);
    let ok = true;
    for (const s of S.spikes) if (Math.hypot(s.x - x, s.y - y) < 260) { ok = false; break; }
    for (const b of S.blobs) if (b.alive && Math.hypot(b.x - x, b.y - y) < b.r + 120) { ok = false; break; }
    if (ok || tries === 29) {
      S.spikes.push({ id: S.nextId++, x, y, mass, r: radius(mass) * 0.9, dead: false, respawn: 0, rot: S.rand() * 6 });
      return;
    }
  }
}

function createGame({ seed = 1, playerName = 'You', skin = 'lime', color = '#7dff6b', meta = {}, bots = 11, difficulty = 1 } = {}) {
  const S = {
    rand: rng(seed), t: 0, nextId: 1, over: false, result: null,
    blobs: [], food: [], spikes: [], events: [], patches: [],
    grid: Array.from({ length: GRID * GRID }, () => []),
    meta: { startMass: 10, dashMul: 1, ...meta },
    aliveCount: 0, frenzy: false, foodTimer: 0, difficulty,
  };
  for (let i = 0; i < 9; i++) {
    S.patches.push({ x: 300 + S.rand() * (ARENA - 600), y: 300 + S.rand() * (ARENA - 600), r: 120 + S.rand() * 160 });
  }
  S.player = makeBlob(S, { name: playerName, color, skin, isPlayer: true, mass: S.meta.startMass, skill: 1 });
  S.player.x = ARENA / 2; S.player.y = ARENA / 2;
  S.blobs.push(S.player);
  const names = BOT_NAMES.slice();
  for (let i = 0; i < bots; i++) {
    const n = names.splice(Math.floor(S.rand() * names.length), 1)[0];
    // Skill spread: a couple of sharks, most are average, a few are snacks.
    let skill = i < 2 ? 0.85 + S.rand() * 0.15 : i < 8 ? 0.45 + S.rand() * 0.35 : 0.15 + S.rand() * 0.25;
    skill *= 0.5 + 0.5 * difficulty;
    const b = makeBlob(S, { name: n, color: BOT_COLORS[i % BOT_COLORS.length], skin: 'bot' + (i % 6), isPlayer: false, mass: 9.5 + S.rand() * 1.5, skill });
    S.blobs.push(b);
  }
  // Keep bots from spawning on top of the player.
  for (const b of S.blobs) {
    if (b.isPlayer) continue;
    while (Math.hypot(b.x - S.player.x, b.y - S.player.y) < 420) {
      const a = S.rand() * Math.PI * 2, d = 500 + S.rand() * 900;
      b.x = clampA(ARENA / 2 + Math.cos(a) * d); b.y = clampA(ARENA / 2 + Math.sin(a) * d);
    }
  }
  for (let i = 0; i < CRUMBS; i++) spawnFood(S, 'crumb');
  for (let i = 0; i < CRITTERS; i++) spawnFood(S, 'critter');
  for (let i = 0; i < GOLDS; i++) spawnFood(S, 'gold');
  for (const m of SPIKES) spawnSpike(S, m);
  S.aliveCount = S.blobs.length;
  return S;
}

function rebuildGrid(S) {
  for (const c of S.grid) c.length = 0;
  for (const f of S.food) {
    if (f.dead) continue;
    const cx = Math.min(GRID - 1, Math.max(0, Math.floor(f.x / CELL)));
    const cy = Math.min(GRID - 1, Math.max(0, Math.floor(f.y / CELL)));
    S.grid[cy * GRID + cx].push(f);
  }
}

function queryFood(S, x, y, r, out = []) {
  out.length = 0;
  const x0 = Math.max(0, Math.floor((x - r) / CELL)), x1 = Math.min(GRID - 1, Math.floor((x + r) / CELL));
  const y0 = Math.max(0, Math.floor((y - r) / CELL)), y1 = Math.min(GRID - 1, Math.floor((y + r) / CELL));
  for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) {
    const c = S.grid[cy * GRID + cx];
    for (let i = 0; i < c.length; i++) out.push(c[i]);
  }
  return out;
}

function addMass(S, b, m, src) {
  let gain = m;
  if (src === 'food') gain *= 1 + 0.15 * perkLevel(b, 'glutton');
  if (src === 'blob') gain *= 1 + 0.2 * perkLevel(b, 'hunter');
  if (src === 'gold') gain *= 1 + 0.5 * perkLevel(b, 'goldnose');
  if (src !== 'bit') {
    b.combo = b.comboT > 0 ? b.combo + 1 : 1;
    b.comboT = comboWindow(b);
    gain *= 1 + Math.min(0.5, (b.combo - 1) * 0.03);
  }
  b.mass += gain;
  b.xp += gain;
  b.eaten += gain;
  if (b.mass > b.peak) b.peak = b.mass;
  while (b.xp >= xpNeed(b.level + 1)) {
    b.xp -= xpNeed(b.level + 1);
    b.level++;
    if (b.isPlayer) { b.pendingLevels++; S.events.push({ type: 'levelup', level: b.level }); }
    else botPickPerk(S, b);
  }
  return gain;
}

function botPickPerk(S, b) {
  const opts = PERKS.filter((p) => perkLevel(b, p.id) < p.max);
  if (!opts.length) return;
  const p = opts[Math.floor(S.rand() * opts.length)];
  b.perks[p.id] = perkLevel(b, p.id) + 1;
}

// Three distinct perk options for the player, weighted away from maxed ones.
function rollPerks(S) {
  const b = S.player;
  const opts = PERKS.filter((p) => perkLevel(b, p.id) < p.max);
  const out = [];
  while (out.length < 3 && opts.length) out.push(opts.splice(Math.floor(S.rand() * opts.length), 1)[0]);
  return out;
}

function choosePerk(S, id) {
  const b = S.player;
  if (b.pendingLevels <= 0) return;
  b.pendingLevels--;
  b.perks[id] = perkLevel(b, id) + 1;
  if (id === 'chonk') addMassRaw(b, Math.max(8, b.mass * 0.15));
}

function addMassRaw(b, m) { b.mass += m; if (b.mass > b.peak) b.peak = b.mass; }

function loseMass(S, b, frac, x, y, vx, vy) {
  const lost = b.mass * frac * Math.pow(0.6, perkLevel(b, 'skin'));
  b.mass = Math.max(8, b.mass - lost);
  // Spray what you lose as bits for everyone else to snack on.
  const n = Math.min(14, Math.max(3, Math.floor(lost / 6)));
  for (let i = 0; i < n; i++) {
    const a = S.rand() * Math.PI * 2, sp = 140 + S.rand() * 220;
    const f = spawnFood(S, 'bit', x, y, lost / n);
    f.vx = Math.cos(a) * sp + (vx || 0) * 0.3; f.vy = Math.sin(a) * sp + (vy || 0) * 0.3;
    f.color = b.color;
  }
  return lost;
}

function kill(S, eater, victim) {
  victim.alive = false;
  victim.killer = eater.name;
  victim.placement = S.aliveCount;
  S.aliveCount--;
  eater.kills++;
  const gain = addMass(S, eater, victim.mass * 0.8, 'blob');
  if (eater.isPlayer) eater.gold += 3 + Math.round(victim.mass / 25);
  S.events.push({ type: 'kill', eater: eater.id, victim: victim.id, x: victim.x, y: victim.y, mass: victim.mass, gain, color: victim.color, name: victim.name });
  if (victim.isPlayer) S.events.push({ type: 'playerDead', by: eater.name });
}

// ---------- AI ----------
const tmp = [];
function think(S, b) {
  const ai = b.ai;
  const view = 260 + b.r * 5;
  let fx = 0, fy = 0, threat = 0;
  let best = null, bestScore = 0;
  ai.dash = false;
  for (const o of S.blobs) {
    if (o === b || !o.alive) continue;
    const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy) || 1;
    if (d > view + o.r) continue;
    if (canEat(o, b) && o.spawnT <= 0) {
      // Flee: stronger the closer it is. Low-skill bots notice danger later.
      const reach = o.r + b.r + 140 + 260 * b.skill;
      if (d < reach) {
        const w = (reach - d) / reach;
        fx -= (dx / d) * w * 3; fy -= (dy / d) * w * 3; threat = Math.max(threat, w);
        if (d < o.r + b.r + 60 && S.rand() < b.skill) ai.dash = true;
      }
    } else if (canEat(b, o) && o.spawnT <= 0) {
      // On easy rounds bots would rather hunt each other than the player.
      const score = (o.mass * (0.6 + b.skill)) / (d + 80) * (o.isPlayer ? 0.35 + 0.75 * S.difficulty : 1);
      if (score > bestScore) { bestScore = score; best = o; }
    }
  }
  for (const s of S.spikes) {
    if (s.dead) continue;
    const dx = s.x - b.x, dy = s.y - b.y, d = Math.hypot(dx, dy) || 1;
    if (spikeHurts(b, s) && d < s.r + b.r + 90 * b.skill) {
      const w = 1 - d / (s.r + b.r + 90);
      fx -= (dx / d) * w * 2; fy -= (dy / d) * w * 2;
    } else if (b.mass >= s.mass * 1.4) {
      const score = s.mass / (d + 80);
      if (score > bestScore) { bestScore = score; best = s; }
    }
  }
  queryFood(S, b.x, b.y, Math.min(view, 520), tmp);
  for (const f of tmp) {
    if (f.dead || f.r > b.r * 0.9) continue;
    const d = Math.hypot(f.x - b.x, f.y - b.y);
    const score = (f.mass * (f.kind === 'gold' ? 2 : 1)) / (d + 60) * (0.7 + 0.3 * b.skill);
    if (score > bestScore) { bestScore = score; best = f; }
  }
  let tx, ty;
  if (best) {
    const lead = best.vx !== undefined ? 0.25 * b.skill : 0;
    tx = best.x + (best.vx || 0) * lead - b.x; ty = best.y + (best.vy || 0) * lead - b.y;
    const d = Math.hypot(tx, ty) || 1;
    tx /= d; ty /= d;
    if (best.alive !== undefined && d < b.r * 3 + 120 && S.rand() < b.skill * (best.isPlayer ? 0.3 + 0.5 * S.difficulty : 0.8) && threat < 0.2) ai.dash = true;
  } else {
    ai.wanderA += (S.rand() - 0.5) * 1.2;
    tx = Math.cos(ai.wanderA); ty = Math.sin(ai.wanderA);
  }
  // Danger outweighs hunger; tug toward the middle when near the walls.
  const wTarget = threat > 0 ? Math.max(0.2, 1 - threat * 1.5) : 1;
  let mx = tx * wTarget + fx, my = ty * wTarget + fy;
  const edge = 220;
  if (b.x < edge) mx += (edge - b.x) / edge * 2;
  if (b.x > ARENA - edge) mx -= (b.x - (ARENA - edge)) / edge * 2;
  if (b.y < edge) my += (edge - b.y) / edge * 2;
  if (b.y > ARENA - edge) my -= (b.y - (ARENA - edge)) / edge * 2;
  const m = Math.hypot(mx, my) || 1;
  ai.tx = mx / m; ai.ty = my / m;
  ai.t = 0.12 + (1 - b.skill) * 0.35 + S.rand() * 0.1;
}

function spikeHurts(b, s) { return b.mass > 16 && b.mass < s.mass * 1.4; }

// ---------- Step ----------
function step(S, input) {
  // spectate: keep the arena alive behind the death screen.
  if (S.over && !(S.spectate && S.t < ROUND_TIME)) return;
  const dt = DT;
  S.t += dt;
  const timeLeft = ROUND_TIME - S.t;
  if (!S.frenzy && timeLeft <= FRENZY_TIME) { S.frenzy = true; S.events.push({ type: 'frenzy' }); }

  rebuildGrid(S);

  // Steering
  for (const b of S.blobs) {
    if (!b.alive) continue;
    let ix = 0, iy = 0, dash = false;
    if (b.isPlayer) {
      ix = input.x || 0; iy = input.y || 0; dash = !!input.dash;
    } else {
      b.ai.t -= dt;
      if (b.ai.t <= 0) think(S, b);
      ix = b.ai.tx; iy = b.ai.ty; dash = b.ai.dash;
    }
    const mag = Math.min(1, Math.hypot(ix, iy));
    if (mag > 0.05) { b.dirX = ix / Math.hypot(ix, iy); b.dirY = iy / Math.hypot(ix, iy); }
    const sp = blobSpeed(b) * mag;
    b.dashCd = Math.max(0, b.dashCd - dt);
    b.spikeT = Math.max(0, b.spikeT - dt);
    b.spawnT = Math.max(0, b.spawnT - dt);
    if (dash && b.dashCd <= 0 && b.mass >= 14) {
      b.dashCd = dashCooldown(b, S);
      b.dashT = 0.24;
      const cost = b.mass * 0.03 * Math.pow(0.6, perkLevel(b, 'skin'));
      b.mass -= cost;
      const f = spawnFood(S, 'bit', b.x - b.dirX * b.r, b.y - b.dirY * b.r, cost);
      f.vx = -b.dirX * 120; f.vy = -b.dirY * 120; f.color = b.color; f.owner = b.id; f.ownerT = 0.6;
      S.events.push({ type: 'dash', id: b.id, x: b.x, y: b.y });
      b.vx = b.dirX * blobSpeed(b) * 2.8; b.vy = b.dirY * blobSpeed(b) * 2.8;
    }
    if (b.dashT > 0) {
      b.dashT -= dt;
    } else {
      const k = Math.min(1, dt * 7);
      b.vx += (b.dirX * sp - b.vx) * k;
      b.vy += (b.dirY * sp - b.vy) * k;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    const lim = b.r * 0.5;
    if (b.x < lim) { b.x = lim; b.vx = 0; }
    if (b.y < lim) { b.y = lim; b.vy = 0; }
    if (b.x > ARENA - lim) { b.x = ARENA - lim; b.vx = 0; }
    if (b.y > ARENA - lim) { b.y = ARENA - lim; b.vy = 0; }
    b.comboT -= dt;
    if (b.comboT <= 0) b.combo = 0;
    // Big blobs slowly melt so the leader can be caught.
    if (b.mass > 120) b.mass -= (b.mass - 120) * 0.006 * (1 + b.mass / 1500) * Math.pow(0.6, perkLevel(b, 'skin')) * dt;
    b.r = radius(b.mass);
  }

  // Food behaviour
  for (const f of S.food) {
    if (f.dead) continue;
    f.t += dt; f.age += dt;
    if (f.ownerT) f.ownerT -= dt;
    if (f.kind === 'critter' || f.kind === 'gold') {
      // Flee from anything that could eat it.
      let fx = 0, fy = 0;
      for (const b of S.blobs) {
        if (!b.alive || f.r > b.r * 0.9) continue;
        const dx = f.x - b.x, dy = f.y - b.y, d = Math.hypot(dx, dy);
        const range = b.r + (f.kind === 'gold' ? 230 : 140);
        if (d < range && d > 0) { const w = (range - d) / range; fx += dx / d * w; fy += dy / d * w; }
      }
      const base = (f.kind === 'gold' ? 0.95 : 0.68) * 270 * Math.pow(f.mass, -0.17);
      if (fx || fy) {
        const m = Math.hypot(fx, fy);
        f.a = Math.atan2(fy, fx);
        f.vx += (fx / m * base - f.vx) * Math.min(1, dt * 5);
        f.vy += (fy / m * base - f.vy) * Math.min(1, dt * 5);
      } else {
        f.a += (S.rand() - 0.5) * 3 * dt;
        f.vx += (Math.cos(f.a) * base * 0.3 - f.vx) * Math.min(1, dt * 2);
        f.vy += (Math.sin(f.a) * base * 0.3 - f.vy) * Math.min(1, dt * 2);
      }
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 30 || f.x > ARENA - 30) { f.vx *= -1; f.a = Math.PI - f.a; }
      if (f.y < 30 || f.y > ARENA - 30) { f.vy *= -1; f.a = -f.a; }
      f.x = clampA(f.x); f.y = clampA(f.y);
    } else if (f.vx || f.vy) {
      f.x += f.vx * dt; f.y += f.vy * dt;
      const k = Math.pow(0.04, dt);
      f.vx *= k; f.vy *= k;
      if (Math.abs(f.vx) + Math.abs(f.vy) < 2) { f.vx = 0; f.vy = 0; }
      f.x = clampA(f.x); f.y = clampA(f.y);
    }
  }

  // Eating food (plus magnet)
  for (const b of S.blobs) {
    if (!b.alive) continue;
    const mr = magnetRange(b);
    queryFood(S, b.x, b.y, b.r + mr + 20, tmp);
    for (const f of tmp) {
      if (f.dead || f.r > b.r * 0.9) continue;
      if (f.owner === b.id && f.ownerT > 0) continue;
      const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy);
      if (d < b.r - f.r * 0.3) {
        f.dead = true;
        const src = f.kind === 'gold' ? 'gold' : f.kind === 'bit' ? 'bit' : 'food';
        const gain = addMass(S, b, f.mass, src);
        if (f.kind === 'gold' && b.isPlayer) b.gold += 5;
        if (b.isPlayer || f.kind === 'gold') S.events.push({ type: 'eat', id: b.id, kind: f.kind, x: f.x, y: f.y, gain, combo: b.combo, hue: f.hue, player: b.isPlayer });
      } else if ((f.kind === 'crumb' || f.kind === 'bit') && d < b.r + mr && d > 0) {
        const pull = (1 - (d - b.r) / mr) * 380 * dt;
        f.x += dx / d * pull; f.y += dy / d * pull;
      }
    }
  }

  // Spikes
  for (const s of S.spikes) {
    if (s.dead) { s.respawn -= dt; continue; }
    s.rot += dt * 0.3;
    for (const b of S.blobs) {
      if (!b.alive) continue;
      const d = Math.hypot(b.x - s.x, b.y - s.y);
      if (b.mass >= s.mass * 1.4) {
        if (d < b.r - s.r * 0.3) {
          s.dead = true; s.respawn = 12;
          addMass(S, b, s.mass * 0.5, 'food');
          S.events.push({ type: 'spikeEat', id: b.id, x: s.x, y: s.y, player: b.isPlayer });
          break;
        }
      } else if (spikeHurts(b, s) && b.spikeT <= 0 && d < b.r + s.r * 0.75) {
        b.spikeT = 1.2;
        const lost = loseMass(S, b, 0.22, b.x, b.y, b.vx, b.vy);
        const nx = (b.x - s.x) / (d || 1), ny = (b.y - s.y) / (d || 1);
        b.vx = nx * 420; b.vy = ny * 420; b.dashT = 0.18;
        b.combo = 0;
        S.events.push({ type: 'spike', id: b.id, x: b.x, y: b.y, lost, player: b.isPlayer });
      }
    }
  }
  for (let i = S.spikes.length - 1; i >= 0; i--) {
    const s = S.spikes[i];
    if (s.dead && s.respawn <= 0) { S.spikes.splice(i, 1); spawnSpike(S, s.mass); }
  }

  // Blob vs blob
  const alive = S.blobs.filter((b) => b.alive).sort((a, b) => b.mass - a.mass);
  for (let i = 0; i < alive.length; i++) {
    const a = alive[i];
    if (!a.alive) continue;
    for (let j = i + 1; j < alive.length; j++) {
      const v = alive[j];
      if (!v.alive || v.spawnT > 0 || a.spawnT > 0) continue;
      if (!canEat(a, v)) continue;
      const d = Math.hypot(a.x - v.x, a.y - v.y);
      if (d < a.r - v.r * 0.35) kill(S, a, v);
    }
  }

  // Cleanup + respawn food
  if (S.food.some((f) => f.dead) ) S.food = S.food.filter((f) => !f.dead && !(f.kind === 'bit' && f.age > 40));
  S.foodTimer -= dt;
  if (S.foodTimer <= 0) {
    S.foodTimer = 0.25;
    let crumbs = 0, critters = 0, golds = 0;
    for (const f of S.food) { if (f.kind === 'crumb') crumbs++; else if (f.kind === 'critter') critters++; else if (f.kind === 'gold') golds++; }
    const crumbTarget = S.frenzy ? CRUMBS * 1.4 : CRUMBS;
    for (let k = 0; k < (S.frenzy ? 20 : 10) && crumbs < crumbTarget; k++, crumbs++) spawnFood(S, 'crumb');
    if (critters < CRITTERS) spawnFood(S, 'critter');
    if (golds < (S.frenzy ? 14 : GOLDS) && S.rand() < (S.frenzy ? 0.6 : 0.05)) spawnFood(S, 'gold');
  }

  // End conditions
  if (!S.over && (!S.player.alive || S.t >= ROUND_TIME || S.aliveCount <= 1)) finish(S);
}

// Called by the revive flow: the player comes back where they died with half their peak.
function revive(S) {
  const p = S.player;
  if (p.alive) return;
  p.alive = true; S.aliveCount++;
  p.mass = Math.max(S.meta.startMass, p.peak * 0.5);
  p.r = radius(p.mass);
  p.spawnT = 3; p.vx = 0; p.vy = 0; p.combo = 0;
  // Pop somewhere safe: far from anyone who could eat us.
  let bestX = p.x, bestY = p.y, bestD = -1;
  for (let k = 0; k < 40; k++) {
    const x = 200 + S.rand() * (ARENA - 400), y = 200 + S.rand() * (ARENA - 400);
    let dmin = 1e9;
    for (const b of S.blobs) if (b.alive && b !== p && canEat(b, p)) dmin = Math.min(dmin, Math.hypot(b.x - x, b.y - y) - b.r);
    if (dmin > bestD) { bestD = dmin; bestX = x; bestY = y; }
  }
  p.x = bestX; p.y = bestY;
  S.over = false; S.result = null; S.spectate = false;
  S.events.push({ type: 'revive' });
}

function finish(S) {
  S.over = true;
  const alive = S.blobs.filter((b) => b.alive).sort((a, b) => b.mass - a.mass);
  alive.forEach((b, i) => { b.placement = i + 1; });
  const p = S.player;
  S.result = {
    placement: p.placement, alive: p.alive, killer: p.killer,
    mass: Math.round(p.alive ? p.mass : p.peak), peak: Math.round(p.peak), kills: p.kills, time: S.t,
    level: p.level, gold: p.gold, timeUp: S.t >= ROUND_TIME,
  };
}

function leaderboard(S) {
  return S.blobs.filter((b) => b.alive).sort((a, b) => b.mass - a.mass);
}

// Drives a blob with the bot brain (used by the balance tool and the attract mode).
function autopilot(S, b, skill = 0.7) {
  const saved = b.skill;
  b.skill = skill;
  b.ai.t -= DT;
  if (b.ai.t <= 0) think(S, b);
  b.skill = saved;
  return { x: b.ai.tx, y: b.ai.ty, dash: b.ai.dash };
}

// ---- render.js ----

const CRUMB_COLORS = ['#ff6b8b', '#ffd84d', '#5ad1ff', '#7dff6b', '#ff9f43', '#c58bff'];
const TAU = Math.PI * 2;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt > 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

class Renderer {
  constructor(canvas) {
    this.c = canvas;
    this.g = canvas.getContext('2d');
    this.cam = { x: ARENA / 2, y: ARENA / 2, s: 1 };
    this.parts = [];
    this.texts = [];
    this.shake = 0;
    this.time = 0;
    this.anim = new Map(); // per blob: { gulp, hurt }
    this.resize();
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.dpr = dpr;
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.c.width = Math.round(this.w * dpr); this.c.height = Math.round(this.h * dpr);
    this.c.style.width = this.w + 'px'; this.c.style.height = this.h + 'px';
  }

  reset() { this.parts.length = 0; this.texts.length = 0; this.anim.clear(); this.shake = 0; this.snap = true; }

  blobAnim(id) {
    let a = this.anim.get(id);
    if (!a) { a = { gulp: 0, hurt: 0 }; this.anim.set(id, a); }
    return a;
  }

  // ---------- effects ----------
  burst(x, y, color, n, speed, size) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, sp = speed * (0.4 + Math.random() * 0.8);
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.4, t: 0, size: size * (0.5 + Math.random()), color });
    }
  }

  say(text, x, y, color = '#fff', size = 22, life = 0.9) {
    this.texts.push({ text, x, y, color, size, life, t: 0 });
    if (this.texts.length > 30) this.texts.shift();
  }

  event(e, S) {
    const p = S.player;
    switch (e.type) {
      case 'eat': {
        if (e.player) {
          this.blobAnim(e.id).gulp = 1;
          const col = e.kind === 'gold' ? '#ffd84d' : CRUMB_COLORS[e.hue % 6];
          if (e.kind !== 'crumb') this.burst(e.x, e.y, col, e.kind === 'gold' ? 14 : 6, 160, 4);
          if (e.kind === 'gold') this.say('GOLDEN!', e.x, e.y - 20, '#ffd84d', 26);
          else if (e.kind === 'critter') this.say('+' + Math.round(e.gain), e.x, e.y - 10, '#fff', 18);
          if (e.combo === 5 || e.combo === 10 || e.combo === 25 || (e.combo >= 50 && e.combo % 50 === 0)) this.say(`x${e.combo} COMBO!`, p.x, p.y - p.r - 26, '#ff9f43', 28, 1.1);
        }
        break;
      }
      case 'kill': {
        this.blobAnim(e.eater).gulp = 1.4;
        this.burst(e.x, e.y, e.color, 26, 320, 7);
        const near = Math.hypot(e.x - p.x, e.y - p.y) < 900 / this.cam.s;
        if (e.eater === p.id) {
          this.say('GULP!', e.x, e.y - 30, '#7dff6b', 40, 1.2);
          this.say(`+${Math.round(e.gain)}  ${e.name}`, e.x, e.y + 14, '#fff', 20, 1.2);
          this.shake = Math.max(this.shake, 14);
        } else if (near) this.shake = Math.max(this.shake, 6);
        break;
      }
      case 'spike':
        this.blobAnim(e.id).hurt = 1;
        this.burst(e.x, e.y, '#9be15d', 12, 260, 5);
        if (e.player) { this.say('OUCH! -' + Math.round(e.lost), e.x, e.y - 40, '#ff6b6b', 28); this.shake = Math.max(this.shake, 12); }
        break;
      case 'spikeEat':
        this.burst(e.x, e.y, '#9be15d', 18, 240, 6);
        if (e.player) this.say('CRUNCH!', e.x, e.y - 30, '#9be15d', 30);
        break;
      case 'dash':
        this.burst(e.x, e.y, 'rgba(255,255,255,0.7)', 8, 120, 5);
        break;
    }
  }

  // ---------- frame ----------
  draw(S, dt, opts = {}) {
    const g = this.g, p = S.player;
    this.time += dt;
    const focus = p.alive || !opts.follow ? p : opts.follow;
    const targetS = Math.min(this.w, this.h) / (520 + focus.r * 7.5) * (this.w < 700 ? 0.9 : 1);
    const k = this.snap ? 1 : 1 - Math.pow(0.02, dt);
    this.cam.x += (focus.x - this.cam.x) * k;
    this.cam.y += (focus.y - this.cam.y) * k;
    this.cam.s += (targetS - this.cam.s) * (this.snap ? 1 : 1 - Math.pow(0.2, dt));
    this.snap = false;
    this.shake *= Math.pow(0.002, dt);
    const sx = (Math.random() - 0.5) * this.shake, sy = (Math.random() - 0.5) * this.shake;
    const s = this.cam.s;
    const vw = this.w / s, vh = this.h / s;
    const left = this.cam.x - vw / 2, top = this.cam.y - vh / 2;
    this.view = { left, top, right: left + vw, bottom: top + vh };

    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.fillStyle = '#17122e';
    g.fillRect(0, 0, this.w, this.h);
    g.setTransform(this.dpr * s, 0, 0, this.dpr * s, this.dpr * (this.w / 2 - this.cam.x * s + sx), this.dpr * (this.h / 2 - this.cam.y * s + sy));

    this.drawFloor(g, S);
    const inView = (x, y, r) => x + r > left && x - r < left + vw && y + r > top && y - r < top + vh;

    for (const f of S.food) {
      if (f.dead || !inView(f.x, f.y, f.r + 4)) continue;
      if (f.kind === 'crumb') this.drawCrumb(g, f);
      else if (f.kind === 'bit') this.drawBit(g, f);
    }
    for (const sp of S.spikes) if (!sp.dead && inView(sp.x, sp.y, sp.r * 1.4)) this.drawSpike(g, sp, p);
    for (const f of S.food) {
      if (f.dead || !inView(f.x, f.y, f.r + 4)) continue;
      if (f.kind === 'critter') this.drawCritter(g, f, p);
      else if (f.kind === 'gold') this.drawGold(g, f);
    }
    const blobs = S.blobs.filter((b) => b.alive).sort((a, b) => a.mass - b.mass);
    const leader = blobs[blobs.length - 1];
    for (const b of blobs) if (inView(b.x, b.y, b.r * 1.3 + 40)) this.drawBlob(g, b, p, b === leader && blobs.length > 1, dt);

    // particles
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const q = this.parts[i];
      q.t += dt;
      if (q.t >= q.life) { this.parts.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92;
      g.globalAlpha = 1 - q.t / q.life;
      g.fillStyle = q.color;
      g.beginPath(); g.arc(q.x, q.y, q.size, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;

    // floating texts (fixed screen size)
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.t += dt;
      if (t.t >= t.life) { this.texts.splice(i, 1); continue; }
      const u = t.t / t.life;
      const pop = u < 0.15 ? 0.6 + u / 0.15 * 0.5 : 1.1 - Math.min(0.1, (u - 0.15));
      g.globalAlpha = u > 0.7 ? 1 - (u - 0.7) / 0.3 : 1;
      g.font = `700 ${(t.size * pop) / s}px Fredoka, sans-serif`;
      g.lineWidth = 5 / s; g.strokeStyle = 'rgba(20,12,40,0.85)';
      const y = t.y - u * 40 / s;
      g.strokeText(t.text, t.x, y);
      g.fillStyle = t.color; g.fillText(t.text, t.x, y);
    }
    g.globalAlpha = 1;

    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (p.alive) this.drawPointers(g, S, blobs, leader);
    if (S.frenzy) {
      const a = 0.12 + 0.08 * Math.sin(this.time * 6);
      const grd = g.createRadialGradient(this.w / 2, this.h / 2, Math.min(this.w, this.h) * 0.35, this.w / 2, this.h / 2, Math.max(this.w, this.h) * 0.75);
      grd.addColorStop(0, 'rgba(255,200,60,0)'); grd.addColorStop(1, `rgba(255,170,40,${a})`);
      g.fillStyle = grd; g.fillRect(0, 0, this.w, this.h);
    }
    if (p.alive && p.spikeT > 0.9) {
      g.fillStyle = `rgba(255,60,60,${(p.spikeT - 0.9) * 0.8})`;
      g.fillRect(0, 0, this.w, this.h);
    }
  }

  drawFloor(g, S) {
    const v = this.view;
    // outside the arena
    g.fillStyle = '#0f0b22';
    g.fillRect(v.left - 10, v.top - 10, v.right - v.left + 20, v.bottom - v.top + 20);
    g.fillStyle = '#2a2152';
    g.fillRect(0, 0, ARENA, ARENA);
    // checker tiles
    const T = 160;
    const x0 = Math.max(0, Math.floor(v.left / T)), x1 = Math.min(ARENA / T - 1, Math.floor(v.right / T));
    const y0 = Math.max(0, Math.floor(v.top / T)), y1 = Math.min(ARENA / T - 1, Math.floor(v.bottom / T));
    g.fillStyle = '#30265c';
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if ((x + y) % 2 === 0) g.fillRect(x * T, y * T, T, T);
    g.strokeStyle = '#ff5fa2'; g.lineWidth = 14;
    g.strokeRect(-7, -7, ARENA + 14, ARENA + 14);
    g.strokeStyle = 'rgba(255,95,162,0.25)'; g.lineWidth = 40;
    g.strokeRect(-30, -30, ARENA + 60, ARENA + 60);
  }

  drawCrumb(g, f) {
    g.fillStyle = CRUMB_COLORS[f.hue % 6];
    g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath(); g.arc(f.x - f.r * 0.3, f.y - f.r * 0.3, f.r * 0.35, 0, TAU); g.fill();
  }

  drawBit(g, f) {
    const col = f.color === 'rainbow' ? `hsl(${(f.id * 40) % 360},90%,65%)` : f.color || '#fff';
    g.fillStyle = col;
    g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.2)'; g.lineWidth = 2; g.stroke();
  }

  drawCritter(g, f, p) {
    const edible = f.r <= p.r * 0.9;
    const r = f.r, a = Math.atan2(f.vy, f.vx);
    const hueCol = ['#ff8fb1', '#ffd36b', '#8fe3ff', '#a8ff8f', '#ffb27a', '#d6a8ff'][f.hue % 6];
    g.save();
    g.translate(f.x, f.y); g.rotate(a);
    g.globalAlpha = edible ? 1 : 0.55;
    // legs
    const wig = Math.sin(f.t * 18) * 0.35;
    g.strokeStyle = shade(hueCol, -0.4); g.lineWidth = Math.max(2, r * 0.14); g.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      const lx = i * r * 0.45;
      g.beginPath(); g.moveTo(lx, 0); g.lineTo(lx + Math.sin(wig + i) * r * 0.3, r * 1.0); g.stroke();
      g.beginPath(); g.moveTo(lx, 0); g.lineTo(lx - Math.sin(wig + i) * r * 0.3, -r * 1.0); g.stroke();
    }
    g.fillStyle = hueCol;
    g.beginPath(); g.ellipse(0, 0, r, r * 0.78, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath(); g.ellipse(-r * 0.2, -r * 0.3, r * 0.45, r * 0.22, 0, 0, TAU); g.fill();
    // eyes
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(r * 0.5, -r * 0.3, r * 0.28, 0, TAU); g.arc(r * 0.5, r * 0.3, r * 0.28, 0, TAU); g.fill();
    g.fillStyle = '#1b1035';
    g.beginPath(); g.arc(r * 0.6, -r * 0.3, r * 0.14, 0, TAU); g.arc(r * 0.6, r * 0.3, r * 0.14, 0, TAU); g.fill();
    g.restore();
    g.globalAlpha = 1;
  }

  drawGold(g, f) {
    const r = f.r * 1.1, rot = f.t * 2;
    g.save(); g.translate(f.x, f.y);
    const glow = g.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.2);
    glow.addColorStop(0, 'rgba(255,220,80,0.55)'); glow.addColorStop(1, 'rgba(255,220,80,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(0, 0, r * 2.2, 0, TAU); g.fill();
    g.rotate(rot);
    g.fillStyle = '#ffd84d'; g.strokeStyle = '#c98a00'; g.lineWidth = r * 0.12;
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.48 : r;
      const aa = i / 10 * TAU - Math.PI / 2;
      g.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
    }
    g.closePath(); g.fill(); g.stroke();
    g.rotate(-rot);
    g.fillStyle = '#5a3a00';
    g.beginPath(); g.arc(-r * 0.18, -r * 0.05, r * 0.08, 0, TAU); g.arc(r * 0.18, -r * 0.05, r * 0.08, 0, TAU); g.fill();
    g.restore();
  }

  drawSpike(g, s, p) {
    const danger = p.alive && p.mass > 16 && p.mass < s.mass * 1.4;
    const edible = p.mass >= s.mass * 1.4;
    const n = 14, r = s.r;
    g.save(); g.translate(s.x, s.y); g.rotate(s.rot);
    const pulse = danger ? 0.5 + 0.5 * Math.sin(this.time * 5) : 0;
    g.fillStyle = danger ? `rgb(${120 + pulse * 80},${200 - pulse * 60},80)` : '#6fcf4a';
    g.strokeStyle = '#2f6b1f'; g.lineWidth = Math.max(3, r * 0.06);
    g.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const rr = i % 2 ? r * 0.82 : r * 1.18;
      const aa = i / (n * 2) * TAU;
      g.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
    }
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.beginPath(); g.arc(-r * 0.25, -r * 0.25, r * 0.4, 0, TAU); g.fill();
    g.restore();
    if (edible) {
      g.strokeStyle = 'rgba(125,255,107,0.5)'; g.lineWidth = 4 / this.cam.s; g.setLineDash([10 / this.cam.s, 8 / this.cam.s]);
      g.beginPath(); g.arc(s.x, s.y, r * 1.35, 0, TAU); g.stroke(); g.setLineDash([]);
    }
  }

  drawBlob(g, b, p, isLeader, dt) {
    const a = this.blobAnim(b.id);
    a.gulp = Math.max(0, a.gulp - dt * 3);
    a.hurt = Math.max(0, a.hurt - dt * 2);
    const r = b.r;
    const sp = Math.hypot(b.vx, b.vy);
    const stretch = Math.min(0.16, sp / 1400);
    const ang = Math.atan2(b.vy, b.vx);
    const skin = b.isPlayer ? (SKINS.find((k) => k.id === b.skin) || SKINS[0]) : null;
    let color = b.color;
    if (color === 'rainbow') color = `hsl(${(this.time * 90) % 360},85%,62%)`;
    const base = color.startsWith('#') ? color : null;
    const face = skin ? skin.face : BOT_FACES[parseInt(b.skin.slice(3), 10) % BOT_FACES.length];

    if (b.spawnT > 0 && Math.floor(this.time * 10) % 2 === 0) g.globalAlpha = 0.5;

    // threat ring: red if it can eat you, green if you can eat it
    if (!b.isPlayer && p.alive) {
      const danger = canEat(b, p), prey = canEat(p, b);
      if (danger || prey) {
        g.strokeStyle = danger ? 'rgba(255,70,90,0.8)' : 'rgba(125,255,107,0.7)';
        g.lineWidth = Math.max(3, 4 / this.cam.s);
        g.beginPath(); g.arc(b.x, b.y, r + 6 / this.cam.s + 3, 0, TAU); g.stroke();
      }
    } else if (b.isPlayer) {
      g.fillStyle = 'rgba(255,255,255,0.08)';
      g.beginPath(); g.arc(b.x, b.y, r * 1.25 + 10, 0, TAU); g.fill();
    }

    g.save();
    g.translate(b.x, b.y);
    g.rotate(ang);
    const sq = 1 + a.gulp * 0.12;
    g.scale((1 + stretch) * sq, (1 - stretch * 0.8) / Math.sqrt(sq));
    g.rotate(-ang);
    // wobbly jelly body
    const N = 28, t = this.time * 5 + b.id;
    g.beginPath();
    for (let i = 0; i <= N; i++) {
      const aa = i / N * TAU;
      const w = 1 + 0.035 * Math.sin(aa * 3 + t) + 0.025 * Math.sin(aa * 5 - t * 1.3) + a.hurt * 0.08 * Math.sin(aa * 9 + t * 4);
      const x = Math.cos(aa) * r * w, y = Math.sin(aa) * r * w;
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
    const grd = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
    grd.addColorStop(0, base ? shade(base, 0.45) : color);
    grd.addColorStop(0.65, color);
    grd.addColorStop(1, base ? shade(base, -0.25) : color);
    g.fillStyle = grd; g.fill();
    g.lineWidth = Math.max(2, r * 0.07); g.strokeStyle = base ? shade(base, -0.4) : 'rgba(0,0,0,0.3)'; g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.4)';
    g.beginPath(); g.ellipse(-r * 0.38, -r * 0.45, r * 0.25, r * 0.14, -0.6, 0, TAU); g.fill();
    this.drawFace(g, b, r, face, a);
    g.restore();
    g.globalAlpha = 1;

    if (isLeader) this.drawCrown(g, b.x, b.y - r * 1.02, Math.max(14, r * 0.45));

    // name
    const fs = Math.max(13 / this.cam.s, Math.min(r * 0.38, 34 / this.cam.s));
    g.font = `700 ${fs}px Fredoka, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const ny = r > 40 / this.cam.s ? b.y + r * 0.62 : b.y + r + fs * 0.9;
    g.lineWidth = fs * 0.22; g.strokeStyle = 'rgba(20,12,40,0.8)';
    g.strokeText(b.name, b.x, ny);
    g.fillStyle = b.isPlayer ? '#fff' : !p.alive ? '#e6e1ff' : canEat(b, p) ? '#ffb3bd' : canEat(p, b) ? '#c8ffbe' : '#fff';
    g.fillText(b.name, b.x, ny);
  }

  drawFace(g, b, r, face, a) {
    const lx = b.dirX * r * 0.16, ly = b.dirY * r * 0.16;
    const ex = r * 0.3, ey = -r * 0.12, er = r * 0.2;
    const mouthOpen = a.gulp > 0;
    g.save(); g.translate(lx, ly);
    if (face === 'shades') {
      g.fillStyle = '#16102b';
      g.beginPath(); g.roundRect(-r * 0.62, ey - er * 0.9, r * 0.56, er * 1.6, er * 0.6); g.roundRect(r * 0.06, ey - er * 0.9, r * 0.56, er * 1.6, er * 0.6); g.fill();
      g.fillRect(-r * 0.1, ey - er * 0.6, r * 0.2, er * 0.3);
      g.fillStyle = 'rgba(255,255,255,0.5)';
      g.fillRect(-r * 0.52, ey - er * 0.6, r * 0.14, er * 0.3); g.fillRect(r * 0.16, ey - er * 0.6, r * 0.14, er * 0.3);
    } else if (face === 'cyclops') {
      g.fillStyle = '#fff'; g.beginPath(); g.arc(0, ey, er * 1.5, 0, TAU); g.fill();
      g.fillStyle = '#16102b'; g.beginPath(); g.arc(b.dirX * er * 0.5, ey + b.dirY * er * 0.5, er * 0.75, 0, TAU); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(b.dirX * er * 0.5 - er * 0.25, ey + b.dirY * er * 0.5 - er * 0.25, er * 0.25, 0, TAU); g.fill();
    } else {
      for (const sx of [-1, 1]) {
        const cx = sx * ex;
        if (face === 'sleepy' && !mouthOpen) {
          g.strokeStyle = '#16102b'; g.lineWidth = er * 0.35; g.lineCap = 'round';
          g.beginPath(); g.arc(cx, ey, er * 0.7, 0.2, Math.PI - 0.2); g.stroke();
          continue;
        }
        g.fillStyle = '#fff'; g.beginPath(); g.arc(cx, ey, er, 0, TAU); g.fill();
        if (face === 'star') {
          g.fillStyle = '#ffb000';
          g.beginPath();
          for (let i = 0; i < 10; i++) { const rr = i % 2 ? er * 0.3 : er * 0.75, aa = i / 10 * TAU - Math.PI / 2; g.lineTo(cx + Math.cos(aa) * rr, ey + Math.sin(aa) * rr); }
          g.fill();
        } else {
          g.fillStyle = '#16102b';
          g.beginPath(); g.arc(cx + b.dirX * er * 0.35, ey + b.dirY * er * 0.35, er * 0.55, 0, TAU); g.fill();
          g.fillStyle = '#fff';
          g.beginPath(); g.arc(cx + b.dirX * er * 0.35 - er * 0.2, ey + b.dirY * er * 0.35 - er * 0.2, er * 0.18, 0, TAU); g.fill();
        }
        if (face === 'angry') {
          g.strokeStyle = '#16102b'; g.lineWidth = er * 0.35; g.lineCap = 'round';
          g.beginPath(); g.moveTo(cx - sx * er * 1.0, ey - er * 1.35); g.lineTo(cx + sx * er * 0.7, ey - er * 0.85); g.stroke();
        }
      }
    }
    // mouth
    g.fillStyle = '#3a0d2e';
    if (mouthOpen) {
      g.beginPath(); g.ellipse(0, r * 0.3, r * 0.3 * (0.6 + a.gulp * 0.4), r * 0.24 * (0.5 + a.gulp * 0.5), 0, 0, TAU); g.fill();
      g.fillStyle = '#ff7a9a';
      g.beginPath(); g.ellipse(0, r * 0.38, r * 0.15, r * 0.08, 0, 0, TAU); g.fill();
    } else if (a.hurt > 0) {
      g.strokeStyle = '#3a0d2e'; g.lineWidth = r * 0.06; g.lineCap = 'round';
      g.beginPath();
      for (let i = 0; i <= 6; i++) g.lineTo(-r * 0.22 + i * r * 0.073, r * 0.3 + (i % 2 ? -1 : 1) * r * 0.04);
      g.stroke();
    } else {
      g.strokeStyle = '#3a0d2e'; g.lineWidth = r * 0.06; g.lineCap = 'round';
      g.beginPath(); g.arc(0, r * 0.18, r * 0.18, 0.25, Math.PI - 0.25); g.stroke();
    }
    g.restore();
  }

  drawCrown(g, x, y, s) {
    g.save(); g.translate(x, y + Math.sin(this.time * 3) * s * 0.06);
    g.fillStyle = '#ffd84d'; g.strokeStyle = '#a86b00'; g.lineWidth = s * 0.1; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(-s * 0.8, s * 0.2); g.lineTo(-s * 0.9, -s * 0.55); g.lineTo(-s * 0.4, -s * 0.15); g.lineTo(0, -s * 0.75);
    g.lineTo(s * 0.4, -s * 0.15); g.lineTo(s * 0.9, -s * 0.55); g.lineTo(s * 0.8, s * 0.2); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = '#ff5fa2';
    g.beginPath(); g.arc(0, -s * 0.05, s * 0.13, 0, TAU); g.fill();
    g.restore();
  }

  // Edge arrows: gold for the leader, red for nearby blobs that can eat you.
  drawPointers(g, S, blobs, leader) {
    const p = S.player, v = this.view, s = this.cam.s;
    const cx = this.w / 2, cy = this.h / 2;
    const arrow = (b, color, label) => {
      const dx = (b.x - this.cam.x) * s, dy = (b.y - this.cam.y) * s;
      const m = 34, hw = this.w / 2 - m, hh = this.h / 2 - m - 20;
      const k = Math.min(hw / Math.abs(dx || 1e-6), hh / Math.abs(dy || 1e-6));
      const x = cx + dx * Math.min(1, k), y = cy + dy * Math.min(1, k) + 10;
      const ang = Math.atan2(dy, dx);
      g.save(); g.translate(x, y);
      g.fillStyle = color;
      g.rotate(ang);
      g.beginPath(); g.moveTo(16, 0); g.lineTo(-8, -11); g.lineTo(-3, 0); g.lineTo(-8, 11); g.closePath(); g.fill();
      g.restore();
      if (label) {
        g.font = '700 13px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillStyle = color;
        g.fillText(label, x - Math.cos(ang) * 26, y - Math.sin(ang) * 22);
      }
    };
    const off = (b) => b.x + b.r < v.left || b.x - b.r > v.right || b.y + b.r < v.top || b.y - b.r > v.bottom;
    for (const b of blobs) {
      if (b === p || !off(b)) continue;
      const d = Math.hypot(b.x - p.x, b.y - p.y);
      if (b === leader) arrow(b, '#ffd84d', '👑');
      else if (canEat(b, p) && d < 1400 / Math.sqrt(s) ) arrow(b, '#ff5a6e');
    }
  }
}


// ---- audio.js ----
// Every sound is synthesised with WebAudio, so the game ships no audio files.
class Audio {
  constructor() {
    this.ctx = null;
    this.sfxOn = true;
    this.musicOn = true;
    this.forcedMute = false; // set by the platform (ads, CrazyGames mute setting)
    this.beat = 0;
    this.fast = false;
    this.lastBlip = 0;
  }

  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      this.sfx = this.ctx.createGain(); this.sfx.connect(this.master);
      this.music = this.ctx.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
      const len = this.ctx.sampleRate * 0.5;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.startMusic();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.apply();
  }

  apply() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(this.forcedMute ? 0 : 1, t, 0.02);
    this.sfx.gain.setTargetAtTime(this.sfxOn ? 0.5 : 0, t, 0.02);
    this.music.gain.setTargetAtTime(this.musicOn ? 0.14 : 0, t, 0.3);
  }

  tone(type, f0, f1, dur, vol = 0.3, delay = 0, dest = this.sfx) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
  }

  hiss(dur, vol, freq, delay = 0, type = 'lowpass', dest = this.sfx) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const s = this.ctx.createBufferSource(); s.buffer = this.noise;
    const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest);
    s.start(t); s.stop(t + dur + 0.02);
  }

  // Snack blip: pitch climbs with the combo so streaks sound like a run up a scale.
  blip(combo) {
    if (!this.ctx || !this.sfxOn) return;
    const now = this.ctx.currentTime;
    if (now - this.lastBlip < 0.035) return;
    this.lastBlip = now;
    const steps = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
    const n = 440 * Math.pow(2, steps[Math.min(steps.length - 1, Math.max(0, combo - 1))] / 12);
    this.tone('sine', n, n * 1.5, 0.07, 0.16);
  }

  play(name) {
    if (!this.ctx || !this.sfxOn) return;
    const r = 1 + (Math.random() - 0.5) * 0.1;
    switch (name) {
      case 'critter': this.tone('square', 500 * r, 260 * r, 0.09, 0.1); this.tone('sine', 900 * r, 1400, 0.08, 0.12, 0.03); break;
      case 'gold':
        [1047, 1319, 1568, 2093].forEach((n, i) => this.tone('triangle', n, n, 0.12, 0.16, i * 0.05));
        break;
      case 'gulp':
        this.tone('sine', 300 * r, 70, 0.32, 0.5);
        this.tone('square', 180 * r, 90, 0.12, 0.12, 0.02);
        this.hiss(0.18, 0.3, 900);
        break;
      case 'farGulp': this.tone('sine', 220 * r, 70, 0.2, 0.15); break;
      case 'dash': this.hiss(0.22, 0.25, 2600, 0, 'bandpass'); this.tone('sine', 320, 640, 0.12, 0.08); break;
      case 'spike': this.tone('sawtooth', 420 * r, 110, 0.25, 0.18); this.hiss(0.2, 0.35, 3000); break;
      case 'crunch': this.hiss(0.25, 0.45, 1600); this.tone('square', 200, 80, 0.15, 0.15); break;
      case 'levelup':
        [523, 659, 784, 1047].forEach((n, i) => this.tone('triangle', n, n, 0.16, 0.22, i * 0.06));
        break;
      case 'perk': this.tone('triangle', 784, 1568, 0.18, 0.25); break;
      case 'frenzy':
        for (let i = 0; i < 3; i++) { this.tone('square', 880, 660, 0.14, 0.12, i * 0.18); }
        break;
      case 'dead':
        this.tone('sine', 400, 60, 0.7, 0.4);
        this.tone('triangle', 300, 50, 0.6, 0.2, 0.05);
        this.hiss(0.4, 0.3, 800);
        break;
      case 'win':
        [523, 659, 784, 1047, 1319].forEach((n, i) => this.tone('triangle', n, n, 0.25, 0.25, i * 0.09));
        this.tone('sine', 1568, 1568, 0.6, 0.18, 0.45);
        break;
      case 'end': [523, 440, 392].forEach((n, i) => this.tone('triangle', n, n, 0.22, 0.22, i * 0.12)); break;
      case 'coin': this.tone('square', 988, 988, 0.06, 0.08); this.tone('square', 1319, 1319, 0.12, 0.08, 0.06); break;
      case 'click': this.tone('triangle', 660, 880, 0.05, 0.15); break;
      case 'tick': this.tone('square', 1200, 1200, 0.04, 0.08); break;
      case 'revive': this.tone('sine', 300, 1200, 0.4, 0.3); break;
    }
  }

  setFast(on) { this.fast = on; }

  startMusic() {
    // A bouncy loop: bass, offbeat hats and pentatonic plucks, scheduled ahead of time.
    const bass = [65.4, 65.4, 87.3, 98];
    const scale = [392, 440, 523.3, 587.3, 659.3, 784];
    let next = this.ctx.currentTime + 0.1;
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const tick = () => {
      if (!this.ctx) return;
      const spb = 60 / (this.fast ? 150 : 120) / 2;
      while (next < this.ctx.currentTime + 0.3) {
        const b = this.beat, bar = Math.floor(b / 8) % 4;
        const delay = next - this.ctx.currentTime;
        if (b % 2 === 0) this.tone('triangle', bass[bar], bass[bar], spb * 1.5, 0.5, delay, this.music);
        if (b % 2 === 1) this.hiss(0.04, 0.07, 7000, delay, 'highpass', this.music);
        if (b % 8 === 4) this.hiss(0.1, 0.12, 1200, delay, 'bandpass', this.music);
        if (rnd() < 0.5) {
          const n = scale[Math.floor(rnd() * scale.length)];
          this.tone('sine', n, n, spb * 0.8, 0.16, delay, this.music);
        }
        this.beat++;
        next += spb;
      }
    };
    setInterval(tick, 100);
    this.apply();
  }
}

// ---- platform.js ----
// Thin wrapper over the CrazyGames HTML5 SDK v3. Every call is optional:
// off CrazyGames (local dev, other hosts, ad blockers) the game keeps working.
const SAVE_KEY = 'gobbleroyale.save.v1';

const platform = {
  sdk: null,
  inGameplay: false,

  async init() {
    const SDK = window.CrazyGames && window.CrazyGames.SDK;
    if (!SDK) return;
    try {
      await Promise.race([SDK.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))]);
      if (SDK.environment === 'disabled') return;
      this.sdk = SDK;
    } catch (e) {
      console.warn('CrazyGames SDK unavailable:', e && e.message);
    }
  },

  call(fn) {
    if (!this.sdk) return;
    try { fn(this.sdk); } catch (e) { console.warn(e); }
  },

  loadingStart() { this.call((s) => s.game.loadingStart()); },
  loadingStop() { this.call((s) => s.game.loadingStop()); },
  gameplayStart() {
    if (this.inGameplay) return;
    this.inGameplay = true;
    this.call((s) => s.game.gameplayStart());
  },
  gameplayStop() {
    if (!this.inGameplay) return;
    this.inGameplay = false;
    this.call((s) => s.game.gameplayStop());
  },
  happytime() { this.call((s) => s.game.happytime()); },

  get muteSetting() {
    try { return !!(this.sdk && this.sdk.game.settings && this.sdk.game.settings.muteAudio); } catch { return false; }
  },
  onSettings(cb) {
    this.call((s) => s.game.addSettingsChangeListener && s.game.addSettingsChangeListener(cb));
  },

  // kind: 'midgame' | 'rewarded'. Resolves true when a rewarded ad finished.
  ad(kind, { onStart, onEnd } = {}) {
    return new Promise((resolve) => {
      if (!this.sdk) { resolve(kind === 'rewarded'); return; }
      let started = false;
      try {
        this.sdk.ad.requestAd(kind, {
          adStarted: () => { started = true; onStart && onStart(); },
          adFinished: () => { onEnd && onEnd(); resolve(true); },
          adError: () => { if (started && onEnd) onEnd(); resolve(false); },
        });
      } catch (e) {
        resolve(false);
      }
    });
  },

  load() {
    let raw = null;
    try { raw = this.sdk ? this.sdk.data.getItem(SAVE_KEY) : null; } catch {}
    if (raw == null) { try { raw = localStorage.getItem(SAVE_KEY); } catch {} }
    try { return raw ? JSON.parse(raw) : null; } catch { return null; }
  },
  save(data) {
    const raw = JSON.stringify(data);
    try { if (this.sdk) this.sdk.data.setItem(SAVE_KEY, raw); } catch {}
    try { localStorage.setItem(SAVE_KEY, raw); } catch {}
  },
};

// ---- main.js ----

const $ = (id) => document.getElementById(id);
const canvas = $('game');
const R = new Renderer(canvas);
const audio = new Audio();

const DEATH_QUIPS = ['Should have run.', 'You were delicious.', 'Snack status: achieved.', 'Big fish, little fish.', 'That was a mouthful.', 'Nom.'];
const LOSE_QUIPS = ['Not the biggest. Yet.', 'Eat faster next time.', 'Bigger mouth needed.', 'The crown is waiting.'];
const PLACE_BONUS = [0, 60, 35, 20, 12, 10, 8, 6, 4, 3, 2, 1, 0];

let save = {
  coins: 0, skin: 'lime', owned: ['lime'], upg: {}, rounds: 0, wins: 0,
  best: { placement: 99, mass: 0, kills: 0 }, sfx: true, music: true, tutorial: true,
};
let S = null;
let mode = 'boot'; // play | perk | paused | dead | results | ad
let acc = 0, last = 0;
let perkOpts = [];
let revived = false, doubled = false, lastAdAt = 0, roundsThisSession = 0;
let lastEarned = 0;
let bannerTimer = null, hudT = 0, deadTimer = null;
let prevRank = 0;
let touchMode = false;
const input = { x: 0, y: 0, dash: false };
const keys = new Set();
const mouse = { x: 0, y: 0, active: false };
const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };

const pick = (a) => a[Math.floor(Math.random() * a.length)];
const persist = () => platform.save(save);
const upg = (id) => save.upg[id] || 0;
const skinOf = (id) => SKINS.find((s) => s.id === id) || SKINS[0];

function difficulty() {
  // First round is gentle; bots sharpen as the player plays and wins.
  return Math.max(0.1, Math.min(1, 0.15 + save.rounds * 0.08 + save.wins * 0.12));
}

// ---------- round flow ----------
function startRound() {
  clearTimeout(deadTimer);
  const sk = skinOf(save.skin);
  S = createGame({
    seed: (Math.random() * 2 ** 31) | 0,
    playerName: 'You', skin: sk.id, color: sk.color,
    meta: { startMass: 10 + 3 * upg('start'), dashMul: Math.pow(0.92, upg('dash')) },
    difficulty: difficulty(),
  });
  R.reset();
  revived = false; doubled = false; acc = 0; prevRank = 0;
  hideOverlay();
  mode = 'play';
  audio.setFast(false);
  platform.gameplayStart();
  $('hud').classList.remove('hidden');
  $('xp').classList.remove('hidden');
  setTouchUi();
  updateHud(true);
  if (save.tutorial) {
    showBanner('Eat smaller. Run from bigger!', touchMode ? 'Drag anywhere to move · tap ⚡ to dash' : 'Move the mouse to steer · Space or click to dash');
    setTimeout(() => { if (mode === 'play' && S.t < 12) showBanner('Green ring = snack · Red ring = RUN', 'Be the biggest when the clock hits zero'); }, 5200);
  } else {
    showBanner('Gobble!', 'Be the biggest in 3 minutes');
  }
}

function showBanner(title, hint, ms = 4200) {
  const b = $('banner');
  $('banner-title').textContent = title;
  $('banner-hint').textContent = hint || '';
  b.classList.remove('hidden', 'fade');
  void b.offsetWidth;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.add('fade'), ms);
}

function handleEvents() {
  for (const e of S.events) {
    R.event(e, S);
    switch (e.type) {
      case 'eat':
        if (e.player) {
          if (e.kind === 'gold') audio.play('gold');
          else if (e.kind === 'critter') audio.play('critter');
          else audio.blip(e.combo);
        }
        break;
      case 'kill':
        if (e.eater === S.player.id) audio.play('gulp');
        else if (e.victim !== S.player.id && Math.hypot(e.x - S.player.x, e.y - S.player.y) < 1200) audio.play('farGulp');
        break;
      case 'spike': if (e.player) audio.play('spike'); break;
      case 'spikeEat': if (e.player) audio.play('crunch'); break;
      case 'dash': if (e.id === S.player.id) audio.play('dash'); break;
      case 'levelup': audio.play('levelup'); break;
      case 'frenzy':
        audio.play('frenzy'); audio.setFast(true);
        if (mode === 'play') showBanner('GOLDEN FRENZY!', '30 seconds left · golden snacks everywhere', 3000);
        break;
      case 'playerDead':
        audio.play('dead');
        platform.gameplayStop();
        mode = 'dead';
        deadTimer = setTimeout(() => showDeath(e.by), 1100);
        break;
    }
  }
  S.events.length = 0;
}

function afterStep() {
  if (mode !== 'play') return;
  if (S.player.pendingLevels > 0) { openPerks(); return; }
  if (S.over && S.player.alive) endRound();
}

function endRound() {
  mode = 'results';
  platform.gameplayStop();
  audio.setFast(false);
  const r = S.result;
  if (r.placement === 1) { audio.play('win'); platform.happytime(); } else audio.play('end');
  showResults();
}

// ---------- perks ----------
function openPerks() {
  mode = 'perk';
  perkOpts = rollPerks(S);
  const p = S.player;
  showPanel(`
    <h1>Level ${p.level - p.pendingLevels + 1}!</h1>
    <p class="quip">Pick a power</p>
    <div class="perks">${perkOpts.map((k, i) => `
      <button class="perk" data-perk="${k.id}">
        <span class="ico">${k.icon}</span>
        <span><b>${k.name}</b><div class="d">${k.desc}</div>
        <div class="lv">${perkLevel(p, k.id) ? 'Lv ' + perkLevel(p, k.id) + ' → ' + (perkLevel(p, k.id) + 1) : 'NEW'}</div>
        ${touchMode ? '' : `<kbd>${i + 1}</kbd>`}</span>
      </button>`).join('')}
    </div>`);
  $('panel').querySelectorAll('[data-perk]').forEach((b) => b.addEventListener('click', () => takePerk(b.dataset.perk)));
}

function takePerk(id) {
  if (mode !== 'perk') return;
  choosePerk(S, id);
  audio.play('perk');
  const k = PERKS.find((q) => q.id === id);
  R.say(`${k.icon} ${k.name}!`, S.player.x, S.player.y - S.player.r - 30, '#b48cff', 26, 1.2);
  hideOverlay();
  mode = 'play';
  keys.clear(); input.dash = false;
  afterStep();
}

// ---------- death / results ----------
function showDeath(by) {
  if (mode !== 'dead') return;
  const p = S.player;
  const canRevive = !revived && p.peak >= 25 && S.t < ROUND_TIME - 10;
  showPanel(`
    <h1>Gulped by ${esc(by)}!</h1>
    <p class="quip">${pick(DEATH_QUIPS)}</p>
    <div class="big-rank">#${p.placement}<small> of 12</small></div>
    <div class="btns">
      ${canRevive ? `<button class="btn gold" id="b-revive"><span class="ad-badge">AD</span> Revive</button>` : ''}
      <button class="btn ${canRevive ? '' : 'primary'}" id="b-next">${canRevive ? 'No thanks' : 'Continue'}</button>
    </div>
    ${canRevive ? `<p class="quip">Come back with half your size</p>` : ''}`);
  if (canRevive) $('b-revive').onclick = doRevive;
  $('b-next').onclick = () => { audio.play('click'); mode = 'results'; showResults(); };
}

async function doRevive() {
  if (mode !== 'dead') return;
  mode = 'ad';
  hideOverlay();
  const ok = await runAd('rewarded');
  if (!ok) { mode = 'dead'; showDeath(S.player.killer); return; }
  revived = true;
  revive(S);
  audio.play('revive');
  R.snap = true;
  mode = 'play';
  platform.gameplayStart();
  showBanner('Back for seconds!', 'You are shielded for 3 seconds', 2500);
}

function coinsFor(r) {
  const base = r.peak / 8 + r.kills * 10 + r.gold + PLACE_BONUS[Math.min(12, r.placement)];
  return Math.round(base * (1 + 0.15 * upg('coins')));
}

function showResults() {
  clearTimeout(deadTimer);
  const r = S.result;
  roundsThisSession++;
  save.rounds++;
  if (r.placement === 1) save.wins++;
  lastEarned = coinsFor(r);
  save.coins += lastEarned;
  const rec = [];
  const first = save.rounds === 1;
  if (r.placement < save.best.placement) { save.best.placement = r.placement; if (!first) rec.push('best rank'); }
  if (r.peak > save.best.mass) { save.best.mass = r.peak; if (!first) rec.push('biggest ever'); }
  if (r.kills > save.best.kills) { save.best.kills = r.kills; if (!first) rec.push('most gulps'); }
  if (save.rounds >= 1) save.tutorial = false;
  persist();
  renderResults(rec);
}

function renderResults(rec = []) {
  const r = S.result;
  const win = r.placement === 1;
  const title = win ? 'TOP GOBBLER!' : r.placement <= 3 ? 'So close!' : r.alive ? 'Time\'s up!' : 'Gulped!';
  const sub = win ? 'Biggest monster in the arena' : r.alive ? pick(LOSE_QUIPS) : `Eaten by ${esc(r.killer)}`;
  showPanel(`
    <h1 class="${win ? 'gold' : ''}">${title}</h1>
    <p class="quip">${sub}</p>
    <div class="big-rank">${win ? '👑' : ''}#${r.placement}<small> of 12</small></div>
    <div class="stat-row">
      <div><span>Biggest</span>${r.peak}</div>
      <div><span>Gulps</span>${r.kills}</div>
      <div><span>Level</span>${r.level + 1}</div>
    </div>
    ${rec.length ? `<p style="color:var(--gold);font-weight:700">New record: ${rec.join(', ')}!</p>` : ''}
    <p class="coins" style="margin-top:12px"><i class="coin"></i>+${lastEarned}${doubled ? ' ×2' : ''} <span style="color:var(--muted);font-size:15px;margin-left:6px">(${save.coins} total)</span></p>
    <div class="btns">
      <button class="btn primary" id="b-again">Play again</button>
      ${doubled ? '' : `<button class="btn gold" id="b-double"><span class="ad-badge">AD</span> ×2 coins</button>`}
      <button class="btn" id="b-shop">Shop</button>
    </div>
    ${touchMode ? '' : '<p class="quip" style="margin-top:10px"><kbd>Enter</kbd> play again</p>'}`);
  $('b-again').onclick = playAgain;
  $('b-shop').onclick = () => openShop('skins');
  if (!doubled) $('b-double').onclick = doubleCoins;
}

async function doubleCoins() {
  if (doubled || mode !== 'results') return;
  mode = 'ad';
  const ok = await runAd('rewarded');
  mode = 'results';
  if (ok) {
    doubled = true;
    save.coins += lastEarned;
    persist();
    audio.play('coin');
  }
  renderResults();
}

async function playAgain() {
  if (mode !== 'results' && mode !== 'paused') return;
  audio.play('click');
  // Midgame ad only between rounds, from the third round on, at most every 3 minutes.
  if (roundsThisSession >= 2 && Date.now() - lastAdAt > 180000) {
    mode = 'ad';
    hideOverlay();
    await runAd('midgame');
  }
  startRound();
}

async function runAd(kind) {
  const ok = await platform.ad(kind, {
    onStart: () => { audio.forcedMute = true; audio.apply(); },
    onEnd: () => { audio.forcedMute = platform.muteSetting; audio.apply(); },
  });
  audio.forcedMute = platform.muteSetting; audio.apply();
  lastAdAt = Date.now();
  return ok;
}

// ---------- shop ----------
function openShop(tab) {
  const back = mode;
  mode = 'shop';
  const render = (t) => {
    const body = t === 'skins'
      ? `<div class="skins">${SKINS.map((k) => {
        const owned = save.owned.includes(k.id);
        return `<button class="skin ${save.skin === k.id ? 'on' : ''} ${owned ? '' : 'locked'}" data-skin="${k.id}">
          <canvas width="128" height="128" data-prev="${k.id}"></canvas>
          <span>${k.name}</span>
          ${owned ? `<span class="price" style="color:var(--muted)">${save.skin === k.id ? 'Equipped' : 'Owned'}</span>` : `<span class="price"><i class="coin"></i>${k.price}</span>`}
        </button>`;
      }).join('')}</div>`
      : `<div class="upgrades">${UPGRADES.map((u) => {
        const lv = upg(u.id), maxed = lv >= u.costs.length, cost = u.costs[lv];
        return `<div class="upg"><div class="txt"><b>${u.name}</b><div>${u.desc}</div>
          <div class="pips">${u.costs.map((_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div></div>
          <button class="btn ${maxed ? '' : 'gold'}" data-upg="${u.id}" ${maxed || save.coins < cost ? 'disabled' : ''}>${maxed ? 'Max' : `<i class="coin"></i>${cost}`}</button></div>`;
      }).join('')}</div>`;
    showPanel(`
      <button class="close" id="b-close" aria-label="Close">×</button>
      <h1>Shop</h1>
      <p class="coins"><i class="coin"></i>${save.coins}</p>
      <div class="tabs"><button class="tab ${t === 'skins' ? 'on' : ''}" data-tab="skins">Monsters</button><button class="tab ${t === 'upg' ? 'on' : ''}" data-tab="upg">Upgrades</button></div>
      ${body}`, 'wide');
    $('panel').querySelectorAll('[data-prev]').forEach((c) => drawPreview(c, skinOf(c.dataset.prev)));
    $('panel').querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { audio.play('click'); render(b.dataset.tab); });
    $('panel').querySelectorAll('[data-skin]').forEach((b) => b.onclick = () => {
      const k = skinOf(b.dataset.skin);
      if (!save.owned.includes(k.id)) {
        if (save.coins < k.price) { audio.play('tick'); b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 200); return; }
        save.coins -= k.price; save.owned.push(k.id); audio.play('coin');
      } else audio.play('click');
      save.skin = k.id; persist(); render(t);
    });
    $('panel').querySelectorAll('[data-upg]').forEach((b) => b.onclick = () => {
      const u = UPGRADES.find((q) => q.id === b.dataset.upg), lv = upg(u.id);
      if (lv >= u.costs.length || save.coins < u.costs[lv]) return;
      save.coins -= u.costs[lv]; save.upg[u.id] = lv + 1; persist(); audio.play('coin'); render(t);
    });
    $('b-close').onclick = () => { audio.play('click'); mode = back; if (back === 'results') renderResults(); else if (back === 'paused') showPause(); };
  };
  render(tab);
}

function drawPreview(c, k) {
  const g = c.getContext('2d');
  const r = 46;
  g.clearRect(0, 0, 128, 128);
  g.save(); g.translate(64, 66);
  const col = k.color === 'rainbow' ? null : k.color;
  if (col) {
    const grd = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    grd.addColorStop(0, '#ffffffaa'); grd.addColorStop(0.3, col); grd.addColorStop(1, col);
    g.fillStyle = grd;
  } else {
    const grd = g.createLinearGradient(-r, -r, r, r);
    ['#ff5a5a', '#ffd84d', '#7dff6b', '#5ad1ff', '#b48cff'].forEach((cc, i) => grd.addColorStop(i / 4, cc));
    g.fillStyle = grd;
  }
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,0.3)'; g.stroke();
  R.drawFace(g, { dirX: 0.3, dirY: 0.2 }, r, k.face, { gulp: 0, hurt: 0 });
  g.restore();
}

// ---------- pause ----------
function pause() {
  if (mode !== 'play') return;
  mode = 'paused';
  platform.gameplayStop();
  showPause();
}

function showPause() {
  showPanel(`
    <h1>Paused</h1>
    <div class="btns">
      <button class="btn primary" id="b-resume">Resume</button>
      <button class="btn" id="b-restart">New round</button>
    </div>
    <div class="settings">
      <button class="btn" id="b-sfx">Sound: ${save.sfx ? 'On' : 'Off'}</button>
      <button class="btn" id="b-music">Music: ${save.music ? 'On' : 'Off'}</button>
    </div>
    <p class="quip" style="margin-top:12px">Wins: ${save.wins} · Best rank: ${save.best.placement < 99 ? '#' + save.best.placement : '–'} · Biggest: ${save.best.mass}</p>`);
  $('b-resume').onclick = resume;
  $('b-restart').onclick = () => { audio.play('click'); startRound(); };
  $('b-sfx').onclick = () => { save.sfx = !save.sfx; audio.sfxOn = save.sfx; audio.apply(); persist(); showPause(); };
  $('b-music').onclick = () => { save.music = !save.music; audio.musicOn = save.music; audio.apply(); persist(); showPause(); };
}

function resume() {
  if (mode !== 'paused') return;
  hideOverlay();
  mode = 'play';
  keys.clear();
  last = performance.now(); acc = 0;
  platform.gameplayStart();
}

// ---------- overlay ----------
function showPanel(html, cls = '') {
  const p = $('panel');
  p.className = 'panel ' + cls;
  p.innerHTML = html;
  $('overlay').classList.remove('hidden');
  const first = p.querySelector('.btn.primary, .perk');
  if (first && !touchMode) first.focus({ preventScroll: true });
}
function hideOverlay() { $('overlay').classList.add('hidden'); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- HUD ----------
function updateHud(force) {
  const p = S.player;
  const left = Math.max(0, Math.ceil(ROUND_TIME - S.t));
  const tEl = $('hud-time');
  tEl.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  tEl.classList.toggle('low', left <= 30);
  $('alive').textContent = S.aliveCount;
  const lb = leaderboard(S);
  const rank = p.alive ? lb.indexOf(p) + 1 : p.placement;
  const rEl = $('hud-rank');
  rEl.textContent = '#' + rank;
  rEl.classList.toggle('first', rank === 1);
  if (rank !== prevRank && !force && rank < prevRank) { rEl.classList.remove('bump'); void rEl.offsetWidth; rEl.classList.add('bump'); }
  prevRank = rank;
  $('hud-mass').textContent = Math.round(p.mass) + ' mass';
  const top = lb.slice(0, 5);
  let html = top.map((b, i) => `<li class="${b === p ? 'me' : ''}"><span class="n">${i + 1}. ${esc(b.name)}</span><span>${Math.round(b.mass)}</span></li>`).join('');
  if (p.alive && rank > 5) html += `<li class="sep">⋯</li><li class="me"><span class="n">${rank}. You</span><span>${Math.round(p.mass)}</span></li>`;
  $('board').innerHTML = html;
  $('xp-fill').style.width = Math.min(100, p.xp / xpNeed(p.level + 1) * 100) + '%';
  $('xp-level').textContent = 'Lv ' + (p.level + 1);
  const c = $('combo');
  if (p.combo >= 3) { c.textContent = `x${p.combo} combo`; c.classList.remove('hidden'); } else c.classList.add('hidden');
  const cd = Math.max(0, p.dashCd) / (2.6 * Math.pow(0.78, perkLevel(p, 'dash')) * Math.pow(0.92, upg('dash')));
  $('dash-ring').style.strokeDashoffset = String(289 * Math.min(1, cd));
  $('btn-dash').classList.toggle('cool', cd > 0);
}

function setTouchUi() {
  $('btn-dash').classList.toggle('hidden', !touchMode);
  $('dash-key').classList.toggle('hidden', touchMode || !save.tutorial);
}

// ---------- input ----------
function computeInput() {
  let kx = 0, ky = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) kx -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) kx += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) ky -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) ky += 1;
  if (kx || ky) { const m = Math.hypot(kx, ky); input.x = kx / m; input.y = ky / m; mouse.active = false; return; }
  if (stick.id !== null) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, m = Math.hypot(dx, dy);
    if (m < 6) { input.x = 0; input.y = 0; return; }
    const mag = Math.min(1, m / 50);
    input.x = dx / m * mag; input.y = dy / m * mag; return;
  }
  if (mouse.active && S) {
    const p = S.player, s = R.cam.s;
    const px = R.w / 2 + (p.x - R.cam.x) * s, py = R.h / 2 + (p.y - R.cam.y) * s;
    const dx = mouse.x - px, dy = mouse.y - py, m = Math.hypot(dx, dy);
    const dead = p.r * s * 0.3;
    if (m < dead) { input.x = 0; input.y = 0; return; }
    const mag = Math.min(1, (m - dead) / (Math.min(R.w, R.h) * 0.12));
    input.x = dx / m * mag; input.y = dy / m * mag; return;
  }
  input.x = 0; input.y = 0;
}

function firstInput() { audio.unlock(); }

window.addEventListener('keydown', (e) => {
  firstInput();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'play') pause(); else if (mode === 'paused') resume(); return; }
  if (mode === 'perk' && /^Digit[123]$/.test(e.code)) { const k = perkOpts[+e.code.slice(5) - 1]; if (k) takePerk(k.id); return; }
  if (mode === 'results' && (e.code === 'Enter' || (e.code === 'Space' && !e.repeat && document.activeElement === document.body))) { e.preventDefault(); playAgain(); return; }
  if (mode === 'play' && e.code === 'Space' && !e.repeat) input.dash = true;
  keys.add(e.code);
});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (mode === 'play') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(); });

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') {
    if (e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; moveKnob(); }
    return;
  }
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
canvas.addEventListener('pointerdown', (e) => {
  firstInput();
  if (e.pointerType === 'touch') {
    if (!touchMode) { touchMode = true; setTouchUi(); }
    if (stick.id === null) {
      stick.id = e.pointerId; stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY;
      const el = $('stick'); el.style.left = e.clientX + 'px'; el.style.top = e.clientY + 'px';
      el.classList.remove('hidden'); moveKnob();
    }
    return;
  }
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  if (mode === 'play' && e.button === 0) input.dash = true;
});
const endTouch = (e) => {
  if (e.pointerId !== stick.id) return;
  stick.id = null; $('stick').classList.add('hidden');
};
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
function moveKnob() {
  const dx = stick.x - stick.ox, dy = stick.y - stick.oy, m = Math.hypot(dx, dy) || 1, k = Math.min(1, 50 / m);
  $('knob').style.transform = `translate(${dx * k}px, ${dy * k}px)`;
}
$('btn-dash').addEventListener('pointerdown', (e) => { e.preventDefault(); firstInput(); if (mode === 'play') input.dash = true; });
$('btn-pause').addEventListener('click', () => { audio.play('click'); pause(); });
window.addEventListener('resize', () => R.resize());
window.addEventListener('touchstart', () => { if (!touchMode) { touchMode = true; setTouchUi(); } }, { passive: true, once: true });
document.addEventListener('pointerdown', firstInput);

// ---------- loop ----------
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000 || 0);
  last = now;
  if (S) {
    if (mode === 'play' || mode === 'dead') {
      acc += dt;
      let n = 0;
      while (acc >= DT && n < 6) {
        if (mode === 'play') {
          computeInput();
          step(S, input);
          input.dash = false;
          handleEvents();
          afterStep();
          if (mode !== 'play') { acc = 0; break; }
        } else {
          S.spectate = true;
          step(S, { x: 0, y: 0 });
          handleEvents();
        }
        acc -= DT; n++;
      }
      if (n >= 6) acc = 0;
    }
    const follow = !S.player.alive ? S.blobs.find((b) => b.alive && b.name === S.player.killer) : null;
    R.draw(S, mode === 'perk' || mode === 'paused' || mode === 'ad' ? 0 : dt, { follow });
    hudT -= dt;
    if (hudT <= 0 && $('hud') && !$('hud').classList.contains('hidden')) { hudT = 0.1; updateHud(); }
  }
}

async function boot() {
  platform.loadingStart();
  await platform.init();
  const loaded = platform.load();
  if (loaded) save = { ...save, ...loaded, best: { ...save.best, ...(loaded.best || {}) }, upg: { ...(loaded.upg || {}) } };
  if (!save.owned.includes(save.skin)) save.skin = 'lime';
  audio.sfxOn = save.sfx; audio.musicOn = save.music;
  audio.forcedMute = platform.muteSetting;
  platform.onSettings((s) => { audio.forcedMute = !!(s && s.muteAudio); audio.apply(); });
  touchMode = matchMedia('(pointer: coarse)').matches;
  try { await document.fonts.load('700 20px Fredoka'); } catch {}
  platform.loadingStop();
  startRound();
  last = performance.now();
  requestAnimationFrame(frame);
}

// For automated tests: let a script read state or drive the player.
window.__gobble = { get S() { return S; }, get mode() { return mode; }, autopilot: (sk) => autopilot(S, S.player, sk) };

boot();

</script>
