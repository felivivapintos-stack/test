<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sombras de 1947</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Oswald:wght@500;700&family=Special+Elite&family=Libre+Franklin:wght@400;600&display=swap">
<style>
/* Layout: um único ecrã de jogo — barra superior, palco central (cena / mapa / interrogatório) e painéis sobrepostos. Look único, noir escuro. */
:root{
  --ink:#0c0d10;        /* fundo */
  --smoke:#17191e;      /* superfícies */
  --ash:#2a2d34;        /* linhas */
  --fog:#9a9a94;        /* texto secundário */
  --chalk:#e9e4d8;      /* texto */
  --paper:#e6dcc4;      /* caderno */
  --paper-ink:#2b241a;
  --brass:#c9a04a;      /* acento: luz de sódio */
  --truth:#86a77d; --doubt:#d1a64f; --lie:#c0554a;
  --f-display:"Limelight", "Didot", Georgia, serif;
  --f-head:"Oswald", "Arial Narrow", Impact, sans-serif;
  --f-type:"Special Elite", "Courier New", monospace;
  --f-body:"Libre Franklin", "Franklin Gothic Medium", Arial, sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font:15px/1.5 var(--f-body);overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;transition:filter .6s}
#app.bw{filter:grayscale(1) contrast(1.12)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.obj:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,13,16,.94);border-bottom:1px solid var(--ash);backdrop-filter:blur(4px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--ink)}
#hud .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
#hud .logo{font-family:var(--f-display);font-size:18px;color:var(--brass);letter-spacing:.04em;white-space:nowrap}
#hud .case{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--fog);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:transparent;border:1px solid var(--ash);border-radius:3px;padding:5px 10px;font-size:13px;font-family:var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--chalk)}
.hb:hover{border-color:var(--brass);color:var(--brass)}
.hb[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.intu{font-family:var(--f-head);font-size:13px;letter-spacing:.06em;color:var(--brass);white-space:nowrap}

main{flex:1;display:flex;flex-direction:column}
.screen{flex:1;padding-block:22px 40px}

/* botões principais */
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--brass);color:#16120a;border:0;border-radius:2px;padding:11px 20px;font-family:var(--f-head);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--ash)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* título */
.title-screen{display:grid;place-items:center;text-align:center;padding-block:40px}
.title-screen h1{font-family:var(--f-display);font-weight:400;font-size:clamp(46px,10vw,108px);line-height:.95;margin:10px 0 6px;color:var(--chalk);text-shadow:0 0 40px rgba(201,160,74,.25)}
.title-screen h1 span{display:block;color:var(--brass);font-size:.5em;letter-spacing:.3em;margin-top:8px}
.eyebrow{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.28em;font-size:12px;color:var(--fog)}
.tagline{font-family:var(--f-type);color:var(--fog);max-width:52ch;margin:14px auto 28px}
.skyline{width:100%;max-width:900px;height:auto;margin-top:30px;opacity:.9}

/* quadro de casos */
.desk h2,.sect h2{font-family:var(--f-head);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:15px;color:var(--fog);margin:0 0 14px}
.rankbar{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--ash)}
.rankbar .rk{font-family:var(--f-display);font-size:28px;color:var(--chalk)}
.rankbar .xp{font-family:var(--f-type);color:var(--fog);font-variant-numeric:tabular-nums}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.casefile{position:relative;background:var(--paper);color:var(--paper-ink);padding:18px 18px 16px;border-radius:2px;font-family:var(--f-type);box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:left;border:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.casefile::before{content:"";position:absolute;top:-10px;left:18px;width:90px;height:14px;background:var(--paper);border-radius:3px 3px 0 0}
.casefile .desk-tag{font-family:var(--f-head);letter-spacing:.2em;font-size:11px;text-transform:uppercase;color:#7a2a22}
.casefile h3{font-family:var(--f-head);font-size:22px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.02em}
.casefile .date{font-size:13px;opacity:.75}
.casefile .stars{font-size:18px;letter-spacing:2px;color:#8a6a1c}
.casefile.locked{filter:grayscale(1) brightness(.45);cursor:not-allowed}
.casefile .stamp{position:absolute;right:12px;bottom:12px;border:2px solid #7a2a22;color:#7a2a22;font-family:var(--f-head);letter-spacing:.15em;font-size:12px;padding:2px 8px;transform:rotate(-8deg);text-transform:uppercase}
.casefile:not(.locked):hover{transform:translateY(-3px)}
.casefile{transition:transform .2s}

.randbox{background:var(--smoke);border:1px solid var(--ash);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.randbox>p{margin:0 0 8px;max-width:70ch;color:var(--fog)}
.fld{display:flex;flex-direction:column;gap:4px;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--fog)}
.fld select,.fld input{font:15px var(--f-type);color:var(--chalk);background:var(--ink);border:1px solid var(--ash);border-radius:2px;padding:8px 10px;min-width:0;text-transform:none;letter-spacing:0}
.fld input{width:11em;text-transform:uppercase}
.fld select:focus-visible,.fld input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.facebox svg{transition:transform .7s ease}
.facebox.zoom svg{transform:scale(1.38) translateY(7%)}
@media (prefers-reduced-motion:reduce){.facebox svg{transition:none}}
.patience{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--fog);margin:10px 0 0}
.patience .pips{color:var(--lie);letter-spacing:3px;font-size:14px}
.patience .sideinfo{text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.entry .fa{display:block;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.7;margin-top:3px}
.casebuild{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.casebuild{grid-template-columns:minmax(0,1fr)}.casebuild>.facebox{max-width:260px}}
.casebuild>.facebox{aspect-ratio:1/1}
.slots{display:flex;flex-direction:column;gap:12px;min-width:0}
.slot{background:var(--smoke);border:1px solid var(--ash);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.slot .hint{margin:0;color:var(--fog);font-size:13px}.slot .empty{margin:0;font-family:var(--f-type);color:#5d5f63}
.evc{background:var(--paper);color:var(--paper-ink);padding:10px 12px;font-family:var(--f-type)}
.evc b{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em}.evc p{margin:2px 0 0;font-size:14px;line-height:1.45}
.perks{list-style:none;padding:0;margin:0 0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.perks li{border:1px solid var(--ash);padding:10px 12px;display:flex;flex-direction:column;gap:3px;color:#5d5f63}
.perks li b{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.perks li span{font-size:13px}.perks li.on{color:var(--chalk);border-color:var(--brass)}.perks li.on b{color:var(--brass)}
.labsel{font:14px var(--f-type);padding:6px;max-width:100%;min-width:0;flex:1}
.scene-foot .hb{white-space:nowrap}
.cut{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.cut .bar{height:34px;background:#000;border-top:1px solid #222;border-bottom:1px solid #222}
.cutin{padding-block:10px;text-align:center}
.cutin p{font-family:var(--f-type);font-size:17px;line-height:1.65;margin:6px auto 0;max-width:62ch}
.cutin .narr{color:var(--fog);font-style:italic;font-family:var(--f-body)}
.cutin .who{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.14em;color:var(--brass);font-size:13px;margin-top:16px}
.prev{border:1px solid var(--ash);padding:10px 14px;color:var(--fog);font-size:14px!important}
.prev b{display:block;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--chalk);font-style:normal}
.titlecard{margin:26px 0 10px;padding:22px 10px;border-top:1px solid var(--brass);border-bottom:1px solid var(--brass);animation:tc 1.2s ease}
.titlecard h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,7vw,64px);line-height:1.02;margin:8px 0;text-wrap:balance}
@keyframes tc{from{opacity:0;letter-spacing:.2em}to{opacity:1}}
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-top:12px}
.frames.film{background:#000;padding:22px 12px;background-image:repeating-linear-gradient(90deg,#000 0 14px,#2a2a2a 14px 24px);background-size:100% 10px;background-repeat:repeat-x;background-position:0 4px,0 100%}
.frame{background:var(--smoke);border:1px solid var(--ash);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.frame svg{width:100%;height:auto;max-height:150px;filter:sepia(.5)}
.frame .ft{font-family:var(--f-head);letter-spacing:.1em;color:var(--brass)}.frame p{margin:0;font-family:var(--f-type);font-size:14px;flex:1}
.gridwrap{overflow-x:auto;margin-top:12px}
table.grid{border-collapse:collapse;min-width:560px;width:100%}
table.grid th{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:12px;text-align:left;padding:6px;color:var(--fog)}
table.grid td{padding:4px}table.grid td button{width:100%;text-align:left;background:var(--smoke);border:1px solid var(--ash);padding:8px;font-family:var(--f-type);font-size:13px;border-radius:2px}
table.grid td button:hover:not(:disabled){border-color:var(--lie)}
.choicelist{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-width:640px}
.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin-top:12px}
.carcard{background:var(--smoke);border:1px solid var(--ash);padding:12px;display:flex;flex-direction:column;gap:4px}
.carcard b{font-family:var(--f-head);text-transform:uppercase}.carcard span{color:var(--fog);font-size:13px}.carcard p{margin:0;font-family:var(--f-type);font-size:14px;flex:1}
.carcard .btn{align-self:flex-start;margin-top:6px}
.spot{cursor:pointer}.spot:hover circle{fill:rgba(201,160,74,.3)}
.poem{font-family:var(--f-type);font-size:19px;line-height:1.7;background:var(--paper);color:var(--paper-ink);padding:20px 24px;margin:14px 0;max-width:560px;transform:rotate(-.8deg)}
.poem cite{display:block;text-align:right;font-size:14px;margin-top:8px}
.chase{max-width:760px}.chase svg{width:100%;height:auto;display:block;border:1px solid var(--ash)}
.obs{font-family:var(--f-type);font-size:20px;margin:14px 0 8px;min-height:1.6em}
.tbar{height:8px;background:var(--ash);position:relative;margin-bottom:10px}.tbar i{position:absolute;inset:0 auto 0 0;background:var(--brass);width:100%}
/* briefing / jornal */
.brief{max-width:760px;margin:0 auto}
.brief .who{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.14em;color:var(--brass);font-size:13px;margin-top:18px}
.brief p{font-family:var(--f-type);font-size:17px;line-height:1.65;margin:4px 0 0}
.brief .narr{color:var(--fog);font-style:italic;font-family:var(--f-body)}
.brief h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,52px);margin:6px 0 4px;line-height:1.05}

.paper{background:var(--paper);color:var(--paper-ink);max-width:820px;margin:0 auto;padding:22px clamp(16px,4vw,34px) 28px;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:rotate(-.6deg)}
.paper .mast{font-family:var(--f-display);font-size:clamp(28px,6vw,54px);text-align:center;border-bottom:3px double var(--paper-ink);padding-bottom:6px;line-height:1}
.paper .meta{display:flex;justify-content:space-between;font-family:var(--f-head);font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--paper-ink);padding:4px 0;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.paper h2{font-family:var(--f-head);font-weight:700;font-size:clamp(26px,5vw,44px);line-height:1.02;text-transform:uppercase;margin:0 0 8px;text-wrap:balance}
.paper .sub{font-family:var(--f-type);font-size:16px;margin:0 0 12px}
.paper .cols{columns:2 240px;column-gap:24px;font-family:var(--f-type);font-size:14px;line-height:1.55}
.flash{max-width:760px;margin:30px auto 0;border-left:2px solid var(--ash);padding-left:16px;color:var(--fog);font-style:italic}
.flash b{font-family:var(--f-head);letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--chalk);font-size:13px;display:block;margin-bottom:6px}

/* mapa */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}
@media (max-width:860px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:1px solid var(--ash);background:#0f1620;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin .dot{transition:r .2s}
.pin:hover .dot{r:11}
.loclist{display:flex;flex-direction:column;gap:8px}
.loc{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--smoke);border:1px solid var(--ash);padding:10px 12px;border-radius:2px}
.loc:hover{border-color:var(--brass)}
.loc .n{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.05em;font-size:15px;line-height:1.2}
.loc .a{font-size:12px;color:var(--fog)}
.loc .st{margin-left:auto;font-family:var(--f-head);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap}
.st.new{background:var(--brass);color:#16120a}.st.done{color:var(--truth);border:1px solid var(--truth)}.st.part{color:var(--fog);border:1px solid var(--ash)}
.st.final{background:var(--lie);color:#fff}
.radio{font-family:var(--f-type);color:var(--brass);min-height:1.5em;margin-top:10px}

/* cena */
.scene-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.scene-head h2{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;margin:0;font-size:24px;line-height:1.1}
.scene-head .a{color:var(--fog);font-size:13px}
.stage{position:relative;border:1px solid var(--ash);background:#000;overflow:hidden;touch-action:manipulation}
.stage svg{display:block;width:100%;height:auto;cursor:crosshair}
.obj{cursor:zoom-in}
.obj:hover .vis{filter:brightness(1.35)}
.obj.found .vis{filter:brightness(1.1)}
.vib{position:absolute;left:12px;bottom:12px;font-family:var(--f-head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);opacity:0;transition:opacity .3s;pointer-events:none;display:flex;align-items:center;gap:8px}
.vib.on{opacity:1}
.vib i{width:10px;height:10px;border-radius:50%;background:var(--brass);animation:ping 1s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(201,160,74,.7)}100%{box-shadow:0 0 0 14px rgba(201,160,74,0)}}
.scene-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.tally{font-family:var(--f-type);color:var(--fog)}
.tally b{color:var(--chalk)}
.examine{position:relative;margin-top:12px;background:var(--paper);color:var(--paper-ink);padding:14px 16px;font-family:var(--f-type);box-shadow:0 10px 30px rgba(0,0,0,.7);border-radius:2px}
.examine .k{font-family:var(--f-head);letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:#7a2a22}
.examine h4{margin:2px 0 6px;font-family:var(--f-head);font-size:19px;text-transform:uppercase}
.examine p{margin:0;font-size:14.5px;line-height:1.5}
.examine .x{position:absolute;right:8px;top:6px;background:none;border:0;font-size:20px;color:var(--paper-ink)}

/* interrogatório */
.int{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:22px}
@media (max-width:820px){.int{grid-template-columns:minmax(0,1fr)}}
.facebox{position:relative;background:radial-gradient(ellipse at 50% 35%,#3a3428 0%,#15130f 70%);border:1px solid var(--ash);overflow:hidden;aspect-ratio:5/6;max-width:100%}
.facebox svg{width:100%;height:100%;display:block}
.facebox .blinds{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 22px,rgba(0,0,0,.35) 22px 34px);transform:skewY(-12deg) scale(1.4);pointer-events:none;mix-blend-mode:multiply}
.facebox .nm{position:absolute;left:12px;bottom:10px;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.1em;font-size:14px;text-shadow:0 1px 4px #000}
.facebox .watch{position:absolute;right:10px;top:10px;font-family:var(--f-head);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);opacity:0;transition:opacity .3s}
.facebox .watch.on{opacity:1}
.dialog{background:var(--smoke);border:1px solid var(--ash);padding:14px 16px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.line{margin:0;font-family:var(--f-type);font-size:16px;line-height:1.55}
.line .sp{font-family:var(--f-head);letter-spacing:.12em;text-transform:uppercase;font-size:12px;display:block;color:var(--fog)}
.line.me .sp{color:var(--brass)}
.line.partner{color:var(--fog);font-size:14px}
.qlist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.q{display:flex;justify-content:space-between;gap:10px;text-align:left;background:transparent;border:1px solid var(--ash);padding:9px 12px;border-radius:2px;font-family:var(--f-type)}
.q:hover:not(:disabled){border-color:var(--brass)}
.q:disabled{opacity:.75;cursor:default}
.q .r{font-family:var(--f-head);font-size:12px;letter-spacing:.1em}
.q .r.ok{color:var(--truth)}.q .r.bad{color:var(--lie)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ch{border:0;border-radius:2px;padding:12px 6px;font-family:var(--f-head);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:#111}
.ch small{display:block;font-weight:500;letter-spacing:.04em;text-transform:none;font-family:var(--f-body);font-size:11px;opacity:.85}
.ch.t{background:var(--truth)}.ch.d{background:var(--doubt)}.ch.l{background:var(--lie);color:#fff}
.ch:disabled{opacity:.18;cursor:not-allowed}
.ch.struck{text-decoration:line-through}
.sideinfo{font-size:13px;color:var(--fog);margin-top:10px}

/* caderno */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.tabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--paper-ink);color:var(--paper-ink);padding:4px 10px;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.1em;font-size:12px;border-radius:2px}
.tab[aria-selected="true"]{background:var(--paper-ink);color:var(--paper)}
.entry{padding:8px 0;border-bottom:1px dashed rgba(43,36,26,.35);display:block;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font-family:inherit}
.entry b{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.entry p{margin:2px 0 0;font-size:14px;line-height:1.45}
button.entry:hover{background:rgba(201,160,74,.25)}
.nb-empty{opacity:.7}
.modal{width:min(520px,100%);background:var(--smoke);border:1px solid var(--ash);padding:20px;border-radius:2px}
.modal h3{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}
.modal p{font-family:var(--f-type);margin:0 0 16px}

/* acusação */
.charge{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.suspect{background:var(--smoke);border:1px solid var(--ash);display:flex;flex-direction:column;min-width:0}
.suspect .facebox{aspect-ratio:1/1;border:0;border-bottom:1px solid var(--ash)}
.suspect .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.suspect h3{margin:0;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:20px}
.suspect .motive{font-family:var(--f-type);color:var(--fog);font-size:14px;margin:0}
.ev{list-style:none;padding:0;margin:0;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.ev li.y::before{content:"■ ";color:var(--brass)}
.ev li.n{color:#5d5f63}.ev li.n::before{content:"□ "}
.suspect .btn{margin-top:auto;align-self:flex-start}

/* tiroteio */
.hudshoot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px;font-family:var(--f-head);letter-spacing:.08em;text-transform:uppercase;font-size:14px}

.hp i{position:absolute;inset:0 auto 0 0;background:var(--lie);transition:width .2s}
.ammo{color:var(--brass);font-variant-numeric:tabular-nums}
.stage.hurt::after{content:"";position:absolute;inset:0;background:rgba(160,20,20,.45);pointer-events:none;animation:fade .4s forwards}
@keyframes fade{to{opacity:0}}
.enemy{cursor:crosshair}

.breakdown{display:grid;grid-template-columns:1fr auto;gap:6px 18px;text-align:left;font-family:var(--f-type);margin:20px auto;max-width:420px;font-variant-numeric:tabular-nums}

#grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.035;mix-blend-mode:screen}

.foot{color:#5d5f63;font-size:12px;text-align:center;padding:16px}
#hudClock,#hudMoney{font-family:var(--f-head);font-size:13px;letter-spacing:.06em;white-space:nowrap;font-variant-numeric:tabular-nums}

.stat span{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--fog)}

.meter{height:10px;background:var(--ash);position:relative;margin:4px 0}.meter i{position:absolute;inset:0 auto 0 0;background:var(--lie);transition:width .4s}
.meter.sus{flex:1;min-width:120px}

.stage.slim svg{cursor:default}
h3.cur{margin:2px 0 0;font-family:var(--f-head);text-transform:uppercase;font-size:20px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:14px;margin-top:14px}
.member{background:var(--smoke);border:1px solid var(--ash);display:flex;flex-direction:column;min-width:0}

    const ease=t=>t<0?0:t>1?1:t*t*(3-2*t),amp=(this.subtle?.45:1)*(cold?.8:1);

    if(nerv){dx+=Math.sin(now/430)*Math.sin(now/1170)*3.2;dy+=Math.max(0,Math.sin(now/2300))*1.2;blinkRate=2.2;sw=.22;rot=Math.sin(now/900)*.7}

      case"lie":{

        if(T.has("blink"))blinkRate=Math.max(blinkRate,this.subtle?2:4);

function genTemper(r,killer,diff){const x=r();const temper=killer&&diff===3?(x<.45?"frio":x<.8?"calmo":"nervoso"):(x<.25?"frio":x<.65?"calmo":"nervoso");

STORIES.poet=B=>{const{P,r}=B;const T=B.T;

  const cList=B.clue("list","scene",{icon:"book",name:"Lista do júri de 1946",desc:`Na mala da vítima: a lista do júri do Prémio de Poesia de Los Angeles de 1946. ${V.first} estava nela. Riscados a lápis, dois nomes de jurados que morreram este ano.`,label:"Mala"});
  B.loc("morgue",{name:"Morgue do condado",area:"Hall of Justice, Downtown",bg:"morgue",special:{type:"coroner",items:[
    ["Causa da morte","Estrangulamento com um cordão de seda, puxado por trás. O assassino é paciente: esperou que ela deixasse de lutar e depois arrumou-a.",{name:"Cordão de seda",desc:"Estrangulada com um cordão de seda, por trás."}],
    ["Hora da morte",`Por volta das ${T(tD)}.`,{name:"Hora da morte",desc:`Por volta das ${T(tD)}.`}],

  const keyOk=B.kid("caught"),keyBad=B.kid("second");

    ${SAVE.last?`<p class="prev"><b>Anteriormente</b>${esc(SAVE.last)}</p>`:""}
    <div id="co"></div>
    <div class="titlecard" id="tc" hidden><div class="eyebrow">${esc(c.desk)} · ${esc(c.date)}</div><h2>${esc(c.title)}</h2><div class="eyebrow">Processo ${esc(c.code)}</div></div>
    <div id="bl"></div><div class="row" style="margin-top:22px;justify-content:center"><button class="btn" id="go" hidden>Para o carro</button></div></div><div class="bar"></div></div>`,"brief");
  await lines($("#co"),c.coldOpen);const tc=$("#tc");if(!tc)return;tc.hidden=false;A.allFound();
  await new Promise(r=>setTimeout(r,reduceMotion()?0:900));
  await lines($("#bl"),[["Mercer",c.voice]].concat(c.briefing));const g=$("#go");if(!g)return;g.hidden=false;g.focus();g.onclick=()=>map()}

/* ---------- mapa com reviravoltas e atos ---------- */
async function map(){const c=CUR();if(RUN.t>=tEnd())return timeUp();
  if(c.twists&&await runTwists())return map();
  const ls=Object.entries(c.locs).filter(([k,l])=>locOpen(l)&&!l.base&&k!==RUN.at);const from=c.locs[RUN.at]||c.locs.main;
  const lbl={new:"Novo",part:"Visitado",done:"Visitado",final:"Acusar"};
  screen(`<div class="scene-head"><div><div class="eyebrow">Episódio ${epNum()} · ${esc(actOf(c))} · ${esc(c.partner)} ao volante</div><h2>Para onde, Mercer?</h2></div></div>
  <div class="mapgrid"><div class="mapbox">${mapSVG(c)}</div>
  <div><div class="loclist">${ls.map(([k,l])=>{const st=locState(k,l);return `<button class="loc" data-l="${k}"><div><div class="n">${esc(l.name)}</div><div class="a">${esc(l.area)} · ${l.finale?"fecha o caso":travelMin(from,l)+" min"}</div></div><span class="st ${st==="done"?"part":st}">${lbl[st]}</span></button>`}).join("")}</div>
  <p class="sideinfo">Cada viagem gasta tempo. Às ${fmtT(tEnd())} o capitão exige uma acusação com o que tiveres.</p>
  <div class="radio" id="radio"></div></div></div>`,"map");
  main.querySelectorAll("[data-l]").forEach(b=>{b.onclick=()=>travel(b.dataset.l);b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();travel(b.dataset.l)}}});
  const pool=(c.banter||[]).map(x=>`${c.partnerShort}: «${x}»`).concat(RADIO);typeInto($("#radio"),pool[Math.floor(Math.random()*pool.length)],22)}
function arrive(k){const c=CUR(),l=c.locs[k];const first=!RUN.seen.includes(k);if(!l.finale)RUN.at=k;if(first&&!l.finale)RUN.seen.push(k);persist();
  if(l.finale)return chargeIntro();
  if(l.decoy&&first)return decoy(k);
  if(l.flee&&first&&!(RUN.dead||[]).includes(l.flee.pid)){const P0=PEOPLE[l.flee.pid];
    return modal("Está a fugir!",`Mal ${P0.name} te vê entrar, ${P0.f?"ela":"ele"} sai a correr pela porta das traseiras${l.flee.mode==="carro"?" e mete-se num carro":""}.`,["Atrás dele"+(P0.f?"a":"")]).then(()=>chase({mode:l.flee.mode,name:P0.name,f:P0.f,
      win:async()=>{addClue(l.flee.dropId);RUN.foundAt=RUN.foundAt||{};RUN.foundAt[l.flee.dropId]="Perseguição";await modal("Apanhad"+(P0.f?"a":"o"),`Encostas ${P0.name} contra uma parede. Na luta, cai-lhe uma coisa do casaco. ${CLUES[l.flee.dropId].name}.`,["Algemar e voltar"]);location_(k)},
      lose:async()=>{if(l.int){RUN.ints[l.int]=true;RUN.qres[l.int]=RUN.qres[l.int]||{};(c.ints[l.int]?c.ints[l.int].qs:[]).forEach((q,i)=>{if(!RUN.qres[l.int][i])RUN.qres[l.int][i]="miss"})}
        if(tick(30))return timeUp();await modal("Fugiu",`${P0.name} desaparece no meio do trânsito. Não vais conseguir interrogá-l${P0.f?"a":"o"} hoje, mas podes revistar o local.`,["Voltar ao local"]);persist();location_(k)}}))}
  location_(k)}

/* ---------- local com mecânica especial ---------- */
const _loc0=location_;
location_=function(k){_loc0(k);const c=CUR(),l=c.locs[k];if(!l||!l.special)return;const sp=l.special;RUN.spec=RUN.spec||{};
  const done=sp.type==="coroner"?(RUN.spec[k]||[]).length>=sp.items.length:!!RUN.spec[k];
  const lbl={coroner:`Falar com o ${CORONER}`,frames:sp.title,grid:sp.title,route:sp.title,lineup:sp.title,origin:sp.title,riddle:sp.title}[sp.type];
  const row=main.querySelector(".scene-head .row");if(!row)return;const b=document.createElement("button");b.className="btn";b.textContent=done?lbl+" · feito":lbl;b.disabled=done&&sp.type!=="coroner";if(done&&sp.type==="coroner")b.disabled=true;
  row.prepend(b);b.onclick=()=>special(k)};
function special(k){const c=CUR(),l=c.locs[k],sp=l.special;RUN.spec=RUN.spec||{};RUN.foundAt=RUN.foundAt||{};
  const head=(t,i)=>`<div class="scene-head"><div><div class="eyebrow">${esc(l.name)}</div><h2>${esc(t)}</h2></div><button class="btn ghost" id="bk">Voltar</button></div><p class="sideinfo">${esc(i)}</p>`;
  const give=(cid,where)=>{if(addClue(cid)){RUN.foundAt[cid]=where||l.name;A.found();toast("Nova pista no caderno: "+CLUES[cid].name)}};
  const bk=()=>{const x=$("#bk");if(x)x.onclick=()=>location_(k)};
  if(sp.type==="coroner"){const doneI=RUN.spec[k]=RUN.spec[k]||[];
    screen(head("Morgue",`O ${CORONER} limpa os óculos à bata. Cada pergunta demora uns dez minutos de explicações.`)+`<div class="int"><div><div class="facebox" id="fb">${faceSVG(PEOPLE.coroner)}<div class="blinds"></div><span class="nm">${esc(CORONER)}</span></div></div><div style="min-width:0"><div class="dialog" id="dlg"></div><div class="qlist" id="ql"></div></div></div>`,"special");bk();
    const face=new Face($("#fb svg"),{person:PEOPLE.coroner});const dlg=$("#dlg");
    const say=async(w,t,cls="")=>{const p=document.createElement("p");p.className="line "+cls;p.innerHTML=`<span class="sp">${esc(w)}</span><span class="tx"></span>`;dlg.appendChild(p);while(dlg.children.length>4)dlg.firstChild.remove();if(!cls)face.talk(Math.min(3000,t.length*35));await typeInto(p.querySelector(".tx"),t,14)};
    const draw=()=>{$("#ql").innerHTML=sp.items.map((it,i)=>`<button class="q" data-i="${i}" ${doneI.includes(i)?"disabled":""}><span>${esc(it[0])}</span><span class="r">${doneI.includes(i)?"Perguntado":"10 min"}</span></button>`).join("");
      $("#ql").querySelectorAll("button:not(:disabled)").forEach(b=>b.onclick=async()=>{const i=+b.dataset.i;$("#ql").querySelectorAll("button").forEach(x=>x.disabled=true);const it=sp.items[i];
        await say("Mercer",it[0]+"?","me");await say(CORONER,it[1]);doneI.push(i);give(it[2],"Morgue");persist();if(tick(10))return timeUp();draw()})};
    (async()=>{await say(CORONER,"Detetive. Os mortos falam, se soubermos ouvir. Pergunte.");draw()})();return}
  if(sp.type==="frames"){let prints=(RUN.spec[k+"_p"]??sp.prints);
    const fig=t=>t==="man"?`<path d="M30 20 a8 8 0 1 0 0.1 0Z M18 34 h24 l4 40 h-32Z M20 14 h20 l-2 -6 h-16Z" fill="#111"/>`:t==="woman"?`<path d="M30 20 a8 8 0 1 0 0.1 0Z M22 32 h16 l10 44 h-36Z M18 14 q12 -12 24 0Z" fill="#111"/>`:t==="pair"?`<path d="M20 22 a7 7 0 1 0 0.1 0Z M10 34 h20 l3 36 h-26Z M42 24 a7 7 0 1 0 0.1 0Z M34 36 h16 l8 36 h-30Z" fill="#111"/>`:`<rect x="10" y="60" width="40" height="4" fill="#333"/>`;
    const draw=()=>{screen(head(sp.title,sp.intro)+`<p class="tally">Ampliações disponíveis: <b>${prints}</b></p><div class="frames ${sp.film?"film":""}">${sp.frames.map((f,i)=>{const got=has0(f.clue);return `<div class="frame"><svg viewBox="0 0 60 80" aria-hidden="true"><rect width="60" height="80" fill="#cfc8b6"/>${fig(f.fig)}</svg><div class="ft">${esc(f.t)}</div><p>${esc(f.txt)}</p><button class="btn ghost" data-f="${i}" ${got||!prints?"disabled":""}>${got?"Ampliado":"Ampliar"}</button></div>`}).join("")}</div>`,"special");bk();
      main.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=sp.frames[+b.dataset.f];prints--;RUN.spec[k+"_p"]=prints;give(f.clue,sp.title);if(!prints)RUN.spec[k]=1;persist();if(tick(10))return timeUp();draw()})};draw();return}
  if(sp.type==="grid"){let tries=RUN.spec[k+"_t"]??2;
    const draw=msg=>{screen(head(sp.title,sp.intro)+`<div class="gridwrap"><table class="grid"><thead><tr><th></th>${sp.times.map(t=>`<th>${esc(t)}</th>`).join("")}</tr></thead><tbody>${sp.rows.map(([n,cells],ri)=>`<tr><th>${esc(n)}</th>${cells.map((x,ci)=>`<td><button data-c="${ri},${ci}" ${RUN.spec[k]||!tries?"disabled":""}>${esc(x)}</button></td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="tally">${msg||`Tentativas: <b>${tries}</b>. Cada engano custa 15 minutos.`}</p>`,"special");bk();
      main.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const[ri,ci]=b.dataset.c.split(",").map(Number);
        if(ri===sp.wrong[0]&&ci===sp.wrong[1]){RUN.spec[k]=1;give(sp.reward,sp.title);persist();draw("Encontraste a contradição. Está no caderno.")}
        else{tries--;RUN.spec[k+"_t"]=tries;persist();A.click();if(tick(15))return timeUp();draw(tries?`Essa declaração bate certo com as outras. Tentativas: <b>${tries}</b>.`:"Não encontraste a contradição. Terás de chegar lá de outra maneira.")}})};draw();return}
  if(sp.type==="route"){const draw=msg=>{screen(head(sp.title,sp.intro)+`<div class="choicelist">${sp.options.map(([n,d])=>`<button class="loc" data-o="${esc(n)}" ${RUN.spec[k]?"disabled":""}><div><div class="n">${esc(n)}</div><div class="a">Conhecido por: ${esc(d)}</div></div><span class="st part">45 min se errares</span></button>`).join("")}</div><p class="tally">${msg||""}</p>`,"special");bk();
      main.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(b.dataset.o===sp.correct){RUN.spec[k]=1;grant({open:sp.okLoc});persist();draw(`Uma patrulha confirma: há um carro abandonado em ${sp.correct}. Já está no mapa.`)}
        else{A.click();if(tick(45))return timeUp();draw(`A patrulha vai a ${b.dataset.o} e não encontra nada. Perdeste 45 minutos.`)}})};draw();return}
  if(sp.type==="lineup"){const hex={"verde-garrafa":"#1f4a32","bordô":"#5a1a24","azul-noite":"#1a2440",preto:"#111",creme:"#d8ccaa",cinzento:"#6a6a6a"};
    const draw=msg=>{screen(head(sp.title,sp.intro)+`<div class="cars">${sp.cars.map(([o,col,m,d],i)=>`<div class="carcard"><svg viewBox="0 0 200 80" aria-hidden="true"><path d="M10 56 Q14 30 50 26 L80 12 L140 12 L168 30 Q192 34 192 56Z" fill="${hex[col]||"#444"}"/><rect x="84" y="16" width="26" height="14" fill="#9ab" opacity=".6"/><rect x="114" y="16" width="26" height="14" fill="#9ab" opacity=".6"/><circle cx="50" cy="58" r="12" fill="#111"/><circle cx="160" cy="58" r="12" fill="#111"/><circle cx="188" cy="44" r="4" fill="#ffe8a0"/></svg><b>${esc(m)} ${esc(col)}</b><span>${esc(o)}</span><p>${esc(d)}</p><button class="btn ghost" data-car="${i}" ${RUN.spec[k]?"disabled":""}>É este</button></div>`).join("")}</div><p class="tally">${msg||"Cada engano custa 20 minutos."}</p>`,"special");bk();
      main.querySelectorAll("[data-car]").forEach(b=>b.onclick=()=>{if(+b.dataset.car===sp.correct){RUN.spec[k]=1;give(sp.reward,sp.title);(sp.okOpen||[]).forEach(o=>grant({open:o}));persist();draw("É este carro. O dono já está no mapa.")}else{A.click();if(tick(20))return timeUp();draw("O mecânico abana a cabeça: esse carro não tem nada a ver. Perdeste 20 minutos.")}})};draw();return}
  if(sp.type==="origin"){let tries=RUN.spec[k+"_t"]??2;const sc=SCN[l.scene];
    const draw=msg=>{screen(head(sp.title,sp.intro)+`<div class="stage"><svg viewBox="0 0 1000 560">${sc.bg}${sp.spots.map((s,i)=>`<g class="spot" data-s="${i}" tabindex="0" role="button" aria-label="${esc(s.l)}"><circle cx="${s.x}" cy="${s.y}" r="38" fill="rgba(201,160,74,.12)" stroke="#c9a04a" stroke-width="3" stroke-dasharray="6 5"/><text x="${s.x}" y="${s.y+62}" text-anchor="middle" font-family="Oswald,sans-serif" font-size="18" fill="#e9e4d8" style="paint-order:stroke;stroke:#000;stroke-width:4px">${esc(s.l)}</text></g>`).join("")}</svg></div><p class="tally">${msg||`Tentativas: <b>${tries}</b>.`}</p>`,"special");bk();
      if(RUN.spec[k])return;main.querySelectorAll("[data-s]").forEach(g=>g.onclick=()=>{const i=+g.dataset.s;
        if(i===sp.correct){RUN.spec[k]=1;give(sp.reward,sp.title);persist();draw("O chefe dos bombeiros acena: «É aqui. Olhe para o chão.»")}
        else{tries--;RUN.spec[k+"_t"]=tries;A.click();if(tick(15))return timeUp();if(!tries){RUN.spec[k]=1;give(sp.reward,sp.title);persist();draw(`O chefe perde a paciência e mostra-te: «Foi em ${sp.spots[sp.correct].l}.» Perdeste tempo.`)}else{persist();draw("«Não, aí o fogo chegou depois.»")}}})};draw();return}
  if(sp.type==="riddle"){screen(head(sp.title,sp.intro)+`<blockquote class="poem">${esc(sp.poem).replace(/\n/g,"<br>")}<cite>— O Poeta</cite></blockquote><div class="choicelist">${sp.options.map(o=>`<button class="loc" data-o="${esc(o)}" ${RUN.spec[k]?"disabled":""}><div><div class="n">${esc(o)}</div><div class="a">Mandar as patrulhas para aqui esta noite</div></div></button>`).join("")}</div>`,"special");bk();
    main.querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{const ok=b.dataset.o===sp.correct;RUN.spec[k]=1;RUN.riddleOk=ok;grant({open:ok?sp.okLoc:sp.badLoc});persist();
      if(ok)await cutscene("Esta noite","",undefined);
      await cutscene(ok?"A tempo":"Tarde demais",ok?[["narr",`${sp.correct}, onze da noite. As patrulhas chegam em silêncio.`],["narr","Alguém corre na escuridão. Uma porta bate. No chão fica um cordão de seda com um nó de marinheiro."],["Mercer","Desta vez ninguém morreu. Desta vez."]]:[["narr",`Mandaste as patrulhas para ${b.dataset.o}.`],["Rádio",`«Central para Mercer: corpo de mulher em ${sp.correct}. Tem um poema nas mãos.»`],["Mercer","Li mal o poema. Alguém pagou por isso."]]);
      map()});return}}

/* ---------- perseguição ---------- */
function chase(cfg){RUN.screen="chase";const car=cfg.mode==="carro";
  const OBS=car?[["Um elétrico atravessa-se no cruzamento","Travar"],["A rua estreita à esquerda está livre","Virar à esquerda"],["Um camião de leite bloqueia a faixa","Virar à direita"],["O semáforo fica vermelho e há crianças na passadeira","Travar"],["Ele corta para um beco à direita","Virar à direita"],["Obras na faixa da direita","Virar à esquerda"]]
    :[["Um caixote de fruta no meio do beco","Saltar"],["Um estendal de roupa à altura da cabeça","Baixar-se"],["Uma carroça de gelo atravessa-se","Desviar"],["Uma vedação baixa de madeira","Saltar"],["Uma escada de incêndio com um degrau partido","Baixar-se"],["Um grupo de marinheiros à saída de um bar","Desviar"]];
  const acts=car?["Travar","Virar à esquerda","Virar à direita"]:["Saltar","Baixar-se","Desviar"];
  let gap=3,step=0,over=false,tmr=null;const lim=CUR()&&CUR().subtle?1900:2600;
  screen(`<div class="scene-head"><div><div class="eyebrow">Perseguição ${car?"de carro":"a pé"}</div><h2>Apanha ${esc(cfg.name)}!</h2></div><span class="sideinfo">Escolhe a ação certa antes que a barra acabe. Teclas 1, 2 e 3.</span></div>
   <div class="chase"><svg viewBox="0 0 1000 200" aria-hidden="true"><rect width="1000" height="200" fill="#141820"/><rect y="150" width="1000" height="50" fill="#222326"/>${Array.from({length:12},(_,i)=>`<rect x="${i*90}" y="40" width="70" height="110" fill="#1b2030"/>`).join("")}<g id="me"><circle cx="0" cy="118" r="10" fill="#c9a04a"/><rect x="-8" y="128" width="16" height="22" fill="#c9a04a"/></g><g id="him"><circle cx="0" cy="118" r="10" fill="#e9e4d8"/><rect x="-8" y="128" width="16" height="22" fill="#e9e4d8"/></g></svg>
   <p class="obs" id="obs"></p><div class="tbar"><i id="tb"></i></div><div class="choices" id="ca">${acts.map((a,i)=>`<button class="ch ${["t","d","l"][i]}" data-a="${esc(a)}">${i+1}. ${esc(a)}</button>`).join("")}</div><p class="tally" id="gap"></p></div>`,"chase");
  const upd=()=>{const me=$("#me"),him=$("#him");if(!me)return;const hx=700,mx=hx-gap*90;me.setAttribute("transform",`translate(${mx} 0)`);him.setAttribute("transform",`translate(${hx} 0)`);$("#gap").innerHTML=`Distância: <b>${gap}</b> ${gap===1?"passo":"passos"} · obstáculo ${Math.min(step+1,10)} de 10`};
  const end=win=>{over=true;clearTimeout(tmr);document.removeEventListener("keydown",kd);setTimeout(()=>win?cfg.win():cfg.lose(),500)};
  const next=()=>{if(over||!$("#obs"))return;if(gap<=0)return end(true);if(gap>=6||step>=10)return end(false);const o=OBS[Math.floor(Math.random()*OBS.length)];cur=o;$("#obs").textContent=o[0];
    const tb=$("#tb");tb.style.transition="none";tb.style.width="100%";void tb.offsetWidth;tb.style.transition=`width ${lim}ms linear`;tb.style.width="0%";
    clearTimeout(tmr);tmr=setTimeout(()=>pick(null),lim)};
  let cur=null;const pick=a=>{if(over||!cur)return;const ok=a===cur[1];cur=null;step++;gap+=ok?-1:1;(ok?A.found:A.click).call(A);upd();setTimeout(next,ok?250:450)};
  const kd=e=>{const i="123".indexOf(e.key);if(i>=0)pick(acts[i])};document.addEventListener("keydown",kd);
  main.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>pick(b.dataset.a));upd();setTimeout(next,700)}

/* ---------- barra ---------- */
$("#bMenu").onclick=()=>{A.init();A.startMusic();desk()};
$("#bMap").onclick=async()=>{const c=CUR();if(RUN.screen==="int"){const r=await modal("Sair do interrogatório?","As perguntas por fazer ficam perdidas.",["Sair","Ficar"]);if(r)return;
  RUN.ints[RUN.curInt]=true;persist()}if(["shoot","talk","chase","cut","brief"].includes(RUN.screen))return;c.uc?ucHub():map()};
$("#bNote").onclick=()=>notebook("view");
$("#bBW").onclick=()=>{SAVE.bw=!SAVE.bw;persist();hud()};
$("#bSnd").onclick=()=>{SAVE.sound=!SAVE.sound;A.on=SAVE.sound;A.init();if(SAVE.sound)A.startMusic();persist();hud()};
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select"))return;if((e.key==="n"||e.key==="N")&&!$("#bNote").hidden&&!document.querySelector(".overlay"))notebook("view");if(e.key==="Escape")document.querySelector(".overlay #nbX")?.click()});

/* ---------- grão de película ---------- */
(function grain(){const cv=$("#grain"),x=cv.getContext("2d");const W=160,H=100;cv.width=W;cv.height=H;cv.style.width="100%";cv.style.height="100%";if(reduceMotion())return;const img=x.createImageData(W,H);
  let last=0;const f=t=>{if(t-last>80){last=t;for(let i=0;i<img.data.length;i+=4){const v=Math.random()*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255}x.putImageData(img,0,0)}requestAnimationFrame(f)};requestAnimationFrame(f)})();

/* ---------- arranque ---------- */
function start(data){const s=(data&&data.save)||store.get("s47-save2");if(s)SAVE={...SAVE,...s};RUN=(data&&data.run)||store.get("s47-run2");A.on=SAVE.sound;
  if(RUN&&RUN.caseId&&!CUR())RUN=null;
  if(data&&data.run&&data.run.caseId&&CUR()){A.init();resume()}else title()}
window.claude?.hot?.snapshot?.(()=>({save:SAVE,run:RUN}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
