<style>
/* Layout: one 1280x720 arena canvas, letterboxed; HTML screens float over it, sized in arena units (--u). Single dark arcade look. */
:root{
  --night:#130e2e;
  --panel:rgba(19,14,46,.92);
  --ink:#fff6e6;
  --muted:#b9b0d9;
  --gold:#ffcf3a;
  --red:#ff4d5e;
  --blue:#2bb6e8;
  --green:#5cff8a;
  --line:rgba(255,246,230,.16);
  --f-display:"Bowlby One", Impact, "Arial Black", sans-serif;
  --f-ui:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --u:1px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1280px;height:720px}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none;font-family:var(--f-ui);font-size:calc(var(--u)*24);line-height:1.15}
.screen{position:absolute;inset:0;pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;pointer-events:auto;background:none}
button:focus-visible{outline:calc(var(--u)*4) solid var(--gold);outline-offset:calc(var(--u)*3)}

/* menu */
#menu{background:linear-gradient(90deg,rgba(19,14,46,.95) 0,rgba(19,14,46,.74) 38%,rgba(19,14,46,0) 62%)}
.menu-col{position:absolute;left:calc(var(--u)*72);top:calc(var(--u)*30);width:calc(var(--u)*470);display:flex;flex-direction:column;gap:calc(var(--u)*9)}
.logo{font-family:var(--f-display);font-weight:400;font-size:calc(var(--u)*78);line-height:.86;color:var(--gold);letter-spacing:calc(var(--u)*1);transform:rotate(-4deg);transform-origin:left bottom;text-shadow:calc(var(--u)*6) calc(var(--u)*6) 0 var(--red),calc(var(--u)*12) calc(var(--u)*12) 0 rgba(0,0,0,.35);margin:0 0 calc(var(--u)*14)}
.logo span{display:block;white-space:nowrap}
.logo .lb{display:inline-block;width:.74em;height:.74em;vertical-align:-.04em;margin:0 .02em;filter:drop-shadow(calc(var(--u)*6) calc(var(--u)*6) 0 var(--red));animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.logo span:last-child{color:var(--ink);margin-left:calc(var(--u)*46)}
.tag{font-size:calc(var(--u)*24);font-weight:600;color:var(--muted);margin:0 0 calc(var(--u)*4);text-transform:uppercase;letter-spacing:.06em}
.btn{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*12);padding:calc(var(--u)*9) calc(var(--u)*24);border-radius:calc(var(--u)*14);font-weight:800;font-size:calc(var(--u)*28);text-transform:uppercase;letter-spacing:.04em;background:rgba(255,246,230,.08);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line);transition:transform .12s, background .12s}
.btn:hover{transform:translateX(calc(var(--u)*6));background:rgba(255,246,230,.14)}
.btn.primary{background:var(--gold);color:#2a1606;box-shadow:0 calc(var(--u)*6) 0 #b5831a}
.btn.primary:hover{background:#ffd95c}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.btn small{font-size:calc(var(--u)*20);font-weight:600;opacity:.8;letter-spacing:.02em;text-transform:none}
.seg{display:flex;gap:calc(var(--u)*6);align-items:center}
.seg .lbl{font-size:calc(var(--u)*19);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;width:calc(var(--u)*120)}
.seg button{flex:1;padding:calc(var(--u)*7) 0;border-radius:calc(var(--u)*10);font-weight:800;font-size:calc(var(--u)*21);text-transform:uppercase;background:rgba(255,246,230,.06);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.keys{font-size:calc(var(--u)*19);color:var(--muted);display:flex;flex-direction:column;gap:calc(var(--u)*2);margin-top:calc(var(--u)*4)}

.topbar{position:absolute;right:calc(var(--u)*24);top:calc(var(--u)*20);display:flex;gap:calc(var(--u)*10);pointer-events:auto}
.pill{display:flex;align-items:center;gap:calc(var(--u)*8);padding:calc(var(--u)*8) calc(var(--u)*16);border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line);font-weight:800;font-size:calc(var(--u)*24);font-variant-numeric:tabular-nums}
.coin{display:inline-block;flex:none;width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a8,var(--gold) 45%,#c48a12);box-shadow:inset 0 0 0 calc(var(--u)*2) #a87510}

/* challenges */
.chal{position:absolute;right:calc(var(--u)*24);bottom:calc(var(--u)*24);width:calc(var(--u)*390);padding:calc(var(--u)*16) calc(var(--u)*20);border-radius:calc(var(--u)*18);background:var(--panel);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line);display:flex;flex-direction:column;gap:calc(var(--u)*10)}
.chal h3{margin:0;font-weight:800;font-size:calc(var(--u)*20);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.chal h3 span:last-child{color:var(--gold)}
.ch{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*4) calc(var(--u)*10);align-items:center}
.ch .n{font-weight:600;font-size:calc(var(--u)*21)}
.ch .r{display:flex;align-items:center;gap:calc(var(--u)*5);font-weight:800;font-size:calc(var(--u)*19);font-variant-numeric:tabular-nums}
.ch .bar{grid-column:1/-1;height:calc(var(--u)*7);border-radius:99px;background:rgba(255,246,230,.1);overflow:hidden}
.ch .bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.ch.done .n{color:var(--green)} .ch.done .bar i{background:var(--green)}

/* panels */
.center{display:grid;place-items:center;background:rgba(10,7,26,.62)}
.card{width:calc(var(--u)*600);padding:calc(var(--u)*30) calc(var(--u)*40);border-radius:calc(var(--u)*24);background:var(--panel);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line),0 calc(var(--u)*20) calc(var(--u)*60) rgba(0,0,0,.5);display:flex;flex-direction:column;gap:calc(var(--u)*12);text-align:center}
.card h2{font-family:var(--f-display);font-weight:400;font-size:calc(var(--u)*60);margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--muted);font-weight:600;font-size:calc(var(--u)*24);margin:0}
.final{font-family:var(--f-display);font-size:calc(var(--u)*50);display:flex;justify-content:center;gap:calc(var(--u)*24);font-variant-numeric:tabular-nums}
.final .a{color:var(--red)}
.earn{display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*10);font-weight:800;font-size:calc(var(--u)*30)}
.row{display:flex;gap:calc(var(--u)*12)}
.row .btn{flex:1;justify-content:center}
#pauseBtn{position:absolute;right:calc(var(--u)*22);top:calc(var(--u)*20);width:calc(var(--u)*56);height:calc(var(--u)*56);border-radius:calc(var(--u)*14);background:var(--panel);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line);font-family:var(--f-display);font-size:calc(var(--u)*22)}

/* tournament */
.tourcard{width:calc(var(--u)*720)}
.ladder{display:flex;flex-direction:column;gap:calc(var(--u)*8);text-align:left}
.rung{display:grid;grid-template-columns:calc(var(--u)*40) calc(var(--u)*44) 1fr auto;align-items:center;gap:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*14);border-radius:calc(var(--u)*12);background:rgba(255,246,230,.05);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line)}
.rung .i{font-family:var(--f-display);font-size:calc(var(--u)*22);color:var(--muted);text-align:center}
.rung .sw{width:calc(var(--u)*36);height:calc(var(--u)*36);border-radius:50%;box-shadow:inset 0 0 0 calc(var(--u)*5) rgba(0,0,0,.25)}
.rung .tn{font-weight:800;font-size:calc(var(--u)*26);text-transform:uppercase}
.rung .st{display:flex;align-items:center;gap:calc(var(--u)*6);font-weight:800;font-size:calc(var(--u)*20);color:var(--muted);text-transform:uppercase}
.rung.next{box-shadow:inset 0 0 0 calc(var(--u)*3) var(--gold);background:rgba(255,207,58,.1)}
.rung.next .st{color:var(--gold)}
.rung.beat{opacity:.6} .rung.beat .st{color:var(--green)}
.rung.lock{opacity:.45}

/* shop */
#shop{background:rgba(10,7,26,.8);display:grid;place-items:center}
.shopcard{width:calc(var(--u)*1080);height:calc(var(--u)*600);border-radius:calc(var(--u)*24);background:var(--panel);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line);padding:calc(var(--u)*28) calc(var(--u)*34);box-sizing:border-box;display:flex;flex-direction:column;gap:calc(var(--u)*18)}
.shophead{display:flex;align-items:center;gap:calc(var(--u)*16)}
.shophead h2{font-family:var(--f-display);font-weight:400;font-size:calc(var(--u)*46);margin:0 auto 0 0}
.tabs{display:flex;gap:calc(var(--u)*8)}
.tabs button{padding:calc(var(--u)*8) calc(var(--u)*20);border-radius:calc(var(--u)*10);font-weight:800;text-transform:uppercase;background:rgba(255,246,230,.06);color:var(--muted);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--night)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*14);overflow:auto;padding:calc(var(--u)*4)}
.item{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8);padding:calc(var(--u)*12);border-radius:calc(var(--u)*16);background:rgba(255,246,230,.05);box-shadow:inset 0 0 0 calc(var(--u)*2) var(--line)}
.item.on{box-shadow:inset 0 0 0 calc(var(--u)*3) var(--gold)}
.item canvas{width:calc(var(--u)*150);height:calc(var(--u)*100)}
.item .nm{font-weight:800;font-size:calc(var(--u)*24);text-transform:uppercase}
.item button{width:100%;padding:calc(var(--u)*7) 0;border-radius:calc(var(--u)*10);font-weight:800;text-transform:uppercase;font-size:calc(var(--u)*21);background:rgba(255,246,230,.1);display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*6)}
.item button.buy{background:var(--gold);color:#2a1606}
.item button.buy[aria-disabled="true"]{opacity:.45}
.item button.eq[disabled]{background:transparent;color:var(--gold);cursor:default}
#toast{position:absolute;left:50%;bottom:calc(var(--u)*22);transform:translateX(-50%);padding:calc(var(--u)*10) calc(var(--u)*22);border-radius:999px;background:var(--ink);color:var(--night);font-weight:800;font-size:calc(var(--u)*24);pointer-events:none;transition:opacity .25s;opacity:0;white-space:nowrap;display:flex;gap:calc(var(--u)*8);align-items:center}
#pad{position:absolute;inset:0;pointer-events:none}
.btn.big{padding:calc(var(--u)*15) calc(var(--u)*26);font-size:calc(var(--u)*40)}
.btn.big small{font-size:calc(var(--u)*19);text-align:right;max-width:55%}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*8)}
.btn.mini{flex-direction:column;align-items:flex-start;justify-content:center;gap:calc(var(--u)*1);padding:calc(var(--u)*8) calc(var(--u)*14);font-size:calc(var(--u)*20);min-width:0}
.btn.mini small{font-size:calc(var(--u)*15)}
.btn.mini:hover{transform:translateY(calc(var(--u)*-2))}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:calc(var(--u)*24);height:calc(var(--u)*24);padding:0 calc(var(--u)*5);margin-right:calc(var(--u)*3);border-radius:calc(var(--u)*6);background:var(--ink);color:var(--night);font:800 calc(var(--u)*15) var(--f-ui);box-shadow:0 calc(var(--u)*3) 0 #8f86b8}
.keys .kl{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--u)*4) calc(var(--u)*4)}
.keys .kl b{color:var(--gold);margin-right:calc(var(--u)*6);font-size:calc(var(--u)*17)}
.keys .kl i{font-style:normal;margin-right:calc(var(--u)*8)}
.center-keys{align-items:center}.center-keys .kl{justify-content:center}
.help{display:flex;flex-direction:column;gap:calc(var(--u)*4);color:var(--muted);font-weight:600;font-size:calc(var(--u)*20)}
.stats{margin:0;font-weight:800;font-size:calc(var(--u)*22);font-variant-numeric:tabular-nums}
.tip{margin:0;color:var(--gold);font-weight:600;font-size:calc(var(--u)*21);text-wrap:balance}
#tutSkip{position:absolute;right:calc(var(--u)*92);top:calc(var(--u)*26);pointer-events:auto}
.pb{position:absolute;pointer-events:auto;border-radius:50%;border:calc(var(--u)*3) solid rgba(255,246,230,.4);background:rgba(19,14,46,.55);color:var(--ink);font-weight:800;text-transform:uppercase;touch-action:none;width:calc(var(--u)*110);height:calc(var(--u)*110);font-size:calc(var(--u)*24)}
.pb.mv{font-size:calc(var(--u)*40)}
.pb.act{width:calc(var(--u)*124);height:calc(var(--u)*124)}
.pb.big{width:calc(var(--u)*144);height:calc(var(--u)*144);background:rgba(232,105,30,.62)}
.pb.sm{width:calc(var(--u)*92);height:calc(var(--u)*92);font-size:calc(var(--u)*20)}
.pb.mv.sm{font-size:calc(var(--u)*32)}
.pb.xs{width:calc(var(--u)*78);height:calc(var(--u)*78);font-size:calc(var(--u)*18)}
.pb.on{background:rgba(255,207,58,.8);color:#2a1606}
#rotate{position:absolute;left:0;right:0;top:calc(var(--u)*6);text-align:center;font-weight:800;color:var(--gold);font-size:calc(var(--u)*30)}
@media (prefers-reduced-motion: reduce){.btn,.btn:hover{transition:none;transform:none}.btn.pulse{animation:none}.logo .lb{animation:none}}
</style>

<div id="stage">
  <canvas id="c" width="1280" height="720" aria-label="Ragdoll Dunk game"></canvas>
  <div id="ui">
    <section id="menu" class="screen">
      <div class="menu-col">
        <h1 class="logo" aria-label="Ragdoll Dunk"><span>RAGD<svg class="lb" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#ff8a2a" stroke="#1b1233" stroke-width="7"/><path d="M5 50h90M50 5v90M22 14c17 20 17 52 0 72M78 14c-17 20-17 52 0 72" stroke="#1b1233" stroke-width="6" fill="none"/><ellipse cx="34" cy="30" rx="12" ry="6" fill="#fff" opacity=".35" transform="rotate(-30 34 30)"/></svg>LL</span><span>DUNK</span></h1>
        <p class="tag" data-t="tag"></p>
        <button class="btn primary pulse big" id="bTour"><span data-t="play"></span><small id="tourProg"></small></button>
        <div class="row3">
          <button class="btn mini" id="bCpu"><span data-t="quick"></span><small>1P</small></button>

<script>
(()=>{
'use strict';
/* ---------- CrazyGames SDK v3 wrapper (no-op when the SDK script is absent) ---------- */
const CG={sdk:null,
  async init(){try{if(window.CrazyGames&&window.CrazyGames.SDK){await window.CrazyGames.SDK.init();this.sdk=window.CrazyGames.SDK;}}catch(e){this.sdk=null}},
  call(fn){if(!this.sdk)return;try{fn(this.sdk)}catch(e){}},
  loadingStart(){this.call(s=>s.game.loadingStart())},
  loadingStop(){this.call(s=>s.game.loadingStop())},
  gameplayStart(){this.call(s=>s.game.gameplayStart())},
  gameplayStop(){this.call(s=>s.game.gameplayStop())},
  happytime(){this.call(s=>s.game.happytime())},
  ad(type,done,ok){
    if(!this.sdk){ok&&ok();done();return}
    let fin=false;const end=good=>{if(fin)return;fin=true;setMuted(false);if(good&&ok)ok();done()};
    try{this.sdk.ad.requestAd(type,{adStarted:()=>setMuted(true),adFinished:()=>end(true),adError:()=>end(false)})}catch(e){end(false)}
  },
  getItem(k){try{if(this.sdk&&this.sdk.data){const v=this.sdk.data.getItem(k);if(v)return v}}catch(e){}try{return localStorage.getItem(k)}catch(e){return null}},
  setItem(k,v){try{if(this.sdk&&this.sdk.data)this.sdk.data.setItem(k,v)}catch(e){}try{localStorage.setItem(k,v)}catch(e){}}
};

/* ---------- constants ---------- */
const W=1280,H=720,FLOOR=632,G=1800,STEP=1/120,TARGET=10,THREE=400;
const DEF_TEAMS=[{main:'#ff4d5e',dark:'#9c1630',trim:'#ffd0d4',num:'#fff'},{main:'#2bb6e8',dark:'#12507f',trim:'#c9f1ff',num:'#fff'}];
let TEAMS=[DEF_TEAMS[0],DEF_TEAMS[1]];
const SKINS=['#f1c27d','#c68642','#8d5524','#e0ac69','#ffdbac','#a86b3c'];

const dayKey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function daily(){const now=new Date(),today=dayKey(now),y=new Date(now);y.setDate(now.getDate()-1);
  let bonus=0;
  if(save.lastDay!==today){save.streak=save.lastDay===dayKey(y)?save.streak+1:1;save.lastDay=today;bonus=15+10*Math.min(save.streak,7);save.coins+=bonus}
  if(save.chDay!==today){let h=0;for(const c of today)h=(h*31+c.charCodeAt(0))>>>0;const pool=CHALS.slice(),pick=[];
    while(pick.length<3){h=(h*1103515245+12345)>>>0;pick.push(pool.splice(h%pool.length,1)[0].id)}
    save.chDay=today;save.ch=pick.map(id=>({id,p:0,done:false}))}
  persist();return bonus}

let AC=null,master=null,noiseBuf=null,muted=false,amb=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;s.loop=true;f.type='bandpass';f.frequency.value=700;f.Q.value=.6;g.gain.value=0;
  s.connect(f);f.connect(g);g.connect(master);s.start();amb=g}catch(e){AC=null}}
function wake(){audioInit();if(AC&&AC.state==='suspended')AC.resume()}
function setMuted(m){muted=m;if(master)master.gain.value=m?0:.55}
function tone(f,dur,type,vol,slide,delay){if(!AC||!save.snd||muted)return;const n=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),n+dur);g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(vol,n+.005);
  g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(master);o.start(n);o.stop(n+dur+.02)}
function noise(dur,ft,freq,vol,att,toFreq){if(!AC||!save.snd||muted)return;const n=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;s.loop=true;f.type=ft;f.frequency.setValueAtTime(freq,n);if(toFreq)f.frequency.exponentialRampToValueAtTime(toFreq,n+dur);
  g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(vol,n+(att||.01));g.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(f);f.connect(g);g.connect(master);s.start(n);s.stop(n+dur+.05)}
function sfx(k,v){if(state==='attract')return;v=v==null?1:Math.min(1,v);
  switch(k){
    case 'bounce':tone(120,.13,'sine',.4*v,.55);break;
    case 'rim':tone(540,.2,'square',.07,.97);tone(810,.14,'triangle',.06);break;
    case 'board':noise(.09,'lowpass',700,.25*v);tone(85,.12,'sine',.25*v);break;
    case 'jump':tone(260,.09,'triangle',.05,1.9);break;
    case 'shoot':tone(380,.12,'triangle',.08,1.6);break;
    case 'perfect':tone(880,.1,'triangle',.08);tone(1320,.22,'sine',.07,1,.07);break;
    case 'grab':tone(190,.06,'square',.04,1.4);break;
    case 'steal':tone(760,.14,'square',.06,.45);noise(.12,'highpass',2000,.12);break;
    case 'swish':noise(.38,'highpass',3200,.28);break;
    case 'cheer':noise(1.6,'bandpass',1100,.22,.18,1500);break;
    case 'ooh':noise(1.1,'bandpass',900,.2,.2,380);break;
    case 'dunk':tone(60,.5,'sine',.65,.45);noise(.35,'lowpass',420,.5);break;
    case 'fire':tone(150,.6,'sawtooth',.09,4);noise(.6,'bandpass',800,.2,.05,3000);break;
    case 'mp':tone(523,.14,'square',.05);tone(659,.14,'square',.05,1,.14);tone(784,.25,'square',.05,1,.28);break;
    case 'buzzer':tone(175,.75,'sawtooth',.13);tone(179,.75,'square',.05);break;
    case 'coin':tone(990,.08,'square',.05);tone(1320,.15,'square',.05,1,.07);break;
    case 'click':tone(620,.05,'triangle',.06);break;
    case 'land':tone(70,.08,'sine',.2*v);break;
    case 'dash':noise(.16,'highpass',1800,.16);tone(320,.08,'triangle',.05,.5);break;
  }}

function resetRound(poss){
  const ps=mod.ps||1,carrier=poss==null?null:players.find(q=>q.team===poss);
  for(const p of players){const n=players.filter(q=>q.team===p.team).length;let x;
    if(carrier){const oh=ownHoop(poss),dir=oh.side===1?-1:1;x=oh.cx+dir*(p===carrier?260:p.team===poss?370:p.i===0?470:560)}
    else{const xs=n===1?[420]:[330,500],d=xs[p.i]||420;x=p.team===0?d:W-d}
    Object.assign(p,{x,y:FLOOR,dash:0,dashCD:0,stun:0,vx:0,vy:0,a:0,va:0,arm:Math.PI-.45,armV:0,grounded:true,jumpCD:.3,pickCD:0,buf:0,s:ps,cheer:0,sad:0,sq:0,swipe:0,swipeCD:0,f:p.team===0?1:-1});
    Object.assign(p.ai,{t:.2+Math.random()*.2,sHold:0,jHold:0,pHold:0,sDelay:0,relV:null,dunk:false,drive:false,shotD:rnd(200,420)});p.prev={};
    computeHand(p,STEP);p.hvx=p.hvy=0}
  Object.assign(ball,{x:W/2+rnd(-10,10),y:FLOOR-260,vx:rnd(-60,60),vy:-620,r:mod.ballR||18,holder:null,ignore:null,ignoreT:0,stealCD:0,netT:0,stuck:0,dunk:false,shooterTeam:-1,touchedRim:false,live:false,age:9,trail:[]});
  if(carrier){Object.assign(ball,{holder:carrier,vx:0,vy:0,stealCD:.9,drib:0});carrier.sArmed=false;carrier.f=Math.sign(targetHoop(poss).cx-carrier.x)||1}
  roundOver=false;for(const h of hoops)h.net=0;
  for(const s of slots)for(const k of BTN){s[k].q.length=0;s[k].down=false}}
function nextRound(poss){
  if(Math.random()<.5)mod=MODS[0];else{let m;do{m=MODS[1+Math.floor(Math.random()*(MODS.length-1))]}while(m===mod);mod=m}
  const sub=mod.id!=='normal'?nm(mod).toUpperCase():'';
  if(pendingMP){banner={text:t('matchpt'),sub,t:0,col:'#ffcf3a'};pendingMP=false;sfx('mp')}
  else if(sub)banner={text:sub,sub:'',t:0,col:'#ffcf3a'};
  resetRound(poss)}

const slots=[0,1].map(()=>Object.fromEntries(BTN.map(k=>[k,{down:false,q:[]}])));
const KEYS={KeyA:[0,'L'],KeyD:[0,'R'],KeyW:[0,'J'],KeyF:[0,'S'],KeyG:[0,'P'],ArrowLeft:[1,'L'],ArrowRight:[1,'R'],ArrowUp:[1,'J'],KeyK:[1,'S'],KeyL:[1,'P']};
const SOLO_KEYS={Space:'J',KeyJ:'S',KeyX:'S',KeyH:'P'};
function keyFor(code){const twoHumans=mode==='1v1'||mode==='coop';
  if(KEYS[code]){const [s,k]=KEYS[code];return twoHumans?[s,k]:[0,k]}
  if(!twoHumans&&SOLO_KEYS[code])return [0,SOLO_KEYS[code]];return null}
function push(slot,k,ev){const b=slots[slot][k];b.q.push(ev);if(b.q.length>6)b.q.shift()}
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  wake();
  if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){if(state==='play')pauseGame();else if(state==='paused')resumeGame();return}
  if(e.repeat||state!=='play')return;const m=keyFor(e.code);if(m)push(m[0],m[1],'d')});
window.addEventListener('keyup',e=>{if(state!=='play')return;const m=keyFor(e.code);if(m)push(m[0],m[1],'u')});

document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});

function canAct(){return (state==='play'||state==='attract')&&!roundOver}
function readHuman(slot){const out={};for(const k of BTN){const b=slots[slot][k];let just=false,rel=false;
    if(!canAct()){b.q.length=0;if(b.down){b.down=false;rel=true}}
    else{const ev=b.q.shift();if(ev==='d'&&!b.down){b.down=true;just=true}else if(ev==='u'&&b.down){b.down=false;rel=true}}
    out[k]={down:b.down,just,rel}}
  return out}
function readPlayer(p,dt){if(isHuman(p))return readHuman(p.ctl.slot);
  if(p.passive){const o={};for(const k of BTN)o[k]={down:false,just:false,rel:false};return o}
  const want=canAct()?aiStep(p,dt):{},out={};
  for(const k of BTN){const d=!!want[k],was=!!p.prev[k];out[k]={down:d,just:d&&!was,rel:!d&&was};p.prev[k]=d}
  return out}

/* ---------- AI: drives the same five buttons as a person; skill comes from a 0..1 rating ---------- */
function rating(){if(state==='attract')return .5;if(mode==='tut')return .25;if(mode==='tour')return TOUR[save.tour.stage].r;return [.15,.5,.85][save.diff]}
function aiStep(p,dt){const A=p.ai,r=rating(),w={},h=ball.holder,hp=targetHoop(p.team),own=ownHoop(p.team);
  // timed button holds
  if(A.sDelay>0){A.sDelay-=dt;if(A.sDelay<=0)A.sHold=Math.max(A.sHold,.9)}
  if(A.sHold>0){A.sHold-=dt;w.S=true;
    if(h===p&&!p.grounded){if(A.dunk&&p.vy>-30)A.sHold=0;else if(A.relV!==null&&p.vy>A.relV)A.sHold=0}
    if(A.sHold<=0)w.S=false}
  if(A.jHold>0){A.jHold-=dt;w.J=true}
  if(A.pHold>0){A.pHold-=dt;w.P=true}
  w.L=A.L;w.R=A.R;
  if(p.tutGuard){A.t-=dt;if(A.t<=0){A.t=.12;A.L=A.R=false;if(h){const tx=h.x+58;if(tx<p.x-12)A.L=true;else if(tx>p.x+12)A.R=true}}return w}
  A.t-=dt;if(A.t>0)return w;
  A.t=lerp(.3,.07,r)+Math.random()*.06;A.L=A.R=false;
  const moveTo=(x,tol)=>{tol=tol||20;if(x<p.x-tol)A.L=true;else if(x>p.x+tol)A.R=true};
  const mates=players.filter(q=>q.team===p.team&&q!==p),opps=players.filter(q=>q.team!==p.team);
  if(Math.abs(p.a)>.9){A.jHold=.1;return w}
  if(h===p){if(A.sHold>0||A.sDelay>0||!p.grounded)return w;
    const d=Math.abs(p.x-hp.cx);let near=1e9;for(const q of opps)near=Math.min(near,Math.abs(q.x-p.x));
    A.hold=(A.hold||0)+.15;A.passCD=(A.passCD||0)-.15;
    if(!mates.length&&p.dashCD<=0&&opps.some(q=>Math.sign(q.x-p.x)===Math.sign(hp.cx-p.x)&&Math.abs(q.x-p.x)<95)&&Math.random()<lerp(.06,.3,r)){
      A.pHold=.08;A.R=hp.cx>p.x;A.L=!A.R;w.L=A.L;w.R=A.R;if(Math.random()<.6)A.drive=true;return w}
    const mate=mates[0],mateOpen=mate&&opps.every(q=>Math.abs(q.x-mate.x)>130);
    if(mate&&mateOpen&&A.passCD<=0&&(near<90||Math.abs(mate.x-hp.cx)<d-120)&&Math.random()<lerp(.15,.5,r)){A.pHold=.08;A.passCD=1.6;A.hold=0;return w}
    if(A.hold>2.2&&d<520){A.sHold=1.2;A.dunk=false;A.relV=rnd(-1,1)*lerp(620,200,r);A.hold=0;return w}
    if(!A.drive&&d<220&&Math.random()<lerp(.05,.32,r))A.drive=true;
    if(A.drive){moveTo(hp.cx-hp.side*28,10);if(d<125){A.jHold=.2;A.sDelay=.14;A.dunk=true;A.relV=-30;A.drive=false}return w}
    if(d<=A.shotD&&(near>95||Math.random()<lerp(.5,.25,r))){A.hold=0;A.sHold=1.2;A.dunk=false;A.relV=rnd(-1,1)*lerp(620,200,r);A.shotD=rnd(160,lerp(470,430,r));return w}
    moveTo(hp.cx-hp.side*A.shotD*.85,30);return w}
  if(h&&h.team===p.team){if(!A.spot||Math.random()<.05)A.spot=hp.cx-hp.side*rnd(180,380);moveTo(A.spot,25);return w}
  if(h){const side=own.cx>h.x?1:-1;moveTo(h.x+side*58,12);
    const dx=Math.abs(h.x-p.x);if(dx>230&&p.dashCD<=0&&Math.random()<.2)A.pHold=.08;
    if(dx<80&&p.swipeCD<=0&&h.grounded&&Math.random()<lerp(.2,.55,r))A.sHold=.12;
    if(!h.grounded&&dx<120&&p.grounded&&Math.random()<lerp(.15,.75,r)){A.jHold=.3}
    return w}
  moveTo(ball.x,10);const above=p.y-ball.y;
  if(Math.abs(ball.x-p.x)<120&&above>130&&above<430&&p.grounded)A.jHold=.3;
  return w}

/* ---------- physics ---------- */
function jumpV(p){return (mod.jump||1)*(fire[p.team]?1.07:1)}
function jump(p,kind){const J=jumpV(p);
  if(Math.abs(p.a)>.85){p.vy=-540*J;p.va=-Math.sign(p.a)*7.5}
  else if(kind==='shot'){p.vy=-SHOT_V*J;p.vx*=.45;p.va+=rnd(-.5,.5)}
  else{p.vy=-JUMP_V*J;p.va+=rnd(-1,1)*(Math.random()<.12?2.5:.9)}
  p.jumpCD=.2;p.grounded=false;p.sq=-.16;sfx('jump')}
function stepPlayer(p,dt,inp){p.inp=inp;
  const g=G*(mod.grav||1),fallen=Math.abs(p.a)>.9,h=ball.holder,act=canAct();
  p.jumpCD-=dt;p.pickCD-=dt;p.buf-=dt;p.swipe-=dt;p.swipeCD-=dt;
  if(h===p)p.f=Math.sign(targetHoop(p.team).cx-p.x)||p.f;else if(!fallen&&Math.abs(ball.x-p.x)>10)p.f=Math.sign(ball.x-p.x);
  p.stun-=dt;p.dash-=dt;p.dashCD-=dt;
  const mv=act&&!(p.stun>0)?(inp.R.down?1:0)-(inp.L.down?1:0):0;
  if(p.grounded&&!fallen){const tv=mv*RUN*(h===p?.88:1),acc=mod.ice?2.2:14;p.vx+=(tv-p.vx)*Math.min(1,dt*acc)}
  else if(!p.grounded&&mv){p.vx=clamp(p.vx+mv*RUN*dt*1.3,-RUN*1.1,RUN*1.1)}
  else if(p.grounded)p.vx*=Math.exp(-dt*(mod.ice?.7:9));
  if(p.dash>0&&p.grounded&&!fallen)p.vx=p.dashDir*RUN*1.75;
  if(inp.J.just)p.buf=.12;
  if(act&&p.buf>0&&p.grounded&&p.jumpCD<=0){jump(p,'jump');p.buf=0}
  if(act&&inp.S.just){if(h===p){p.sArmed=true;if(p.grounded&&p.jumpCD<=0)jump(p,'shot')}else if(p.swipeCD<=0&&!(p.stun>0)){p.swipe=.25;p.swipeCD=.55;p.swipeHit=false}}
  // dash: P without a teammate to pass to; dashing past a defender who is reaching in breaks their ankles
  if(act&&inp.P.just&&!(h===p&&players.some(q=>q.team===p.team&&q!==p))&&p.grounded&&!fallen&&p.dashCD<=0&&!(p.stun>0)){
    const dir=mv||(h===p?Math.sign(targetHoop(p.team).cx-p.x):p.f)||1;p.dash=.26;p.dashDir=dir;p.dashCD=1.1;dust(p.x,FLOOR,6);sfx('dash');
    if(h===p)for(const q of players){if(q.team===p.team||!q.grounded)continue;const dx=q.x-p.x;
      if(Math.sign(dx)===dir&&Math.abs(dx)<115&&Math.random()<(q.swipe>0||(Math.sign(q.vx)===-dir&&Math.abs(q.vx)>120)?.9:.4)){
        const sd=Math.random()<.5?-1:1;q.stun=.75;q.a=sd*1.1;q.va=sd*3;q.vx=-dir*60;hitStop=.06;shake=7;sfx('steal');
        if(state!=='attract')pops.push({text:t('ankles'),small:true,col:'#7fd7ff',team:p.team,t:0,x:q.headx,y:q.heady-30});
        if(mode==='tut'&&TUT_STEPS[tut.i]==='dash')tut.adv=.7}}}
  const up=inp.S.down||p.swipe>0||(!p.grounded&&inp.J.down&&h!==p);
  const tgt=up?.2:Math.PI-.45;p.armV+=((tgt-p.arm)*300-p.armV*25)*dt;p.arm+=p.armV*dt;
  p.vy+=g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  const aT=p.grounded&&!fallen?clamp(p.vx/RUN,-1,1)*.2:0,K=p.grounded?60:9,D=p.grounded?10:1;
  p.va+=(-Math.sin(p.a-aT)*K-p.va*D)*dt;p.a+=p.va*dt;
  if(p.a>Math.PI)p.a-=2*Math.PI;if(p.a<-Math.PI)p.a+=2*Math.PI;
  if(p.y>=FLOOR){if(!p.grounded&&p.vy>380){dust(p.x,FLOOR,6);sfx('land',p.vy/1200);p.sq=Math.min(.28,p.vy/3200)}
    p.y=FLOOR;p.vy=0;p.grounded=true}else p.grounded=false;
  if(p.grounded&&Math.abs(p.a)>1.45){p.a=Math.sign(p.a)*1.45;p.va*=.2}
  if(p.x<36){p.x=36;p.vx=Math.abs(p.vx)*.4}if(p.x>W-36){p.x=W-36;p.vx=-Math.abs(p.vx)*.4}
  p.run+=Math.abs(p.vx)*dt*.045;
  p.sq*=Math.exp(-dt*11);if(p.cheer>0)p.cheer-=dt;if(p.sad>0)p.sad-=dt;
  if(fire[p.team]&&Math.random()<.35)parts.push({x:p.headx+rnd(-10,10),y:p.heady-14*p.s,vx:rnd(-20,20),vy:rnd(-140,-60),life:.45,max:.45,col:Math.random()<.5?'#ffcf3a':'#ff6a1f',sz:rnd(4,8),g:-120})}
function computeHand(p,dt){const s=p.s;p.ux=Math.sin(p.a);p.uy=-Math.cos(p.a);
  p.shx=p.x+p.ux*84*s;p.shy=p.y+p.uy*84*s;const al=p.a+p.f*p.arm;p.dx=Math.sin(al);p.dy=-Math.cos(al);
  const nx=p.shx+p.dx*52*s,ny=p.shy+p.dy*52*s;p.hvx=clamp((nx-p.hx)/dt,-1500,1500);p.hvy=clamp((ny-p.hy)/dt,-1500,1500);p.hx=nx;p.hy=ny;
  p.mx=p.x+p.ux*55*s;p.my=p.y+p.uy*55*s;p.headx=p.x+p.ux*112*s;p.heady=p.y+p.uy*112*s}
function collidePlayers(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
  const a=players[i],b=players[j];let nx=b.mx-a.mx,ny=b.my-a.my;let d=Math.hypot(nx,ny);const min=(a.s+b.s)*23;
  if(d>=min)continue;if(d<.01){nx=1;ny=0;d=.01}else{nx/=d;ny/=d}
  const push=(min-d)/2;a.x-=nx*push;b.x+=nx*push;if(!a.grounded)a.y=Math.min(FLOOR,a.y-ny*push);if(!b.grounded)b.y=Math.min(FLOOR,b.y+ny*push);
  const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){const imp=-vn*.6;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny;a.va-=nx*imp*.012;b.va+=nx*imp*.012}}}
function collideSeg(b,x1,y1,x2,y2,th,e,vx,vy){vx=vx||0;vy=vy||0;const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let tt=l2?((b.x-x1)*dx+(b.y-y1)*dy)/l2:0;tt=clamp(tt,0,1);
  const px=x1+dx*tt,py=y1+dy*tt;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny),min=b.r+th;
  if(d<min&&d>1e-4){nx/=d;ny/=d;b.x=px+nx*min;b.y=py+ny*min;const rvx=b.vx-vx,rvy=b.vy-vy,vn=rvx*nx+rvy*ny;
    if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;b.vx*=.985;return -vn}}return 0}

/* Shot quality: release timing (top of the jump), distance, body tilt, drifting, and how closely a defender contests it. */
const PERFECT_V=110,GOOD_V=260;
function arc(fromX,fromY,tx,ty,Tm){const g=G*(mod.grav||1);return [(tx-fromX)/Tm,((ty-fromY)-.5*g*Tm*Tm)/Tm]}
function shoot(p,rushed){const b=ball,hp=targetHoop(p.team);
  const dist=Math.hypot(hp.cx-b.x,hp.rimY-6-b.y),Tm=clamp(.45+dist/1000,.5,1.2);const [vx,vy]=arc(b.x,b.y,hp.cx,hp.rimY-6,Tm);
  const av=Math.abs(p.vy),perfect=!rushed&&av<PERFECT_V;
  let spread=(.045+Math.min(Math.abs(p.a),1.6)*.16+Math.max(0,dist-150)/2400)*(perfect?.35:av<GOOD_V?.8:1.1)*(rushed?1.5:1);
  const timing=rushed?.06:clamp(p.vy/600,-1,1)*.13;
  let contest=0;for(const q of players){if(q.team===p.team)continue;const d=Math.hypot(q.hx-b.x,q.hy-b.y);if(d<120)contest=Math.max(contest,(120-d)/120*(q.arm<1.2?.2:.1))}
  spread+=contest+Math.abs(p.vx)/2600+Math.abs(timing)*.6;
  if(!isHuman(p))spread*=state==='attract'?1.1:lerp(2,1.05,rating());
  if(fire[p.team])spread*=.6;
  if(scores[p.team]<=scores[1-p.team]-4)spread*=.85;
  const err=(Math.random()*2-1)*spread,sp=1-timing+(Math.random()*2-1)*(spread*.35+.012+dist/11000),c=Math.cos(err),s=Math.sin(err);
  b.vx=(vx*c-vy*s)*sp;b.vy=(vx*s+vy*c)*sp;
  Object.assign(b,{holder:null,ignore:p,ignoreT:.25,shotDist:Math.abs(b.x-hp.cx),shooterTeam:p.team,touchedRim:false,dunk:false,live:true,age:0});p.pickCD=.45;
  if(ms&&state==='play'){ms[p.team].fga++;if(perfect)ms[p.team].perf++}
  if(isHuman(p)&&!perfect&&!rushed&&av>=GOOD_V&&state!=='attract'&&contest<=.08)pops.push({text:p.vy<0?t('early'):t('late'),small:true,col:'#ffd0d4',team:p.team,t:0,x:b.x,y:b.y-34});
  if(contest>.08&&state!=='attract')pops.push({text:t('contested'),small:true,col:'#ffb36b',team:p.team,t:0,x:b.x,y:b.y-34});
  else if(perfect&&state!=='attract'){pops.push({text:t('perfect'),small:true,col:'#5cff8a',team:p.team,t:0,x:b.x,y:b.y-34});sfx('perfect');
    for(let i=0;i<14;i++)parts.push({x:b.x,y:b.y,vx:rnd(-220,220),vy:rnd(-220,120),life:.4,max:.4,col:'#5cff8a',sz:rnd(2,5),g:0});
    if(p.team===0&&counts())stat('perfect')}
  if(!perfect)sfx('shoot')}
function pass(p,to){const b=ball,tx=to.hx+to.vx*.25,ty=to.hy-10,d=Math.hypot(tx-b.x,ty-b.y),Tm=clamp(d/950,.28,.7);const [vx,vy]=arc(b.x,b.y,tx,ty,Tm);
  Object.assign(b,{holder:null,vx:vx*rnd(.97,1.03),vy,ignore:p,ignoreT:.3,live:false,age:9,shooterTeam:p.team});p.pickCD=.4;sfx('shoot')}
function dunk(p,hp){const b=ball;Object.assign(b,{holder:null,x:hp.cx,y:hp.rimY-b.r-6,vx:0,vy:650,dunk:true,shooterTeam:p.team,shotDist:0,touchedRim:true,ignore:p,ignoreT:.4,live:false,age:9});
  if(ms&&state==='play')ms[p.team].fga++;
  p.pickCD=.6;p.vy=Math.min(p.vy,-160);timeScale=.3;shake=18;hitStop=.09;flash=.45;hp.net=1;
  cam.tx=hp.cx;cam.ty=hp.rimY+60;cam.tz=1.16;cam.hold=.75;sfx('dunk');
  for(const [d,c] of [[0,'#fff6e6'],[.12,'#ffcf3a']])parts.push({ring:true,x:hp.cx,y:hp.rimY+8,vx:0,vy:0,g:0,life:.55-d,max:.55-d,col:c,sz:16});buzz(70)}

function stepBall(dt){const b=ball,act=canAct();b.stealCD-=dt;b.ignoreT-=dt;b.age+=dt;b.sq*=Math.exp(-dt*14);
  if(b.holder){const p=b.holder,ip=p.inp;b.trail.length=0;
    if(p.grounded&&!ip.S.down){b.drib+=dt*(7+Math.abs(p.vx)/80);const k=Math.abs(Math.sin(b.drib)),fx=p.x+p.f*24*p.s;
      const ny=lerp(FLOOR-b.r,p.hy+6,k);if(ny>b.y+4&&k<.15&&b.y<FLOOR-b.r-20)sfx('bounce',.25);b.x=fx;b.y=ny;b.vx=p.vx;b.vy=0;b.rot+=dt*4}
    else{b.x=p.hx+p.dx*b.r*.55;b.y=p.hy+p.dy*b.r*.55;b.vx=p.hvx;b.vy=p.hvy;b.rot+=dt*2}
    if(act){const hp=targetHoop(p.team);
      if(ip.S.down&&!p.grounded&&Math.hypot(b.x-hp.cx,b.y-(hp.rimY-18))<62*Math.max(1,p.s)&&b.y<hp.rimY+6){
        const q=players.find(q=>q.team!==p.team&&q.arm<1.25&&Math.hypot(q.hx-b.x,q.hy-b.y)<70*q.s);
        if(q){Object.assign(b,{holder:null,vx:-hp.side*rnd(200,340),vy:-rnd(150,280),live:false,ignore:p,ignoreT:.3});p.pickCD=.5;hitStop=.08;shake=10;sfx('steal');
          if(state!=='attract')pops.push({text:t('block'),small:true,col:'#ff6a8a',team:q.team,t:0,x:b.x,y:b.y-40});if(q.team===0&&counts())stat('block');if(ms&&state==='play')ms[q.team].blk++;if(mode==='tut'&&q.team===0&&TUT_STEPS[tut.i]==='def')tut.adv=.9;return}
        dunk(p,hp);return}
      if(ip.S.rel&&p.sArmed){shoot(p,p.grounded);return}
      const mate=players.find(q=>q.team===p.team&&q!==p);
      if(ip.P.just&&mate){pass(p,mate);return}
      if(b.stealCD<=0)for(const q of players){if(q.team===p.team||q.swipe<=0||q.swipeHit)continue;
        if(Math.hypot(q.hx-b.x,q.hy-b.y)<b.r+26*q.s||Math.hypot(q.hx-p.hx,q.hy-p.hy)<30*q.s){q.swipeHit=true;
          if(Math.random()<(p.grounded?.62:.3)){b.holder=q;q.sArmed=false;b.stealCD=.6;q.pickCD=0;hitStop=.05;shake=6;sfx('steal');
            if(state!=='attract')pops.push({text:'STEAL!',small:true,team:q.team,t:0,x:b.x,y:b.y-40});if(q.team===0&&counts())stat('steal');if(ms&&state==='play')ms[q.team].stl++;if(mode==='tut'&&q.team===0&&TUT_STEPS[tut.i]==='def')tut.adv=.9;break}}}}
    return}
  const g=G*(mod.grav||1),e=mod.bounce||.72;const py=b.y;
  b.vy+=g*dt;b.vx*=1-.04*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx*dt/b.r;
  if(b.y+b.r>FLOOR){b.y=FLOOR-b.r;if(b.vy>70){sfx('bounce',b.vy/900);b.sq=Math.min(.32,b.vy/2600);
      if(b.live){if(b.touchedRim)sfx('ooh');b.live=false}}
    b.vy=-b.vy*e;if(Math.abs(b.vy)<45)b.vy=0;b.vx*=.985}
  if(b.x-b.r<14){b.x=14+b.r;b.vx=Math.abs(b.vx)*.7}if(b.x+b.r>W-14){b.x=W-14-b.r;b.vx=-Math.abs(b.vx)*.7}
  if(b.y-b.r<-320){b.y=-320+b.r;b.vy=Math.abs(b.vy)*.5}
  for(const hp of hoops){let im=collideSeg(b,hp.board,hp.boardTop,hp.board,hp.boardBot,6,.6);if(im>90)sfx('board',im/900);
    im=collideSeg(b,hp.back,hp.rimY,hp.board,hp.rimY,3,.5)+collideSeg(b,hp.front,hp.rimY,hp.front,hp.rimY,5,.55)+collideSeg(b,hp.back,hp.rimY,hp.back,hp.rimY,5,.55);
    if(im>50){sfx('rim');b.touchedRim=true;hp.net=Math.max(hp.net,.35)}}
  if(b.netT>0){b.netT-=dt;b.vx*=Math.exp(-dt*6);b.vy=Math.min(b.vy,260);b.x+=(b.netX-b.x)*Math.min(1,dt*8)}
  else if(act){for(const hp of hoops){const lo=Math.min(hp.front,hp.back),hi=Math.max(hp.front,hp.back);
    if(py<hp.rimY&&b.y>=hp.rimY&&b.vy>0&&b.x>lo+2&&b.x<hi-2){b.netT=.45;b.netX=hp.cx;score(hp);break}}}
  if(b.netT<=0){
    const fresh=b.live&&b.age<.7;
    if(act)for(const p of players){if(p.pickCD>0)continue;const reach=Math.hypot(p.hx-b.x,p.hy-b.y)<b.r+18*p.s;if(!reach)continue;

  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(cam.hold>0)cam.hold-=dt;else{cam.tx=W/2;cam.ty=H/2;cam.tz=1}
  const k=1-Math.exp(-dt*7);cam.x+=(cam.tx-cam.x)*k;cam.y+=(cam.ty-cam.y)*k;cam.z+=(cam.tz-cam.z)*k;
  const z=cam.z,cx=clamp(cam.x,W/(2*z),W-W/(2*z)),cy=clamp(cam.y,H/(2*z),H-H/(2*z));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx,-cy);
  if(shake>0)ctx.translate(rnd(-shake,shake)*.5,rnd(-shake,shake)*.5);
  const skin=state==='attract'?'classic':save.ball;drawArena();drawReflection(skin);for(const hp of hoops)drawHoopBack(hp);
  {const bh=Math.max(0,FLOOR-ball.y);ctx.fillStyle=`rgba(20,8,0,${.3*Math.max(.1,1-bh/500)})`;ctx.beginPath();ctx.ellipse(ball.x,FLOOR+5,ball.r*1.2*Math.max(.35,1-bh/600),5,0,0,7);ctx.fill()}
  for(const p of players)if(p!==ball.holder)drawPlayer(p);
  if(ball.holder)drawPlayer(ball.holder);
  for(let i=0;i<ball.trail.length;i++){const q=ball.trail[i],a=(i+1)/ball.trail.length;ctx.globalAlpha=a*.28;ctx.fillStyle=ball.shooterTeam>=0&&fire[ball.shooterTeam]?'#ff7a1f':'#fff6e6';ctx.beginPath();ctx.arc(q.x,q.y,ball.r*a*.85,0,7);ctx.fill()}
  ctx.globalAlpha=1;drawBall(ctx,ball.x,ball.y,ball.r,ball.rot,skin,ball.sq);
  for(const hp of hoops)drawHoopFront(hp);
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle=q.col;if(q.conf){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillRect(-q.sz/2,-q.sz/4,q.sz,q.sz/2);ctx.restore()}
    else if(q.ring){ctx.strokeStyle=q.col;ctx.lineWidth=7*q.life/q.max;ctx.beginPath();ctx.arc(q.x,q.y,q.sz+(1-q.life/q.max)*150,0,7);ctx.stroke()}
    else if(q.star){const r=q.sz*(.6+.4*Math.sin(q.life*20));ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rad=i%2?r*.3:r;ctx.lineTo(q.x+Math.cos(a)*rad,q.y+Math.sin(a)*rad)}ctx.closePath();ctx.fill()}
    else{ctx.beginPath();ctx.arc(q.x,q.y,q.sz,0,7);ctx.fill()}}
  ctx.globalAlpha=1;
  for(const q of pops)if(q.small){ctx.globalAlpha=1-q.t/.8;txt(q.text,q.x,q.y-q.t*40,26,q.col||'#fff',q.col?'#0d2a16':TEAMS[q.team].dark);ctx.globalAlpha=1}
  drawGuides();
  ctx.restore();ctx.drawImage(vigC,0,0,W,H);
  if(flash>0){ctx.fillStyle=`rgba(255,250,235,${flash})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*2.2)}
  for(const q of pops){if(q.small)continue;
    const kk=q.t<.25?q.t/.25:1,sc=q.t<.25?.4+kk*.8:1.2-Math.min(.2,(q.t-.25)*.3),al=q.t>1.35?1-(q.t-1.35)/.35:1;
    ctx.save();ctx.globalAlpha=Math.max(0,al);ctx.translate(W/2,250);ctx.rotate(-.06);ctx.scale(sc,sc);
    bigTxt(q.text,0,0,q.text.length>8?70:96,TEAMS[q.team].main);txt(q.sub,0,82,q.sub.length>6?40:48,'#fff',OL);ctx.restore()}
  if(banner&&state!=='attract'){const b=banner,al=b.t<.2?b.t/.2:b.t>1.8?Math.max(0,1-(b.t-1.8)/.4):1;ctx.globalAlpha=al;
    ctx.fillStyle='rgba(13,9,32,.82)';ctx.fillRect(0,300,W,b.sub?124:96);txt(b.text,W/2+(1-Math.min(1,b.t*5))*300,348,58,b.col,OL);
    if(b.sub){ctx.font='800 28px "Barlow Condensed", sans-serif';ctx.fillStyle='#fff6e6';ctx.textAlign='center';ctx.fillText(b.sub,W/2,398)}ctx.globalAlpha=1}
  if(state!=='attract')drawHUD()}

/* ---------- flow ---------- */
const $=id=>document.getElementById(id);
const screens=['menu','pause','over','shop','tour'];
function show(id){for(const s of screens)$(s).hidden=s!==id;$('tutSkip').hidden=!(id===null&&state==='play'&&mode==='tut');$('pad').hidden=!(id===null&&state==='play'&&TOUCH);$('pauseBtn').hidden=id!==null||state!=='play';$('topbar').hidden=!(id==='menu'||id==='tour')}
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function teamDef(m){const H0={type:'human',slot:0},H1={type:'human',slot:1};
  if(m==='1v1')return [[H0],[H1]];if(m==='tut')return [[H0],[{type:'cpu'}]];if(m==='coop')return [[H0,H1],[{type:'cpu'},{type:'cpu'}]];if(m==='attract')return [[{type:'cpu'}],[{type:'cpu'}]];return [[H0],[{type:'cpu'}]]}
function startMatch(m){mode=m;setupTeams(teamDef(m));
  TEAMS=[DEF_TEAMS[0],m==='tour'?TOUR[save.tour.stage]:DEF_TEAMS[1]];
  scores=[0,0];mod=MODS[0];banner=null;parts=[];pops=[];matchT=0;streak=[0,0];fire=[false,false];mpShown=[false,false];pendingMP=false;
  for(const p of players)p.hat=isHuman(p)?(p.ctl.slot===0?save.hat:'cap'):HATS[Math.floor(Math.random()*HATS.length)].id;
  if(m==='tour')banner={text:nm(TOUR[save.tour.stage]).toUpperCase(),sub:`${t('stage')} ${save.tour.stage+1}/6`,t:0,col:TOUR[save.tour.stage].main};
  ms=[0,1].map(()=>({fga:0,fgm:0,perf:0,blk:0,stl:0}));lastConceded=null;
  state='play';resetRound();if(m==='tut'){tut={i:0,misses:0,fails:0};tutSetup(0)}buildPad();show(null);CG.gameplayStart()}
let lastEarn=0;
function endMatch(){state='over';CG.gameplayStop();sfx('buzzer');save.tut++;
  let title,earned,sub='';const won=scores[0]>scores[1];
  if(mode==='1v1'){title=won?t('p1'):t('p2');earned=12+Math.floor(Math.max(scores[0],scores[1])/2)}
  else{title=mode==='coop'?(won?t('coopWin'):t('coopLose')):(won?t('win'):t('lose'));earned=(won?25:6)+scores[0];if(won){save.wins++;stat('win')}
    if(mode!=='tour'&&won)earned+=[0,8,20][save.diff];
    if(mode==='tour'){const st=save.tour.stage,o=TOUR[st];
      if(won){earned+=o.prize;if(st===5){save.tour.cups++;save.tour.stage=0;title=t('champ');sub='🏆 '+t('cups')+': '+save.tour.cups}
        else{save.tour.stage++;sub=`${t('stage')} ${st+1}/6 ${t('cleared')}`}}
      else sub=`${t('vs')} ${nm(o)}`}}
  lastEarn=earned;save.coins+=earned;persist();refreshCoins();
  $('overTitle').textContent=title;$('overTitle').style.color=won?'var(--red)':TEAMS[1].main;$('fB').style.color=TEAMS[1].main;
  $('overSub').textContent=sub;$('overSub').hidden=!sub;
  $('fA').textContent=scores[0];$('fB').textContent=scores[1];$('earnTxt').textContent='+'+earned;$('bDouble').hidden=false;$('bDouble').disabled=false;
  $('rematchTxt').textContent=mode==='tour'?(won?t('next'):t('retry')):t('rematch');
  const A=ms[0],B=ms[1],pc=x=>x.fga?Math.round(100*x.fgm/x.fga):0;
  $('overStats').textContent=mode==='1v1'?`${t('statFG')}  ${A.fgm}/${A.fga}  –  ${B.fgm}/${B.fga}`:`${t('statFG')} ${A.fgm}/${A.fga} (${pc(A)}%) · ${t('statPerf')} ${A.perf} · ${t('statBlk')} ${A.blk} · ${t('statStl')} ${A.stl}`;
  $('overTip').textContent=!won&&mode!=='1v1'?`${t('tipLabel')}: ${t('tip'+Math.floor(Math.random()*4))}`:'';$('overTip').hidden=!$('overTip').textContent;
  show('over');setTimeout(()=>sfx('coin'),300)}
function toMenu(){state='attract';mode='attract';setupTeams(teamDef('attract'));TEAMS=[DEF_TEAMS[0],DEF_TEAMS[1]];for(const p of players)p.hat=HATS[(p.num*3)%HATS.length].id;
  scores=[0,0];mod=MODS[0];fire=[false,false];streak=[0,0];resetRound();refreshMenu();show('menu')}
const u=n=>`calc(var(--u)*${n})`;
/* on-screen buttons for touch devices; two-player modes get one cluster per side */
function buildPad(){const pad=$('pad');pad.innerHTML='';if(!TOUCH)return;
  const humans=players.filter(isHuman),duo=humans.length>1;
  for(const p of humans){const slot=p.ctl.slot,x=duo&&slot===1?'right':'left',r=x==='right';
    const mk=(k,label,cls,pos)=>{const b=document.createElement('button');b.className='pb '+cls;b.textContent=label;Object.assign(b.style,pos);
      if(duo)b.style.borderColor=slot?'var(--gold)':TEAMS[0].main;
      b.addEventListener('pointerdown',e=>{e.preventDefault();wake();if(b.classList.contains('on'))return;b.classList.add('on');push(slot,k,'d');try{b.setPointerCapture(e.pointerId)}catch(_){}});
      const up=()=>{if(!b.classList.contains('on'))return;b.classList.remove('on');push(slot,k,'u')};
      b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);pad.append(b)};
    if(!duo){mk('L','◀','mv',{left:u(24),bottom:u(24)});mk('R','▶','mv',{left:u(150),bottom:u(24)});mk('P',t('dashBtn'),'act xs',{right:u(330),bottom:u(36)});
      mk('S',t('shootBtn'),'big',{right:u(24),bottom:u(24)});mk('J',t('jumpBtn'),'act',{right:u(184),bottom:u(24)})}
    else{mk('L','◀','mv sm',{[x]:u(r?118:18),bottom:u(18)});mk('R','▶','mv sm',{[x]:u(r?18:118),bottom:u(18)});
      mk('J',t('jumpBtn'),'act sm',{[x]:u(r?118:18),bottom:u(118)});mk('S',t('shootBtn'),'big sm',{[x]:u(r?18:118),bottom:u(118)});
      mk('P',mode==='coop'?t('passBtn'):t('dashBtn'),'act xs',{[x]:u(218),bottom:u(130)})}}}
function keysHTML(coop){const k=a=>a.map(x=>`<kbd>${x}</kbd>`).join(''),d=coop?t('kPass'):t('kDash');
  return `<span class="kl"><b>${t('solo')} · P1</b>${k(['A','D'])}<i>${t('kMove')}</i>${k(['W'])}<i>${t('kJump')}</i>${k(['F'])}<i>${t('kShoot')}</i>${k(['G'])}<i>${d}</i></span>`+
    `<span class="kl"><b>P2</b>${k(['←','→'])}<i>${t('kMove')}</i>${k(['↑'])}<i>${t('kJump')}</i>${k(['K'])}<i>${t('kShoot')}</i>${k(['L'])}<i>${d}</i></span>`}
/* ---------- interactive tutorial: six short goals, each checked in play ---------- */
const TUT_STEPS=['move','grab','shoot','dunk','dash','def'];
let tut=null;
function tutSetup(i,keep){const prev=tut||{};tut={i,t:0,dist:0,free:0,adv:0,next:false,failed:false,misses:keep?prev.misses:0,fails:keep?prev.fails:0,msg:prev.msg,end:0};
  mod=MODS[0];resetRound();const P=players[0],C=players[1],hp=targetHoop(0),id=TUT_STEPS[i];
  C.passive=true;C.tutGuard=false;
  const give=(p,x)=>{p.x=x;Object.assign(ball,{holder:p,vx:0,vy:0,stealCD:.6,drib:0});p.sArmed=false;p.f=p.team===0?1:-1};
  if(id==='move'){C.x=W-60;give(C,W-60)}
  else if(id==='grab'){P.x=380;C.x=W-60;Object.assign(ball,{holder:null,x:760,y:FLOOR-ball.r,vx:0,vy:0,live:false})}
  else if(id==='shoot'){C.x=60;give(P,hp.cx-300)}
  else if(id==='dunk'){C.x=60;give(P,hp.cx-340)}
  else if(id==='dash'){C.passive=false;C.tutGuard=true;C.x=hp.cx-390;give(P,hp.cx-560)}
  else if(id==='def'){P.x=ownHoop(0).cx+250;C.passive=false;give(C,W/2+140)}
  for(const p of players){computeHand(p,STEP);p.hvx=p.hvy=0}}
function tutNext(){if(tut.i+1>=TUT_STEPS.length){tut.i=TUT_STEPS.length;tut.end=2.6;sfx('mp');players[1].passive=true;return}tutSetup(tut.i+1);sfx('coin')}
function tutOnScore(tm,b){const id=TUT_STEPS[tut.i];
  if(tm===0&&(id!=='dunk'||b.dunk)&&id!=='def')tut.next=true;if(id==='def')tm===0?tut.next=true:tut.failed=true}
function tutAfterRound(){if(tut.i>=TUT_STEPS.length){resetRound();return}
  if(tut.next){tut.next=false;tutNext();return}
  if(tut.failed){tut.fails++;if(tut.fails>=2){tut.msg=true;tutNext();return}}
  tutSetup(tut.i,true)}
function tutUpdate(dt){if(!tut||state!=='play')return;tut.t+=dt;
  if(tut.i>=TUT_STEPS.length){tut.end-=dt;if(tut.end<=0)finishTut();return}
  if(tut.adv>0){tut.adv-=dt;if(tut.adv<=0)tutNext();return}
  if(roundOver)return;const P=players[0],C=players[1],id=TUT_STEPS[tut.i];
  if(id==='move'){tut.dist+=Math.abs(P.vx)*dt;if(tut.dist>240)tut.adv=.3}
  else if(id==='grab'){if(ball.holder===P)tut.adv=.4}
  else if(id==='dash'){if(ball.holder===P&&P.x>C.x+50)tut.adv=.5}
  else if(id==='def'){if(ball.holder===P)tut.adv=.6}
  if(id==='shoot'||id==='dunk'||id==='dash'){if(ball.holder===P)tut.free=0;else{tut.free+=dt;if(tut.free>2.3){tut.misses++;tutSetup(tut.i,true)}}}}
function finishTut(){save.tutDone=true;persist();CG.gameplayStop();startMatch('tour')}
function pauseGame(){if(state!=='play')return;state='paused';CG.gameplayStop();
  $('pauseKeys').innerHTML=TOUCH?'':keysHTML(mode==='coop');$('pauseHelp').innerHTML=['shotHelp','dashHelp','defHelp'].map(k=>`<span>${t(k)}</span>`).join('');show('pause')}
function resumeGame(){state='play';show(null);CG.gameplayStart();for(const s of slots)for(const k of BTN){s[k].q.length=0;if(s[k].down)s[k].q.push('u')}for(const b of document.querySelectorAll('.pb.on'))b.classList.remove('on')}

function refreshCoins(){for(const el of document.querySelectorAll('.coinTxt'))el.textContent=save.coins}
function refreshMenu(){$('tourProg').textContent=save.tutDone?`${t('stage')} ${save.tour.stage+1}/6 · ${nm(TOUR[save.tour.stage])}`:t('tutorial');
  $('cupProg').textContent=`${save.tour.stage+1}/6${save.tour.cups?' · 🏆'+save.tour.cups:''}`;$('keys').innerHTML=TOUCH?'':keysHTML(false);
  const afford=HATS.some(it=>!save.hats.includes(it.id)&&it.p<=save.coins)||BALLS.some(it=>!save.balls.includes(it.id)&&it.p<=save.coins);
  $('shopNew').textContent=afford?t('newItem'):'';renderChal()}
function applyLang(){for(const el of document.querySelectorAll('[data-t]'))el.textContent=t(el.dataset.t);$('bLang').textContent=save.lang.toUpperCase();
  $('bSnd').textContent=save.snd?'♪ ON':'♪ OFF';for(let i=0;i<3;i++)$('d'+i).setAttribute('aria-pressed',String(save.diff===i));document.documentElement.lang=save.lang;refreshMenu()}
let toastT=0;function toast(s,coin){const el=$('toast');el.innerHTML=(coin?'<span class="coin"></span>':'')+'<span></span>';el.lastChild.textContent=s;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,1800)}

function buildLadder(){const l=$('ladder');l.innerHTML='';const st=save.tour.stage;
  $('tourSub').textContent=`${t('cups')}: ${save.tour.cups}`;
  TOUR.forEach((o,i)=>{const d=document.createElement('div');d.className='rung '+(i<st?'beat':i===st?'next':'lock');
    d.innerHTML=`<span class="i">${i+1}</span><span class="sw" style="background:${o.main}"></span><span class="tn"></span><span class="st"></span>`;
    d.querySelector('.tn').textContent=nm(o);
    d.querySelector('.st').innerHTML=i<st?'✓ '+t('beaten'):`<span class="coin"></span>${o.prize}`;l.append(d)})}

let shopTab='hats';
function buildShop(){const g=$('grid');g.innerHTML='';const list=shopTab==='hats'?HATS:BALLS,owned=save[shopTab],cur=shopTab==='hats'?save.hat:save.ball;
  $('tHats').setAttribute('aria-pressed',String(shopTab==='hats'));$('tBalls').setAttribute('aria-pressed',String(shopTab==='balls'));
  for(const it of list){const d=document.createElement('div');d.className='item'+(cur===it.id?' on':'');
    const c=document.createElement('canvas');c.width=300;c.height=200;const x=c.getContext('2d');x.scale(2,2);
    if(shopTab==='hats'){x.fillStyle='rgba(255,246,230,.06)';x.beginPath();x.arc(75,58,40,0,7);x.fill();drawHat(x,it.id,75,62,26,1,'back');x.fillStyle=SKINS[0];x.beginPath();x.arc(75,62,26,0,7);x.fill();
      x.fillStyle='#fff';x.beginPath();x.arc(72,58,6,0,7);x.arc(86,58,6,0,7);x.fill();x.fillStyle='#1a1030';x.beginPath();x.arc(74,58,3,0,7);x.arc(88,58,3,0,7);x.fill();drawHat(x,it.id,75,62,26,1,'front')}
    else drawBall(x,75,52,32,.5,it.id,0);
    const n=document.createElement('div');n.className='nm';n.textContent=nm(it);
    const b=document.createElement('button');
    if(owned.includes(it.id)){b.className='eq';b.textContent=cur===it.id?t('equipped'):t('equip');b.disabled=cur===it.id;
      b.onclick=()=>{sfx('click');if(shopTab==='hats')save.hat=it.id;else save.ball=it.id;persist();buildShop()}}
    else{b.className='buy';b.innerHTML='<span class="coin"></span>'+it.p;if(save.coins<it.p)b.setAttribute('aria-disabled','true');
      b.onclick=()=>{if(save.coins<it.p){toast(t('nocoins'));return}save.coins-=it.p;owned.push(it.id);if(shopTab==='hats')save.hat=it.id;else save.ball=it.id;persist();refreshCoins();sfx('coin');toast(t('bought'));buildShop()}}
    d.append(c,n,b);g.append(d)}}

function bind(){
  const click=fn=>()=>{wake();sfx('click');fn()};
  $('bTour').onclick=click(()=>startMatch(save.tutDone?'tour':'tut'));$('bCup').onclick=click(()=>{buildLadder();show('tour')});$('bHow').onclick=click(()=>startMatch('tut'));$('tutSkip').onclick=click(finishTut);$('bTourGo').onclick=click(()=>startMatch('tour'));$('bTourBack').onclick=click(()=>{refreshMenu();show('menu')});
  $('bCpu').onclick=click(()=>startMatch('solo'));$('b1v1').onclick=click(()=>startMatch('1v1'));$('bCoop').onclick=click(()=>startMatch('coop'));
  $('bShop').onclick=click(()=>{buildShop();show('shop')});$('bBack').onclick=click(()=>{refreshMenu();show('menu')});
  $('tHats').onclick=click(()=>{shopTab='hats';buildShop()});$('tBalls').onclick=click(()=>{shopTab='balls';buildShop()});
  for(let i=0;i<3;i++)$('d'+i).onclick=click(()=>{save.diff=i;persist();applyLang()});
  $('bLang').onclick=click(()=>{save.lang=save.lang==='pt'?'en':'pt';persist();applyLang()});
  $('bSnd').onclick=()=>{save.snd=!save.snd;persist();applyLang();wake();sfx('click')};
  $('pauseBtn').onclick=click(pauseGame);$('bResume').onclick=click(resumeGame);$('bQuit').onclick=click(toMenu);
  $('bRematch').onclick=click(()=>CG.ad('midgame',()=>startMatch(mode)));
  $('bMenu').onclick=click(()=>CG.ad('midgame',toMenu));
  $('bDouble').onclick=click(()=>{$('bDouble').disabled=true;CG.ad('rewarded',()=>{},()=>{save.coins+=lastEarn;persist();refreshCoins();$('earnTxt').textContent='+'+lastEarn*2;$('bDouble').hidden=true;sfx('coin');toast(t('doubled'),true)})})}

let last=performance.now(),acc=0;
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;
  if(amb&&AC){const lvl=!save.snd?0:state==='play'?.035+hype*.09:state==='attract'?.012:.008;amb.gain.setTargetAtTime(lvl,AC.currentTime,.3)}
  if(hitStop>0)hitStop-=dt;
  else if(state!=='paused'&&state!=='over'){timeScale=Math.min(1,timeScale+dt*1.4);acc+=dt*timeScale;let n=0;while(acc>=STEP&&n<12){update(STEP);acc-=STEP;n++}}
  render(dt);requestAnimationFrame(frame)}

window.__wd={sim(sec){for(let i=0;i<sec/STEP;i++)update(STEP)},get scores(){return scores.slice()},get state(){return state},start:startMatch,
  players(){return players.map(p=>({x:p.x,y:p.y,team:p.team}))},ball(){return {x:ball.x,y:ball.y}},stats(){return {held:ball.holder?ball.holder.team:-1,fire:fire.slice(),save:JSON.parse(JSON.stringify(save))}}};

(async function boot(){await CG.init();CG.loadingStart();loadSave();const bonus=daily();resize();applyLang();refreshCoins();bind();toMenu();
  try{await Promise.race([document.fonts.load('40px "Bowlby One"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
  buildBg();CG.loadingStop();requestAnimationFrame(frame);
  if(bonus)setTimeout(()=>toast(`${t('daily')} · ${t('day')} ${save.streak} · +${bonus}`,true),700)})();
})();
