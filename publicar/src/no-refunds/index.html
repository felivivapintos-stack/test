<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NO REFUNDS</title>
<meta name="description" content="A satirical scam call-center sim. Build your script deck, read your marks, hit quota — and live with it.">
<style>
:root {
  --bg: #0d3b3e;
  --bg2: #082426;
  --win: #e7e3d8;
  --win-dark: #c9c3b3;
  --ink: #1c1b18;
  --ink-soft: #5b574d;
  --title: #1f4e79;
  --title2: #2f6fab;
  --accent: #ffcc33;
  --good: #2e8b3a;
  --bad: #c0392b;
  --warn: #d68910;
  --trust: #2f9e5a;
  --susp: #d0462f;
  --pat: #3b7dd8;
  --mono: 'Consolas', 'Courier New', monospace;
  --ui: 'Tahoma', 'Segoe UI', 'Verdana', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg2); color: var(--ink); font: 13px var(--ui); }
button { font: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------- desktop */
#desktop { position: fixed; inset: 0; }
#wallpaper {
  position: absolute; inset: 0 0 36px 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 40%, #17666b 0%, var(--bg) 45%, var(--bg2) 100%);
}
#wallpaper::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px); pointer-events: none; }
.wp-logo { font: 900 54px/0.95 'Impact', 'Arial Black', sans-serif; color: rgba(255,255,255,.08); text-align: center; letter-spacing: 2px; }
.wp-sub { color: rgba(255,255,255,.12); font-style: italic; margin-top: 8px; }

#icons { position: absolute; top: 10px; left: 10px; bottom: 46px; display: flex; flex-direction: column; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
.icon { width: 78px; padding: 6px 2px; text-align: center; color: #fff; border: 1px solid transparent; border-radius: 3px; background: none; text-shadow: 1px 1px 2px #000; position: relative; }
.icon:hover, .icon:focus { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); outline: none; }
.icon .ic { font-size: 30px; display: block; line-height: 1.2; }
.icon .badge { position: absolute; top: 2px; right: 10px; background: var(--bad); color: #fff; border-radius: 9px; font-size: 10px; padding: 1px 5px; text-shadow: none; }

/* ---------------------------------------------------------- taskbar */
#taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: var(--win); border-top: 2px solid #fff; display: flex; align-items: center; gap: 4px; padding: 0 4px; z-index: 9000; }
#start-btn { font-weight: bold; padding: 4px 10px; height: 28px; }
#tasks { flex: 1; display: flex; gap: 3px; overflow: hidden; }
#tasks button { max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 28px; padding: 0 8px; }
#tasks button.active { background: var(--win-dark); box-shadow: inset 1px 1px 2px rgba(0,0,0,.4); }
#tray { display: flex; gap: 8px; align-items: center; padding: 0 6px; height: 28px; box-shadow: inset 1px 1px 2px rgba(0,0,0,.3); background: var(--win-dark); }
.tray-item { white-space: nowrap; font-size: 12px; display: flex; align-items: center; gap: 4px; }
button.tray-item { background: none; border: none; padding: 0; font-size: 14px; }
.qbar, .hbar { width: 70px; height: 10px; background: #fff; border: 1px solid #777; position: relative; }
#qfill { height: 100%; background: var(--good); width: 0; transition: width .4s; }
#hfill { height: 100%; background: linear-gradient(90deg, #f5b041, var(--bad)); width: 0; transition: width .4s; }
.hbar { width: 50px; }
#tray-cash { font-weight: bold; color: #145a32; }
button, .btn { background: var(--win); border: 1px solid; border-color: #fff #555 #555 #fff; padding: 3px 10px; color: var(--ink); border-radius: 0; }
button:active:not(:disabled) { border-color: #555 #fff #fff #555; }
button:disabled { color: #999; cursor: default; }
button.primary { background: var(--accent); font-weight: bold; }
button.danger { background: #f1b3aa; }

#start-menu { position: absolute; bottom: 36px; left: 0; width: 230px; background: var(--win); border: 2px solid; border-color: #fff #555 #555 #fff; z-index: 9500; display: flex; }
#start-menu .side { background: linear-gradient(0deg, var(--title), var(--title2)); color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); font: bold 18px var(--ui); padding: 8px 4px; }
#start-menu .items { flex: 1; display: flex; flex-direction: column; }
#start-menu .items button { border: none; text-align: left; padding: 7px 10px; background: none; }
#start-menu .items button:hover { background: var(--title); color: #fff; }
#start-menu hr { border: none; border-top: 1px solid #999; margin: 2px 4px; }

/* ---------------------------------------------------------- windows */
.window { position: absolute; background: var(--win); border: 2px solid; border-color: #fff #444 #444 #fff; box-shadow: 3px 3px 12px rgba(0,0,0,.45); display: flex; flex-direction: column; min-width: 240px; min-height: 120px; }
.window.inactive .titlebar { background: linear-gradient(90deg, #7d7d7d, #a9a9a9); }
.titlebar { background: linear-gradient(90deg, var(--title), var(--title2)); color: #fff; padding: 3px 4px 3px 8px; display: flex; align-items: center; gap: 6px; cursor: move; user-select: none; font-weight: bold; touch-action: none; }
.titlebar .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.titlebar button { width: 22px; height: 20px; padding: 0; line-height: 1; font-size: 12px; }
.wbody { flex: 1; overflow: auto; padding: 8px; position: relative; }
.window.max { left: 0 !important; top: 0 !important; width: 100% !important; height: calc(100% - 36px) !important; }
.resize { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, #888 50% 60%, transparent 60% 70%, #888 70% 80%, transparent 80%); }
.window.shake { animation: shake .35s; }
@keyframes shake { 0%,100% { transform: translate(0); } 25% { transform: translate(-6px, 2px); } 75% { transform: translate(6px, -2px); } }

.panel { background: #fff; border: 1px solid; border-color: #777 #fff #fff #777; padding: 6px; }
.muted { color: var(--ink-soft); }
.row { display: flex; gap: 6px; align-items: center; }
.grow { flex: 1; }
h3 { margin: 0 0 6px; font-size: 14px; }
input[type=text], input[type=password], select, textarea { font: inherit; border: 1px solid; border-color: #777 #fff #fff #777; padding: 4px 6px; background: #fff; color: var(--ink); }
.mono { font-family: var(--mono); }
table.list { width: 100%; border-collapse: collapse; background: #fff; }
table.list th, table.list td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #e3dfd3; vertical-align: top; }
table.list th { background: var(--win-dark); position: sticky; top: 0; }
table.list tr:hover td { background: #fffbe6; }
.tag { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 11px; background: #ddd; margin: 1px; }
.tag.k { background: #d6eaf8; }
.tag.q { background: #eee; color: #888; }
.tag.good { background: #d5f5e3; }
.tag.bad { background: #fadbd8; }

/* ---------------------------------------------------------- phone app */
.phone { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr auto; gap: 8px; height: 100%; }
.vpanel { grid-row: 1 / 3; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.vname { font-size: 16px; font-weight: bold; }
.meter { font-size: 11px; }
.meter .bar { height: 12px; background: #eee; border: 1px solid #999; position: relative; margin-top: 2px; }
.meter .bar > div { height: 100%; transition: width .35s; }
.meter .bar .need { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #000; }
.pips { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
.pips span { width: 10px; height: 10px; border-radius: 50%; background: var(--pat); }
.pips span.off { background: #ccc; }
.stages { display: flex; flex-direction: column; gap: 2px; }
.stages div { padding: 2px 6px; font-size: 12px; border-left: 3px solid #ccc; }
.stages .done { border-color: var(--good); color: var(--good); }
.stages .cur { border-color: var(--accent); background: #fff6d5; font-weight: bold; }
.transcript { overflow-y: auto; background: #fbfaf6; display: flex; flex-direction: column; gap: 6px; padding: 8px; min-height: 120px; }
.msg { max-width: 82%; padding: 6px 9px; border-radius: 10px; line-height: 1.35; animation: pop .2s; }
@keyframes pop { from { transform: scale(.94); } }
.msg.you { align-self: flex-end; background: #d6eaf8; border-bottom-right-radius: 2px; }
.msg.them { align-self: flex-start; background: #fff; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
.msg.them.great { border-color: var(--good); }
.msg.them.bad { border-color: var(--bad); }
.msg.them.code { font-family: var(--mono); background: #fffbe6; border-color: var(--warn); user-select: all; }
.msg.them.tell.radar { box-shadow: 0 0 0 2px #f0f inset; }
.msg.sys { align-self: center; font-size: 11px; color: var(--ink-soft); font-style: italic; text-align: center; max-width: 95%; }
.msg .tagline { display: block; font-size: 10px; color: var(--ink-soft); margin-bottom: 2px; }
.fx { align-self: center; font-size: 11px; font-weight: bold; }
.fx .p { color: var(--trust); } .fx .n { color: var(--susp); } .fx .c { color: #8e44ad; }
.controls { display: flex; flex-direction: column; gap: 6px; }
.hand { display: flex; gap: 6px; flex-wrap: wrap; }
.card { width: 104px; min-height: 120px; background: #fff; border: 2px solid #333; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; box-shadow: 2px 3px 0 #333; transition: transform .12s; position: relative; }
.card:hover:not(:disabled) { transform: translateY(-6px) rotate(-1deg); }
.card .ci { font-size: 26px; }
.card .cn { font-weight: bold; font-size: 12px; }
.card .cd { font-size: 10px; color: var(--ink-soft); }
.card .cm { position: absolute; top: 3px; right: 5px; font-size: 11px; font-weight: bold; }
.card .cm.up { color: var(--good); } .card .cm.down { color: var(--bad); }
.card.special { border-color: #8e44ad; box-shadow: 2px 3px 0 #8e44ad; background: #fbf4ff; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ask-btn { font-weight: bold; background: var(--accent); padding: 6px 12px; }
.say { display: flex; gap: 4px; }
.say input { flex: 1; }
.mic.on { background: var(--bad); color: #fff; }
.store-bar { height: 14px; background: #eee; border: 1px solid #999; }
.store-bar div { height: 100%; background: var(--pat); width: 0; transition: width .2s linear; }

.leadcard { display: flex; gap: 8px; align-items: center; padding: 6px; background: #fff; border: 1px solid #ccc; margin-bottom: 6px; }
.leadcard .av { font-size: 30px; }
.leadcard.story { border-color: #8e44ad; background: #fbf4ff; }

/* ---------------------------------------------------------- overlay */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 9950; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--win); border: 2px solid; border-color: #fff #444 #444 #fff; max-width: 640px; width: 100%; max-height: 92vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.modal .titlebar { cursor: default; }
.modal .mb { padding: 14px; }
.big { font-size: 28px; font-weight: 900; }
.grade { font: 900 64px 'Impact', sans-serif; text-align: center; }
.grade.S { color: #b7950b; } .grade.A { color: var(--good); } .grade.B { color: var(--title); } .grade.C { color: var(--warn); } .grade.F { color: var(--bad); }
.quote { font-style: italic; border-left: 3px solid var(--accent); padding: 4px 8px; margin: 4px 0; background: #fff; }
.quote.worst { border-color: var(--bad); }

#toasts { position: absolute; right: 10px; bottom: 46px; display: flex; flex-direction: column; gap: 6px; z-index: 9600; pointer-events: none; }
.toast { background: #222; color: #fff; padding: 8px 12px; border-left: 4px solid var(--accent); max-width: 320px; animation: slidein .25s; box-shadow: 2px 2px 8px rgba(0,0,0,.5); }
.toast.good { border-color: #2ecc71; } .toast.bad { border-color: #e74c3c; } .toast.warn { border-color: #f39c12; }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }

/* ---------------------------------------------------------- boot / title */
#boot { position: fixed; inset: 0; z-index: 9900; background: #050c0d; color: #d5f5e3; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 16px; text-align: center; }
#boot .logo { font: 900 clamp(48px, 12vw, 120px)/0.9 'Impact', 'Arial Black', sans-serif; color: var(--accent); letter-spacing: 2px; text-shadow: 4px 4px 0 var(--bad), 8px 8px 0 #000; transform: rotate(-3deg); }
#boot .stamp { display: inline-block; border: 4px solid var(--bad); color: var(--bad); font: 900 20px 'Impact', sans-serif; padding: 2px 12px; transform: rotate(6deg); margin-top: 6px; }
#boot .sub { margin: 18px 0; color: #8fbfa8; max-width: 520px; }
#boot .menu { display: flex; flex-direction: column; gap: 8px; min-width: 240px; }
#boot .menu button { font-size: 16px; padding: 8px 16px; }
#boot .tip { margin-top: 24px; max-width: 520px; color: #6c9; font-size: 12px; }
#boot .fine { position: absolute; bottom: 10px; font-size: 11px; color: #4a6; }

/* ---------------------------------------------------------- misc apps */
.mail { display: grid; grid-template-columns: 200px 1fr; height: 100%; gap: 6px; }
.mail .lst { overflow: auto; background: #fff; border: 1px solid #aaa; }
.mail .lst div { padding: 6px; border-bottom: 1px solid #eee; cursor: pointer; }
.mail .lst div.unread { font-weight: bold; }
.mail .lst div.sel { background: var(--title); color: #fff; }
.mail .view { overflow: auto; background: #fff; border: 1px solid #aaa; padding: 10px; white-space: pre-wrap; line-height: 1.45; }
.news article { background: #fff; padding: 10px; border-bottom: 1px solid #ddd; }
.news h4 { margin: 0 0 4px; font: bold 16px Georgia, serif; }
.news .meta { font-size: 11px; color: #888; }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.shopitem { background: #fff; border: 1px solid #bbb; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.shopitem .si { font-size: 26px; }
.shopitem.owned { opacity: .55; }
.tabs { display: flex; gap: 2px; margin-bottom: 6px; }
.tabs button.on { background: #fff; border-bottom-color: #fff; font-weight: bold; }
.slots { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
.slots div { width: 70px; height: 80px; background: #fff; border: 3px solid #333; font-size: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
.remote { background: #1e5f99; color: #fff; height: 100%; display: flex; flex-direction: column; font-family: var(--mono); }
.remote .scr { flex: 1; padding: 10px; overflow: auto; }
.cmd { background: #000; color: #c0c0c0; font-family: var(--mono); padding: 8px; white-space: pre-wrap; height: 100%; overflow: auto; font-size: 12px; }
.bankpage { background: #fff; color: #222; font-family: var(--ui); padding: 12px; border-radius: 4px; }
.virus-pop { position: absolute; width: 230px; background: var(--win); border: 2px solid; border-color: #fff #444 #444 #fff; z-index: 9700; box-shadow: 3px 3px 10px rgba(0,0,0,.5); }
.virus-pop .titlebar { background: linear-gradient(90deg, #8b0000, #e74c3c); cursor: default; }
.virus-pop .vb { padding: 10px; text-align: center; }
.raid { position: fixed; inset: 0; z-index: 9850; background: rgba(120,0,0,.35); animation: siren .5s infinite alternate; }
@keyframes siren { from { background: rgba(160,0,0,.35); } to { background: rgba(0,40,160,.35); } }
.raid .ev { position: absolute; font-size: 38px; background: none; border: none; filter: drop-shadow(2px 2px 2px #000); animation: wob .6s infinite alternate; }
@keyframes wob { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
.raid .hud { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #000; color: #fff; padding: 10px 18px; font: bold 18px var(--ui); text-align: center; }
.ending { text-align: center; }
.ending .big { font-size: 40px; }
.kbd { font-family: var(--mono); background: #eee; border: 1px solid #aaa; padding: 0 4px; }

@media (max-width: 760px) {
  .phone { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  .vpanel { grid-row: auto; max-height: 160px; }
  .card { width: 30%; min-height: 96px; }
  .card .cd { display: none; }
  #tray .quota .qbar, #tray-day { display: none; }
  .mail { grid-template-columns: 1fr; grid-template-rows: 140px 1fr; }
  .wp-logo { font-size: 32px; }
  #icons { flex-direction: row; right: 10px; bottom: auto; }
  .icon { width: 70px; }
}

/* ---------------------------------------------------------- party */
#boot { overflow-y: auto; }
.victim-wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; text-align: left; padding-block: 10px; }
.victim-sheet { background: var(--win); color: var(--ink); padding: 14px; border: 2px solid; border-color: #fff #444 #444 #fff; transition: filter .2s; }
.victim-sheet.blur { filter: blur(12px); }
.victim-sheet h2 { margin: 8px 0 0; }
.victim-sheet h3 { margin: 12px 0 4px; }
.victim-sheet .role { font: 900 22px 'Impact', 'Arial Black', sans-serif; padding: 6px 10px; color: #fff; text-align: center; letter-spacing: 1px; }
.victim-sheet .role.real { background: var(--good); }
.victim-sheet .role.baiter { background: var(--bad); }
.victim-sheet .trait { background: #fff; border-left: 4px solid var(--title); padding: 6px 8px; margin-bottom: 6px; }
.victim-sheet .objective { background: #fff6d5; border: 2px dashed var(--warn); padding: 8px; font-weight: bold; }
.victim-sheet .cards { display: grid; gap: 6px; }
.victim-sheet .gcard { display: flex; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid #bbb; padding: 8px; flex-wrap: wrap; }
.victim-sheet .gcard b { font-size: 16px; letter-spacing: 1px; }
.victim-wrap .row b { color: #d5f5e3; }

.party-call { display: flex; flex-direction: column; gap: 6px; height: 100%; }
.party-call .phone { flex: 1; min-height: 0; }
.partybar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #fff; border: 1px solid #bbb; padding: 6px; }
.partybar .cue { display: flex; align-items: center; gap: 8px; font: 900 20px 'Impact', 'Arial Black', sans-serif; letter-spacing: 1px; padding: 4px 12px; border-radius: 4px; color: #fff; animation: pop .25s; }
.partybar .cue small { font: 12px var(--ui); letter-spacing: 0; opacity: .9; }
.partybar .cue .ci { font-size: 26px; }
.partybar .cue.good { background: var(--good); } .partybar .cue.ok { background: var(--title); } .partybar .cue.bad { background: var(--bad); }
.ptimer { font: bold 18px var(--mono); margin-left: auto; padding: 2px 8px; }
.ptimer.low { color: var(--bad); animation: shake .5s infinite; }
.ptimer.pay { color: #1565c0; }
.partybar .prow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; width: 100%; font-size: 12px; }
.ptoken { background: #fde9e7; }
.pchaos { background: #efe6fb; }
.preds button.on { background: var(--accent); font-weight: bold; }
.party-code { font: 900 44px var(--mono); letter-spacing: 8px; margin: 8px 0; }
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin: 10px 0; text-align: left; }
.award { display: flex; gap: 8px; align-items: center; background: #fff; border: 1px solid #ccc; padding: 6px; }
.award .ai { font-size: 28px; }
.victim-sheet table.cues { border-collapse: collapse; width: 100%; background: #fff; font-size: 12px; }
.victim-sheet table.cues td { padding: 3px 6px; border-bottom: 1px solid #eee; }
.pwarn { background: #fff3cd; border: 1px solid var(--warn); padding: 2px 8px; font-size: 12px; font-weight: bold; }

.lobby-code { display: flex; flex-direction: column; align-items: center; background: #fff; border: 2px dashed var(--title); padding: 8px; margin: 6px 0; }
.lobby-code b { font: 900 48px var(--mono); letter-spacing: 10px; }
.role-pill { display: inline-block; padding: 4px 10px; font-weight: bold; color: #fff; margin: 4px 0 8px; border-radius: 3px; }
.role-pill.caller { background: var(--title); } .role-pill.victim { background: var(--bad); } .role-pill.spec { background: #6c5ce7; }
button.big { display: inline-flex; flex-direction: column; align-items: flex-start; padding: 8px 12px; font-size: 14px; font-weight: bold; text-align: left; }
button.big small { font-weight: normal; font-size: 11px; opacity: .85; }
.watch-meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
.watch-meters .muted { grid-column: 1 / -1; font-size: 12px; }
.victim-sheet.compact { padding: 8px; }

.meter .bar .redline { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--bad); }
.meter.danger .row span { color: var(--bad); font-weight: bold; }
.meter.danger .bar { animation: shake .6s infinite; }
.coach { display: flex; gap: 8px; align-items: center; background: #fff6d5; border: 2px solid var(--accent); padding: 6px 8px; font-size: 12px; line-height: 1.35; animation: pop .25s; }
.coach span { flex: 1; }
.coach button { flex: none; }
.vav { font-size: 34px; }
@media (max-width: 760px) {

<script>
// Shared helpers. Everything hangs off the global NR namespace so the game
// runs from file:// without a build step or a module loader.
window.NR = window.NR || {};
(function (NR) {
  'use strict';

  // Seeded PRNG (mulberry32) so daily challenges are reproducible.
  let seed = (Date.now() ^ 0x9e3779b9) >>> 0;
  NR.seed = function (s) { seed = (s >>> 0) || 1; };
  NR.rand = function () {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  NR.ri = (a, b) => a + Math.floor(NR.rand() * (b - a + 1));
  NR.pick = (arr) => arr[Math.floor(NR.rand() * arr.length)];
  NR.chance = (p) => NR.rand() < p;
  NR.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  NR.shuffle = function (arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(NR.rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };
  NR.money = (n) => '$' + Math.round(n).toLocaleString('en-US');
  NR.uid = (() => { let i = 0; return (p = 'id') => p + (++i); })();

  // Replace {key} placeholders from an object; unknown keys are left as-is.
  NR.fill = function (text, ctx) {
    return text.replace(/\{(\w+)\}/g, (m, k) => (ctx && ctx[k] != null ? ctx[k] : m));
  };

  NR.hashStr = function (str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };

  // Tiny DOM builder: el('div.cls#id', {attrs}, children...)
  NR.el = function (spec, attrs, ...kids) {
    const m = spec.match(/^([a-z0-9]+)?((?:[.#][\w-]+)*)$/i);
    const node = document.createElement((m && m[1]) || 'div');
    if (m && m[2]) {
      m[2].replace(/([.#])([\w-]+)/g, (_, t, v) => { if (t === '.') node.classList.add(v); else node.id = v; });
    }
    if (attrs != null && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else if (k === 'html') node.innerHTML = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return node;
  };
  NR.$ = (sel, root = document) => root.querySelector(sel);

  // Minimal event bus for decoupling game logic from UI.
  const handlers = {};
  NR.on = (ev, fn) => { (handlers[ev] = handlers[ev] || []).push(fn); };
  NR.emit = (ev, data) => { (handlers[ev] || []).slice().forEach((fn) => fn(data)); };

  NR.store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('norefunds.' + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
    },
    set(key, val) { try { localStorage.setItem('norefunds.' + key, JSON.stringify(val)); } catch (e) { /* private mode */ } },
    del(key) { try { localStorage.removeItem('norefunds.' + key); } catch (e) { /* ignore */ } },
  };
})(window.NR);

// JSON mods: merge extra content into the game data at boot.
// Arrays are appended, objects are merged key by key. Stored in this browser.
(function (NR) {
  'use strict';
  const TARGETS = ['TACTICS', 'TRAITS', 'SCAMS', 'PLAYER_LINES', 'VICTIM_LINES', 'BAITER_TELLS', 'BAITER_NAMES', 'SUSPICIOUS_LINES', 'HANGUP_LINES',
    'GREETINGS', 'TIPS', 'CITIES', 'GIFT_BRANDS', 'NAMES', 'DETAILS', 'COMBOS', 'CARD_PRICES', 'CARD_SHOP', 'BOSS_LINES'];

  function merge(dst, src) {
    if (Array.isArray(dst) && Array.isArray(src)) { dst.push(...src); return dst; }
    if (dst && typeof dst === 'object' && src && typeof src === 'object') {
      for (const [k, v] of Object.entries(src)) {
        if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue;
        if (dst[k] && typeof dst[k] === 'object' && typeof v === 'object') merge(dst[k], v); else dst[k] = v;
      }
      return dst;
    }
    return src;
  }

  NR.validateMod = function (mod) {
    if (!mod || typeof mod !== 'object') throw new Error('Mod must be a JSON object.');
    const keys = Object.keys(mod).filter((k) => k !== 'name' && k !== 'author' && k !== 'description');
    const bad = keys.filter((k) => !TARGETS.includes(k));
    if (bad.length) throw new Error('Unknown sections: ' + bad.join(', '));
    for (const [id, s] of Object.entries(mod.SCAMS || {})) {
      if (!Array.isArray(s.stages) || !s.stages.length) throw new Error(`Scam "${id}" needs stages.`);
      if (!s.stages.some((st) => st.pay)) throw new Error(`Scam "${id}" needs a stage with "pay": true.`);
      s.mods = s.mods || {}; s.unlock = s.unlock || 1; s.pay = s.pay || 'gift';
    }
    for (const [id, t] of Object.entries(mod.TRAITS || {})) { t.mods = t.mods || {}; t.label = t.label || id; t.hint = t.hint || t.label; t.reveal = t.reveal || t.label; }
    return keys;
  };

  NR.applyMod = function (mod) { NR.validateMod(mod); for (const k of Object.keys(mod)) if (TARGETS.includes(k)) merge(NR[k], mod[k]); };

  NR.mods = NR.store.get('mods', []);
  for (const m of NR.mods) {
    if (m.enabled === false) continue;
    try { NR.applyMod(m.data); } catch (e) { console.warn('Mod failed:', m.data && m.data.name, e.message); }
  }
})(window.NR);

<script>
// Core rules: victims, leads, and the call state machine. No DOM in here.
(function (NR) {
  'use strict';
  const T = () => NR.TACTICS;

  // ------------------------------------------------------------- victims
  const CONFLICTS = { savvy: ['technophobe'], technophobe: ['savvy'], grumpy: ['polite', 'lonely'], polite: ['grumpy'], lonely: ['grumpy', 'busy'], busy: ['lonely'] };

  function pickTraits(elderly) {
    const traits = elderly ? ['elderly'] : [];
    const pool = Object.keys(NR.TRAITS).filter((t) => t !== 'elderly');
    const want = elderly ? NR.ri(1, 2) : 2;
    let guard = 0;
    while (traits.length < want + (elderly ? 1 : 0) && guard++ < 50) {
      const t = NR.pick(pool);
      if (traits.includes(t)) continue;
      if (traits.some((x) => (CONFLICTS[x] || []).includes(t))) continue;
      if (elderly && t === 'savvy' && NR.chance(0.8)) continue;
      traits.push(t);
    }
    return traits;
  }

  function makeSSN() {
    return `${NR.ri(100, 899)}-${String(NR.ri(1, 99)).padStart(2, '0')}-${String(NR.ri(1, 9999)).padStart(4, '0')}`;
  }

  NR.makeVictim = function (opts = {}) {
    const r = NR.rand();
    const age = opts.age || (r < 0.55 ? NR.ri(65, 91) : r < 0.85 ? NR.ri(40, 64) : NR.ri(22, 39));
    const gen = age >= 65 ? 'old' : age >= 40 ? 'mid' : 'young';
    const female = NR.chance(0.55);
    const traits = opts.traits || pickTraits(age >= 65);
    const baiter = opts.baiter != null ? opts.baiter : NR.chance(opts.baiterRate ?? 0.1);
    let first = NR.pick(NR.NAMES[gen][female ? 'f' : 'm']);
    let last = NR.pick(NR.NAMES.last);
    if (baiter && NR.chance(0.35)) { [first, last] = NR.pick(NR.BAITER_NAMES); }

    const kinds = NR.DETAILS.filter((d) => (d.kind !== 'grandkid' || age >= 55) && (d.kind !== 'spouse' || age >= 60));
    const dk = NR.pick(kinds);
    const key = NR.pick(dk.keys);
    let dtext = NR.pick(dk.text);
    if (dk.kind === 'spouse') dtext = female ? 'my late husband {key}' : 'my late wife {key}';
    const detail = { kind: dk.kind, key, text: NR.fill(dtext, { key }) };

    let trust = 15, susp = 10, pat = 10;
    for (const t of traits) { const d = NR.TRAITS[t]; trust += d.trust || 0; susp += d.susp || 0; pat += d.pat || 0; }
    let savings = NR.ri(600, 3800) * (age >= 65 ? 1.4 : 1) * (opts.wealthMult || 1);
    savings = Math.round(savings / 50) * 50;

    return {
      id: NR.uid('v'), first, last, age, female, city: opts.city || NR.pick(NR.CITIES),
      title: (female ? (age >= 40 ? 'Mrs. ' : 'Ms. ') : 'Mr. ') + last,
      traits, known: [traits[0]], detail, detailKnown: false,
      baseTrust: trust, baseSusp: susp, patience: Math.max(5, pat), savings, ssn: makeSSN(),
      baiter, story: opts.story || null,
    };
  };

  NR.leadNote = function (v) {
    const t = NR.TRAITS[v.traits[0]];
    return `${v.age}, ${v.city}. ${t.hint}.`;
  };

  // --------------------------------------------------------- payment codes
  const GIFT_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const CONFUSE = { B: '8', '8': 'B', S: '5', '5': 'S', Z: '2', '2': 'Z', G: '6', '6': 'G', D: 'B', M: 'N', N: 'M', P: 'B', T: 'D', V: 'B', E: 'B' };
  const DIGIT_CONFUSE = { '3': '8', '8': '3', '1': '7', '7': '1', '5': '6', '6': '5', '0': '8', '9': '5', '2': '3', '4': '1' };

  function giftCode() {
    let s = '';
    for (let i = 0; i < 16; i++) { s += GIFT_CHARS[Math.floor(NR.rand() * GIFT_CHARS.length)]; if (i % 4 === 3 && i < 15) s += '-'; }
    return s;
  }

  NR.luhnValid = function (num) {
    const d = num.replace(/\D/g, '');
    if (d.length < 12) return false;
    let sum = 0;
    for (let i = 0; i < d.length; i++) {
      let n = +d[d.length - 1 - i];
      if (i % 2 === 1) { n *= 2; if (n > 9) n -= 9; }
      sum += n;
    }
    return sum % 10 === 0;
  };

  function cardNumber() {
    // Fictional IIN "9" prefix: never a real issuer range.
    const digits = [9];
    while (digits.length < 15) digits.push(NR.ri(0, 9));
    for (let c = 0; c < 10; c++) { const s = digits.join('') + c; if (NR.luhnValid(s)) return s.replace(/(\d{4})(?=\d)/g, '$1 '); }
    return null;
  }

  // Spoken version of a code with one possibly-garbled character.
  function garble(code, prob, table) {
    if (!NR.chance(prob)) return { spoken: code, ambiguous: null };
    const idx = [];
    for (let i = 0; i < code.length; i++) if (table[code[i]]) idx.push(i);
    if (!idx.length) return { spoken: code, ambiguous: null };
    const i = NR.pick(idx);
    const a = code[i], b = table[a];
    const pair = NR.chance(0.5) ? [a, b] : [b, a];
    return { spoken: code.slice(0, i) + `(${pair[0]} or ${pair[1]}?)` + code.slice(i + 1), ambiguous: i };
  }

  NR.normCode = (s) => s.toUpperCase().replace(/[^A-Z0-9]/g, '');

  // ------------------------------------------------------------- the call
  class Call {
    constructor(victim, scamId, opts = {}) {
      this.v = victim;
      this.scamId = scamId;
      this.scam = NR.SCAMS[scamId];
      this.up = opts.upgrades || {};
      this.handSize = opts.handSize || 4;
      this.stage = 0;
      this.trust = victim.baseTrust + (this.up.spoofer ? 8 : 0);
      this.susp = victim.baseSusp;
      this.patience = victim.patience + (this.up.headset ? 2 : 0);
      this.maxPatience = this.patience;
      this.press = 0;
      this.last = null;
      this.doubleNext = false;
      this.turns = 0;
      this.cardsPlayed = 0;
      this.state = 'talk'; // talk | store | cashier | reading | done
      this.outcome = null;
      this.log = [];
      this.quotes = []; // for the end-of-day analysis
      this.exhausted = new Set();
      this.payout = { codes: [], ssn: null };
      const amt = Math.max(100, Math.round((victim.savings * (0.2 + NR.rand() * 0.2) * (NR.SCAMS[scamId].payMult || 1)) / 50) * 50);
      this.amount = amt;
      this.agent = NR.pick(['Officer Steve Johnson', 'Agent Daniel Smith', 'Technician Mike Brown', 'Senior Officer Jason Miller', 'Agent Kevin Wilson']);
      this.ctx = {
        title: victim.title, first: victim.first, last: victim.last, city: victim.city.split(',')[0], brand: this.scam.brand,
        agent: this.agent, agent2: NR.pick(['Robert Williams', 'Richard Davis', 'Thomas Moore']), badge: NR.ri(1000, 9999),
        case: `${NR.pick(['FBB', 'WZ', 'CX', 'FN'])}-${NR.ri(10000, 99999)}`, amount: NR.money(amt), refund: NR.money(NR.pick([199, 299, 399, 499])),
        big: NR.money(amt * 10), gift: NR.pick(NR.GIFT_BRANDS), ssn: victim.ssn, grandkid: victim.detail.kind === 'grandkid' ? victim.detail.key : 'sweetie', hobby: victim.detail.kind === 'hobby' ? victim.detail.key : 'church',
        detail: victim.detail.text,
      };
      this.deck = NR.shuffle((opts.deck || NR.STARTER_DECK).slice());
      this.discard = [];
      this.hand = [];
      for (let i = 0; i < this.handSize; i++) this.draw();
    }

    draw() {
      if (!this.deck.length) { this.deck = NR.shuffle(this.discard.filter((c) => !this.exhausted.has(c))); this.discard = []; }
      const c = this.deck.pop();
      if (c) this.hand.push(c);
    }

    say(who, text, tag) {
      // In multiplayer a human voices the victim; the engine only keeps score.
      if (this.human && who === 'them') return null;
      const e = { who, text, tag }; this.log.push(e); return e;
    }

    start() {
      const greet = NR.fill(NR.pick(NR.GREETINGS), this.ctx);
      this.say('them', greet);
      return greet;
    }

    // Chance that the next Ask succeeds, 0..1. Shown to the player.
    askChance() {
      const st = this.scam.stages[this.stage];
      if (!st) return 0;
      let p = 0.5 + (this.trust - st.need) / 40 - this.susp / NR.BAL.askSusp + this.press / 100 + (this.up.lucky ? 0.06 : 0);
      if (this.v.baiter) p += 0.15;
      return NR.clamp(p, 0.05, 0.95);
    }

    multiplierFor(id) {
      const base = T()[id].base || id;
      let m = 1;
      for (const tr of this.v.traits) {
        const mods = NR.TRAITS[tr].mods;
        if (mods[id] != null) m *= mods[id]; else if (mods[base] != null) m *= mods[base];
      }
      m *= this.scam.mods[base] || 1;
      if (base === 'authority' && this.up.badge) m *= 1.4;
      return m;
    }

    // Classify free text into a tactic (used for improv bonus and LLM mode).
    static classify(text) {
      const t = text.toLowerCase();
      let best = null, score = 0;
      for (const [id, tac] of Object.entries(NR.TACTICS)) {
        const s = (tac.kw || []).reduce((a, k) => a + (t.includes(k) ? 1 : 0), 0);
        if (s > score) { score = s; best = id; }
      }
      return best;
    }

    play(handIndex, typed) {
      if (this.state !== 'talk' && this.state !== 'cashier') return null;
      const id = this.hand[handIndex];
      if (!id) return null;
      const tac = T()[id];
      const base = tac.base || id;
      this.hand.splice(handIndex, 1);
      this.discard.push(id);
      if (tac.exhaust) this.exhausted.add(id);

      const flags = [];
      const lineSrc = NR.PLAYER_LINES[id];
      const canned = Array.isArray(lineSrc) ? NR.pick(lineSrc) : NR.pick(lineSrc[this.scamId] || lineSrc._);
      const playerLine = typed && typed.trim() ? typed.trim() : NR.fill(canned, this.ctx);
      this.say('you', playerLine, tac.icon + ' ' + tac.name);

      if (this.state === 'cashier') return this.resolveCashier(id, flags);

      if (tac.redraw) {
        this.discard.push(...this.hand); this.hand = [];
        for (let i = 0; i < this.handSize; i++) this.draw();
        this.say('sys', 'You shuffle your script pages.');
        return { flags, dTrust: 0, dSusp: 0 };
      }

      let mult = this.multiplierFor(id);
      const hiddenHit = this.v.traits.find((tr) => !this.v.known.includes(tr) && ((NR.TRAITS[tr].mods[id] || NR.TRAITS[tr].mods[base] || 1) >= 1.4 || (NR.TRAITS[tr].mods[id] || NR.TRAITS[tr].mods[base] || 1) <= 0.6));
      if (this.last === base) { mult *= 0.5; flags.push('Repeating yourself ×0.5'); }
      if (typed && typed.trim()) {
        const kwHit = (tac.kw || []).some((k) => typed.toLowerCase().includes(k)) || Call.classify(typed) === base;
        if (kwHit) { mult *= 1.25; flags.push('Improv ×1.25'); } else { mult *= 0.9; flags.push('Off-script ×0.9'); }
      }
      if (this.doubleNext) { mult *= 2; this.doubleNext = false; flags.push('Double Down ×2'); }
      if (this.nextMult) { mult *= this.nextMult; flags.push(`Interference ×${this.nextMult}`); this.nextMult = null; }

      let dTrust = (tac.trust || 0) * mult;
      let dSusp = tac.susp || 0;
      if (dSusp < 0) dSusp *= mult;
      if (mult < 0.8) { dTrust *= 0.5; dSusp += (1 - mult) * 16; }
      if (mult >= 1.3 && dSusp > 0) dSusp *= 0.5;

      if (typed) {
        const low = typed.toLowerCase();
        if (low.includes(this.v.first.toLowerCase()) || low.includes(this.v.last.toLowerCase())) { dTrust += 2; flags.push('Used their name +2'); }
        if (this.v.detailKnown && low.includes(this.v.detail.key.toLowerCase())) { dTrust += 6; dSusp -= 4; flags.push('Personal touch +6'); }
      }
      if (this.cardsPlayed === 0 && this.up.duck) { dTrust += 6; flags.push('Rubber Duck +6'); }
      if (this.demand) {
        if (this.demand.tactics.includes(base)) { dTrust += 6; flags.push(`Gave them what they wanted +6`); }
        else { dSusp += this.demand.susp; flags.push(`Ignored "${this.demand.name}" +${this.demand.susp} suspicion`); }
        this.demand = null;
      }

      const combo = NR.COMBOS.find((c) => c.a === this.last && c.b === base);
      if (combo) {
        dTrust += combo.trust || 0; dSusp += combo.susp || 0; this.press += combo.press || 0;
        flags.push('COMBO: ' + combo.name);
      }
      if (tac.press) this.press = Math.min(40, this.press + tac.press * Math.min(mult, 1.5));
      if (tac.doubleNext) { this.doubleNext = true; }

      // The deeper the con goes, the more doubts creep in; guarded people warm up slowly.
      if (!tac.free) dSusp += this.stage * NR.BAL.creep;
      if (this.susp >= NR.BAL.guardAt && dTrust > 0) { dTrust *= NR.BAL.guardMult; flags.push(`Guarded ×${NR.BAL.guardMult}`); }
      if (this.v.baiter) { dTrust *= 1.4; dSusp = dSusp > 0 ? dSusp * 0.3 : dSusp; }

      dTrust = Math.round(dTrust); dSusp = Math.round(dSusp);
      this.trust = NR.clamp(this.trust + dTrust, 0, 100);
      this.susp = NR.clamp(this.susp + dSusp, 0, 100);
      if (!tac.free) this.patience -= 1;
      if (tac.patience) this.patience += tac.patience;
      this.last = base;
      this.cardsPlayed++;
      this.draw();
      this.turns++;

      // Victim reaction.
      let level = mult >= 1.3 ? 'great' : mult < 0.8 ? 'bad' : 'good';
      if (flags.some((f) => f.startsWith('Repeating')) && level === 'great') level = 'good';
      const bank = NR.VICTIM_LINES[id] || NR.VICTIM_LINES[base] || NR.VICTIM_LINES._;
      let line = NR.pick(bank[level] || NR.VICTIM_LINES._[level]);

      const reveals = [];
      if (tac.reveal) {
        const hidden = this.v.traits.filter((tr) => !this.v.known.includes(tr));
        if (hidden.length && NR.chance(0.6)) { this.v.known.push(hidden[0]); reveals.push('trait:' + hidden[0]); }
        else if (!this.v.detailKnown) { this.v.detailKnown = true; reveals.push('detail'); line = NR.pick(NR.VICTIM_LINES.chat.great); }
      }
      if (hiddenHit && !this.v.known.includes(hiddenHit)) { this.v.known.push(hiddenHit); reveals.push('trait:' + hiddenHit); }
      if (line.includes('{detail}')) { this.v.detailKnown = true; if (!reveals.includes('detail')) reveals.push('detail'); }

      line = NR.fill(line, this.ctx);
      const known = this.v.traits.filter((tr) => NR.TRAITS[tr].flavor);
      if (known.length && NR.chance(0.3)) line = NR.pick(NR.TRAITS[NR.pick(known)].flavor) + ' ' + line;
      if (this.susp > 60 && level !== 'great' && NR.chance(0.45)) line += ' ' + NR.pick(NR.SUSPICIOUS_LINES);
      this.say('them', line, level);
      this.setCue(level);
      this.addBaiterTell();

      this.quotes.push({ text: playerLine, score: dTrust - dSusp, tactic: id });
      const res = { flags, dTrust, dSusp, level, reveals };
      this.redline();
      this.checkEnd();
      return res;
    }

    addBaiterTell() {
      if (!this.v.baiter || this.state === 'done') return;
      if (NR.chance(0.35)) this.say('them', NR.pick(NR.BAITER_TELLS), 'tell');
      if (this.turns > 7 && NR.chance(0.12)) {
        this.say('them', NR.fill(NR.pick(NR.BAITER_REVEAL), { mins: this.turns * 3 }), 'tell');
        this.end('baiter');
      }
    }

    ask(typed) {
      if (this.state !== 'talk') return null;
      const st = this.scam.stages[this.stage];
      if (this.demand) { this.susp = NR.clamp(this.susp + this.demand.susp, 0, 100); this.say('sys', `Ignored "${this.demand.name}": suspicion +${this.demand.susp}`); this.demand = null; }
      const p = this.askChance();
      const playerLine = typed && typed.trim() ? typed.trim() : NR.fill(st.ask, this.ctx);
      this.say('you', playerLine, '🎯 Ask: ' + st.name);
      this.turns++;
      this.patience -= 1;
      const ok = NR.rand() < p;
      this.press = 0;
      if (ok) {
        this.say('them', NR.fill(NR.pick(st.yes), this.ctx), 'great');
        if (st.ssn) { this.payout.ssn = this.v.ssn; this.say('sys', `🪪 Got SSN ${this.v.ssn} — stored in Identity Vault.`); }
        if (st.remote) this.remote = true;
        this.quotes.push({ text: playerLine, score: 12, tactic: 'ask' });
        this.stage++;
        this.cue = st.pay ? ['AGREES TO PAY — read your cards!', '💳', 'good'] : ['AGREES — go along with it', '✅', 'good'];
        if (st.pay) this.beginPayment();
        else this.trust = NR.clamp(this.trust + 3, 0, 100);
      } else {
        this.susp = NR.clamp(this.susp + NR.BAL.askFail, 0, 100);
        this.trust = NR.clamp(this.trust - 3, 0, 100);
        this.say('them', NR.fill(NR.pick(st.no), this.ctx), 'bad');
        this.cue = ['REFUSES — push back!', '❌', 'bad'];
        this.quotes.push({ text: playerLine, score: -12, tactic: 'ask' });
        this.addBaiterTell();
      }
      this.redline();
      this.checkEnd();
      return { ok, p };
    }

    // Stage direction for a human playing the victim (multiplayer).
    setCue(level) {
      this.cue = this.susp >= 75 ? ['VERY SUSPICIOUS', '🤨', 'bad']
        : this.patience <= 2 ? ['LOSING PATIENCE', '😤', 'bad']
          : { great: ['WON OVER', '😍', 'good'], good: ['GOING ALONG', '🙂', 'ok'], bad: ['PUT OFF', '😒', 'bad'] }[level];
    }

    // Outside interference: multiplayer victim tokens and chaos events.
    effect(e) {
      if (this.state === 'done') return;
      if (e.line) this.say('sys', e.line);
      this.trust = NR.clamp(this.trust + (e.trust || 0), 0, 100);
      this.susp = NR.clamp(this.susp + (e.susp || 0), 0, 100);
      this.patience += e.patience || 0;
      this.press = NR.clamp(this.press + (e.press || 0), 0, 40);
      if (e.nextMult) this.nextMult = (this.nextMult || 1) * e.nextMult;
      if (e.demand) this.demand = e.demand;
      if (e.redraw) { this.discard.push(...this.hand); this.hand = []; for (let i = 0; i < this.handSize; i++) this.draw(); }
      if (e.cue) this.cue = e.cue;
      this.checkEnd();
    }

    beginPayment() {
      if (this.human) {
        this.state = 'reading';
        this.payout.codes = this.human.cards;
        this.say('sys', `💳 ${this.v.first} agreed to pay! Victim: read your cards from your phone. Caller: type them into Redeem.`);
        return;
      }
      if (this.scam.pay === 'gift') {
        this.state = 'store';
        this.say('sys', `${this.v.first} is driving to the store to buy ${this.ctx.gift} cards. Keep them on the line…`);
      } else {
        this.state = 'reading';
        this.makeCodes();
      }
    }

    // Called by the UI when the store trip finishes.
    storeArrive() {
      if (this.state !== 'store') return;
      if (!this.v.baiter && NR.chance(0.35 + this.susp / 200)) {
        this.state = 'cashier';
        this.say('them', NR.fill(NR.pick(NR.CASHIER_LINES), { total: Math.round(this.amount) }), 'bad');
        this.say('sys', 'Play a card to talk them past the cashier (Calm Down, Sympathize, Pull Rank or Scare work best).');
      } else {
        this.state = 'reading';
        this.makeCodes();
      }
    }

    resolveCashier(id) {
      const good = ['reassure', 'empathy', 'authority', 'fear', 'sob', 'supervisor', 'holdmusic'];
      const base = T()[id].base || id;
      const p = NR.clamp((good.includes(id) || good.includes(base) ? 0.55 : 0.15) + this.trust / 200 - this.susp / 200, 0.05, 0.95);
      this.patience -= 1;
      this.draw();
      if (NR.rand() < p) {
        this.say('them', 'Okay… I told her it\'s a birthday present. She rang them up.', 'great');
        this.state = 'reading';
        this.makeCodes();
        return { flags: ['Cashier dodged'] };
      }
      this.say('them', 'She says this is definitely a scam and she\'s calling the police. I\'m going home.', 'bad');
      this.end('cashier');
      return { flags: ['Cashier stopped them'] };
    }

    makeCodes() {
      const garbleP = this.v.traits.includes('elderly') ? NR.TRAITS.elderly.garble : 0.15;
      if (this.scam.pay === 'gift') {
        const denoms = [500, 250, 200, 100];
        let left = this.amount; const cards = [];
        while (left >= 100 && cards.length < 4) { const d = denoms.find((x) => x <= left); cards.push(d); left -= d; }
        if (!cards.length) cards.push(100);
        cards.forEach((val, i) => {
          const code = this.v.baiter ? 'BAIT' + giftCode().slice(4) : giftCode();
          const g = garble(code, garbleP, CONFUSE);
          this.payout.codes.push({ type: 'gift', brand: this.ctx.gift, value: val, code, spoken: g.spoken, baiter: this.v.baiter, from: this.v.first + ' ' + this.v.last, tries: 0, done: false });
          this.say('them', `Card ${i + 1}, ${NR.money(val)}: ${g.spoken}`, 'code');
        });
      } else {
        const num = cardNumber();
        const g = garble(num, garbleP + 0.15, DIGIT_CONFUSE);
        const exp = `${String(NR.ri(1, 12)).padStart(2, '0')}/${NR.ri(27, 31)}`;
        this.payout.codes.push({ type: 'card', brand: 'Card', value: this.amount, code: num, spoken: g.spoken, exp, baiter: this.v.baiter, from: this.v.first + ' ' + this.v.last, tries: 0, done: false });
        this.say('them', `The number is ${g.spoken}, expires ${exp}.`, 'code');
      }
      this.say('sys', this.scam.pay === 'gift'
        ? 'Type the codes into the 🎁 Redeem app. Unclear characters? Guess, or ask them to Repeat.'
        : 'Charge the card in the 💳 Card Terminal. Hint: valid card numbers pass the Luhn checksum.');
      this.state = 'reading';
    }

    // Remote-desktop tricks. Each works once per call.
    remoteAction(kind) {
      if (this.state === 'done') return null;
      this.remoteUsed = this.remoteUsed || {};
      if (this.remoteUsed[kind] && kind !== 'bait') return null;
      this.remoteUsed[kind] = true;
      const has = (t) => this.v.traits.includes(t);
      let dTrust = 0, dSusp = 0, press = 0;
      const flags = [];
      if (kind === 'events' || kind === 'cmd') {
        this.say('you', kind === 'events' ? 'See all these red warnings in the Event Viewer? Each one is a hacker attack.' : 'I\'m running a security scan now… look at all those threats scrolling.', '🖱️ Remote');
        if (has('savvy')) { dSusp = 25; this.say('them', 'That\'s literally just the "tree" command. Or normal system logs. Nice try.', 'bad'); this.v.known.includes('savvy') || this.v.known.push('savvy'); }
        else {
          dTrust = kind === 'events' ? 10 : 8;
          if (has('technophobe')) dTrust *= 1.6; if (has('elderly')) dTrust *= 1.3;
          this.say('them', NR.pick(['Oh my lord, so many errors!', 'Is that all hackers? Make it stop!', 'I had no idea it was this bad.']), 'great');
        }
      } else if (kind === 'bank') {
        const rf = (this._inflate || 0) / 20;
        this.say('you', 'Please log into your bank so we can process the refund… there, see your balance?', '🖱️ Remote');
        if (rf < 2) { press = 5; this.say('them', 'I don\'t see much of a difference.', 'good'); }
        else if (rf <= 12) {
          press = this.scamId === 'refund' ? 25 : 10; dTrust = 8;
          this.say('them', `Wait, there\'s an extra ${NR.money(rf * this.amount)} in there?!`, 'great');
          flags.push('Fake balance');
        } else {
          dSusp = has('elderly') || has('technophobe') ? 5 : 18;
          this.say('them', 'That number can\'t be right. That\'s more than I\'ve ever had.', 'bad');
        }
      } else if (kind === 'blank') {
        this.say('you', 'I\'m turning off your screen so the hackers can\'t see what I\'m doing.', '🖱️ Remote');
        dSusp = has('anxious') ? 5 : -8; this.patience -= 1;
        this.say('them', has('anxious') ? 'My screen went black! Is it broken?!' : 'Oh, okay. It\'s all black now.', has('anxious') ? 'bad' : 'good');
      } else if (kind === 'bait') {
        this.say('sys', '📄 You opened BANK_PASSWORDS.txt… it was an executable. A scambaiter trap!');
        this.say('them', 'Hehehe. Enjoy the virus, buddy.', 'tell');
        this.end('baiter');
        return { flags: ['Trap!'], dTrust: 0, dSusp: 0, level: 'bad' };
      }
      dTrust = Math.round(dTrust); dSusp = Math.round(dSusp);
      this.trust = NR.clamp(this.trust + dTrust, 0, 100);
      this.susp = NR.clamp(this.susp + dSusp, 0, 100);
      this.press = Math.min(40, this.press + press);
      if (press) flags.push(`Pressure +${press}%`);
      this.checkEnd();
      return { flags, dTrust, dSusp, level: dSusp > 10 ? 'bad' : 'great' };
    }

    repeat() {
      if (this.state !== 'reading') return;
      if (this.human) { this.say('you', 'Sorry, could you read that again?'); return; }
      this.patience -= 1;
      this.say('you', 'Sorry, could you read that again?');
      for (const c of this.payout.codes) {
        if (!c.spoken.includes('(') || c.done) continue;
        if (NR.chance(0.6)) { c.spoken = c.code; this.say('them', `Okay, slowly: ${c.code}`, 'code'); } else this.say('them', `I… I think it\'s ${c.spoken}. The print is so tiny.`, 'code');
      }
      this.checkEnd();
    }

    finishPayment() {
      if (this.state !== 'reading') return;
      this.say('you', 'Thank you so much. Your case is now closed. Have a wonderful day.');
      this.say('them', this.v.baiter ? 'Oh, it was MY pleasure. Truly. 😇' : 'Thank you for helping me. Bye now.', this.v.baiter ? 'tell' : 'great');
      this.end('paid');
    }

    hangUp() { if (this.state !== 'done') { this.say('sys', 'You hung up.'); this.end(this.state === 'reading' ? 'paid' : 'dropped'); } }

    report() {
      if (this.state === 'done') return null;
      const was = this.human ? this.human.baiter : this.v.baiter;
      this.say('sys', was ? '🚩 Correct! That was a scambaiter. Number blacklisted.' : '🚩 That was a real person. They hang up, confused.');
      this.end(was ? 'reported' : 'falsereport');
      return was;
    }

    // Danger zone: past the redline every exchange risks a hang-up.
    redline() {
      if (this.state !== 'talk' || this.susp < NR.BAL.redline) return;
      if (NR.rand() < (this.susp - NR.BAL.redline) / NR.BAL.redlineSpan) { this.say('them', NR.pick(NR.HANGUP_LINES), 'bad'); this.end('hangup'); }
    }

    checkEnd() {
      if (this.state === 'done') return;
      if (this.susp >= 100) { this.say('them', NR.pick(NR.HANGUP_LINES), 'bad'); this.end('hangup'); }
      else if (this.patience <= 0) {
        if (this.state === 'reading') { this.say('them', 'That\'s all the numbers. I have to go now.'); this.end('paid'); }
        else { this.say('them', NR.pick(NR.BORED_LINES), 'bad'); this.end('bored'); }
      }
    }

    end(outcome) {
      if (this.state === 'done') return;
      this.state = 'done';
      this.outcome = outcome;
      NR.emit('callEnded', this);
    }
  }
  NR.Call = Call;
  NR.giftCode = giftCode;
})(window.NR);

// Every sound is synthesized: no audio files, no licensing, zero budget.
(function (NR) {
  'use strict';
  let ctx = null, master = null;
  const settings = NR.store.get('settings', { sound: true, music: true, speed: 1 });
  NR.settings = settings;
  NR.saveSettings = () => NR.store.set('settings', settings);

  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
      master = ctx.createGain();
      master.gain.value = 0.25;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type = 'sine', vol = 0.5, dest) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    const t0 = c.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.setValueAtTime(vol, t0 + dur - 0.03);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  const sfx = {
    ring() { for (let i = 0; i < 2; i++) { tone(440, i * 0.5, 0.4, 'sine', 0.25); tone(480, i * 0.5, 0.4, 'sine', 0.25); } },
    pickup() { tone(1200, 0, 0.03, 'square', 0.2); tone(300, 0.04, 0.05, 'square', 0.15); },
    hangup() { tone(480, 0, 0.25, 'sine', 0.3); tone(620, 0, 0.25, 'sine', 0.3); tone(480, 0.3, 0.25, 'sine', 0.3); tone(620, 0.3, 0.25, 'sine', 0.3); },
    click() { tone(1800, 0, 0.02, 'square', 0.08); },
    card() { tone(660, 0, 0.05, 'triangle', 0.25); tone(990, 0.05, 0.07, 'triangle', 0.2); },
    good() { tone(523, 0, 0.08, 'triangle', 0.3); tone(784, 0.08, 0.12, 'triangle', 0.3); },
    bad() { tone(220, 0, 0.15, 'sawtooth', 0.15); tone(160, 0.12, 0.2, 'sawtooth', 0.15); },
    cash() { [1318, 1568, 2093].forEach((f, i) => tone(f, i * 0.06, 0.12, 'square', 0.12)); tone(80, 0.2, 0.15, 'square', 0.2); },
    error() { tone(140, 0, 0.3, 'square', 0.2); },
    alarm() { for (let i = 0; i < 6; i++) { tone(880, i * 0.5, 0.25, 'sawtooth', 0.2); tone(660, i * 0.5 + 0.25, 0.25, 'sawtooth', 0.2); } },
    combo() { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.05, 0.1, 'square', 0.12)); },
    popup() { tone(900, 0, 0.06, 'square', 0.12); tone(600, 0.07, 0.06, 'square', 0.12); },
    coin() { tone(988, 0, 0.06, 'square', 0.15); tone(1319, 0.06, 0.2, 'square', 0.15); },
  };

  NR.sfx = function (name) {
    if (!settings.sound) return;
    try { sfx[name] && sfx[name](); } catch (e) { /* audio blocked */ }
  };

  // Greensleeves (public domain), the patron saint of hold music.
  const GREEN = [
    [57, 1], [60, 2], [62, 1], [64, 1.5], [65, 0.5], [64, 1], [62, 2], [59, 1], [55, 1.5], [57, 0.5], [59, 1], [60, 2], [57, 1], [57, 1.5], [56, 0.5], [57, 1], [59, 2], [56, 1], [52, 2],
    [57, 1], [60, 2], [62, 1], [64, 1.5], [65, 0.5], [64, 1], [62, 2], [59, 1], [55, 1.5], [57, 0.5], [59, 1], [60, 1.5], [59, 0.5], [57, 1], [56, 1.5], [54, 0.5], [56, 1], [57, 3],
  ];
  let holdTimer = null;
  NR.holdMusic = function (on) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (!on || !settings.music || !settings.sound) return;
    const c = ac(); if (!c) return;
    const beat = 0.32;
    let t = 0;
    for (const [n, d] of GREEN) {
      const f = 440 * Math.pow(2, (n - 69) / 12);
      tone(f * 2, t, d * beat * 0.95, 'triangle', 0.12);
      tone(f, t, d * beat * 0.95, 'sine', 0.06);
      t += d * beat;
    }
    holdTimer = setTimeout(() => NR.holdMusic(true), t * 1000);
  };

  // Optional mic input (Chrome/Edge). Transcribed locally by the browser; we store nothing.
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  NR.micSupported = !!SR;
  NR.listen = function (onText, onEnd) {
    if (!SR) return null;
    const r = new SR();
    r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 1;
    r.onresult = (e) => { let s = ''; for (const res of e.results) s += res[0].transcript; onText(s, e.results[e.results.length - 1].isFinal); };
    r.onend = onEnd; r.onerror = onEnd;
    try { r.start(); } catch (e) { NR.toast && NR.toast('Microphone unavailable here.', 'warn'); return null; }
    return r;
  };
})(window.NR);

// Game state and the workday loop. UI listens to NR.emit('update').
(function (NR) {
  'use strict';
  const DAY_MIN = 480; // 9:00 -> 17:00

  function fresh(mode = 'story', seed) {
    return {
      v: 2, mode, seed: seed || null,
      day: 1, minute: 0, clockedIn: false,
      grossToday: 0, gross: 0, cash: 60, heat: 0, strikes: 0,
      deck: NR.STARTER_DECK.slice(), upgrades: {},
      leads: [], pending: [], vault: [], callsToday: [], quotesToday: [],
      conscience: 0, victims: [], flags: {}, mail: [], news: [], evidence: 0,
      stats: { calls: 0, paid: 0, baitersCaught: 0, baitersFell: 0, biggest: 0, combos: 0, raidsSurvived: 0, casino: 0 },
      achievements: {},
    };
  }

  NR.G = null;
  NR.call = null;
  let ticker = null;

  NR.quota = (day) => {
    const q = NR.QUOTAS[Math.min(day, NR.QUOTAS.length) - 1];
    return day > NR.QUOTAS.length ? Math.round(q * Math.pow(1.18, day - NR.QUOTAS.length)) : q;
  };
  NR.unlockedScams = () => Object.keys(NR.SCAMS).filter((id) => NR.G.mode !== 'story' || NR.SCAMS[id].unlock <= NR.G.day);
  NR.clockStr = (m = NR.G.minute) => { const h = 9 + Math.floor(m / 60), mm = m % 60; return `${((h + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };

  NR.newGame = function (mode, seed) {
    if (seed) NR.seed(seed);
    NR.G = fresh(mode, seed);
    NR.story && NR.story.init(NR.G);
    save();
  };
  NR.loadGame = function () {
    const g = NR.store.get('save', null);
    if (!g || g.v !== 2) return false;
    NR.G = Object.assign(fresh(), g);
    return true;
  };
  function save() { if (NR.G && NR.G.mode !== 'mp') NR.store.set('save', NR.G); }
  NR.save = save;

  // ------------------------------------------------------------- leads
  NR.refillLeads = function () {
    const G = NR.G;
    while (G.leads.length < 5) {
      const story = NR.story && NR.story.nextLead(G);
      const v = story || NR.makeVictim({ wealthMult: G.upgrades.leads ? 1.35 : 1, baiterRate: Math.min(0.3, 0.08 + G.day * 0.012 + G.heat / 600) });
      G.leads.push(v);
    }
  };

  // ------------------------------------------------------------- day loop
  NR.startDay = function () {
    const G = NR.G;
    G.minute = 0; G.grossToday = 0; G.callsToday = []; G.quotesToday = []; G.clockedIn = true;
    G.leads = G.leads.filter((l) => !l.story);
    NR.refillLeads();
    save();
    startTicker();
    NR.emit('dayStart', G);
    NR.emit('update');
  };

  // Resume a shift after reloading a mid-day save.
  NR.resumeDay = function () {
    NR.refillLeads();
    startTicker();
    NR.emit('update');
  };

  function startTicker() {
    stopTicker();
    const ms = 750 * (NR.G.upgrades.coffee ? 1.25 : 1) / (NR.settings.speed || 1);
    ticker = setInterval(tick, ms);
  }
  function stopTicker() { if (ticker) clearInterval(ticker); ticker = null; }
  NR.pauseClock = (p) => { if (p) stopTicker(); else if (NR.G && NR.G.clockedIn) startTicker(); };

  function tick() {
    const G = NR.G;
    if (!G.clockedIn || NR.paused) return;
    if (G.minute >= DAY_MIN) {
      if (!NR.call) endDay();
      return;
    }
    G.minute++;
    if (G.minute % 60 === 0) NR.emit('hour', G.minute / 60);
    if (G.minute === DAY_MIN - 30) NR.emit('toast', { text: '⏰ 30 minutes until end of shift. Redeem your codes!', kind: 'warn' });
    maybeEvent();
    NR.emit('tick');
  }
  NR.advance = function (mins) { const G = NR.G; G.minute = Math.min(DAY_MIN, G.minute + mins); NR.emit('tick'); };

  function maybeEvent() {
    const G = NR.G;
    if (NR.eventActive) return;
    if (G.heat >= 100) { NR.emit('raid', { forced: true }); return; }
    if (G.heat >= 60 && NR.chance((G.heat - 55) / 9000)) NR.emit('raid', { forced: false });
  }

  function endDay() {
    const G = NR.G;
    G.clockedIn = false;
    stopTicker();
    // Unredeemed codes expire overnight.
    const expired = G.pending.filter((p) => !p.done).length;
    G.pending = [];
    const quota = NR.quota(G.day);
    const made = G.grossToday >= quota;
    const ratio = G.grossToday / quota;
    let grade = ratio >= 1.8 ? 'S' : ratio >= 1.35 ? 'A' : ratio >= 1 ? 'B' : ratio >= 0.7 ? 'C' : 'F';
    let bonus = 0;
    if (made) bonus = Math.round((G.grossToday - quota) * 0.1 + (grade === 'S' ? 150 : grade === 'A' ? 80 : 0));
    else G.strikes++;
    G.cash += bonus;
    const fired = G.strikes >= 2;
    G.heat = Math.max(0, G.heat - (G.upgrades.vpn ? 18 : 12));
    const review = { day: G.day, quota, gross: G.grossToday, grade, bonus, made, fired, expired, calls: G.callsToday.slice(), quotes: G.quotesToday.slice() };
    G.lastReview = review;
    NR.story && NR.story.endOfDay(G, review);
    if (!fired) { G.day++; }
    save();
    NR.emit('dayEnd', review);
    NR.emit('update');
  }
  NR.forceEndDay = () => { if (!NR.call) { NR.G.minute = DAY_MIN; endDay(); } };

  // ------------------------------------------------------------- calls
  NR.dial = function (leadId, scamId) {
    const G = NR.G;
    if (NR.call || !G.clockedIn) return null;
    const v = G.leads.find((l) => l.id === leadId);
    if (!v) return null;
    G.leads = G.leads.filter((l) => l !== v);
    G.stats.calls++;
    if (!v.story && NR.chance(0.14)) {
      NR.advance(4);
      NR.refillLeads();
      return { voicemail: NR.fill(NR.pick(NR.VOICEMAIL), { last: v.last, first: v.first, hobby: v.detail.kind === 'hobby' ? v.detail.key : 'bingo' }) };
    }
    const hand = 4 + (G.upgrades.hand ? 1 : 0);
    NR.call = new NR.Call(v, scamId, { upgrades: G.upgrades, deck: G.deck, handSize: hand });
    NR.call.start();
    NR.refillLeads();
    return { call: NR.call };
  };

  const HEAT = { tech: 5, gov: 7, refund: 5, prize: 4, bank: 6, grandkid: 6 };
  NR.on('callEnded', (c) => {
    const G = NR.G;
    if (!G) return;
    const heatMul = G.upgrades.vpn ? 0.65 : 1;
    const rec = { name: c.v.first + ' ' + c.v.last, age: c.v.age, scam: c.scam.name, outcome: c.outcome, amount: 0, baiter: c.v.baiter };
    if (c.outcome === 'paid') {
      G.pending.push(...c.payout.codes);
      G.heat += (HEAT[c.scamId] || 5) * heatMul;
      G.stats.paid++;
      rec.amount = c.payout.codes.reduce((a, b) => a + b.value, 0);
      if (!c.v.baiter) G.victims.push({ name: rec.name, age: c.v.age, city: c.v.city, amount: rec.amount, scam: c.scamId, traits: c.v.traits, day: G.day, story: c.v.story });
    }
    if (c.payout.ssn) G.vault.push({ ssn: c.payout.ssn, name: rec.name, age: c.v.age, price: NR.ri(60, 140), baiter: c.v.baiter });
    if (c.outcome === 'hangup') G.heat += 3 * heatMul;
    if (c.outcome === 'cashier') G.heat += 4 * heatMul;
    if (c.outcome === 'baiter') { G.heat += 10 * heatMul; G.stats.baitersFell++; NR.emit('toast', { text: '📹 A scambaiter recorded you. Heat +10', kind: 'bad' }); }
    if (c.outcome === 'reported') { G.cash += 40; G.stats.baitersCaught++; NR.emit('toast', { text: '🚩 Baiter caught! Boss sends +$40', kind: 'good' }); NR.achieve('baiterhunter', G.stats.baitersCaught >= 3); }
    G.callsToday.push(rec);
    const best = c.quotes.slice().sort((a, b) => b.score - a.score)[0];
    const worst = c.quotes.slice().sort((a, b) => a.score - b.score)[0];
    if (best) G.quotesToday.push({ ...best, who: rec.name, kind: 'best' });
    if (worst && worst !== best && worst.score < 0) G.quotesToday.push({ ...worst, who: rec.name, kind: 'worst' });
    NR.advance(2);
    setTimeout(() => { NR.call = null; NR.emit('update'); }, 0);
    save();
  });

  // Redeem a gift card / charge a card. Returns {ok, msg}.
  NR.redeem = function (input, type) {
    const G = NR.G;
    const norm = NR.normCode(input);
    if (!norm) return { ok: false, msg: 'Enter a code.' };
    const open = G.pending.concat(NR.call ? NR.call.payout.codes : []).filter((p) => !p.done && p.type === type);
    if (!open.length) return { ok: false, msg: 'No pending ' + (type === 'gift' ? 'gift cards' : 'cards') + '.' };
    const hit = open.find((p) => NR.normCode(p.code) === norm);
    if (type === 'card' && !NR.luhnValid(norm)) {
      const c = open[0]; c.tries++;
      if (c.tries >= 3) { c.done = true; c.lost = true; return { ok: false, msg: '⛔ Card flagged after 3 bad attempts. Lost.' }; }
      return { ok: false, msg: `Declined: invalid card number (checksum). Attempts left: ${3 - c.tries}` };
    }
    if (!hit) {
      // Charge the attempt to the closest open code.
      const best = open.map((p) => ({ p, d: diff(NR.normCode(p.code), norm) })).sort((a, b) => a.d - b.d)[0].p;
      best.tries++;
      NR.sfx('error');
      if (best.tries >= 3) { best.done = true; best.lost = true; return { ok: false, msg: `⛔ ${best.brand} card ${NR.money(best.value)} locked after 3 invalid tries.` }; }
      return { ok: false, msg: `Invalid code. Attempts left on that card: ${3 - best.tries}` };
    }
    hit.done = true;
    NR.emit('redeemed', hit);
    if (hit.baiter) {
      G.heat += 15; G.stats.baitersFell++;
      NR.emit('virus');
      NR.achieve('gotbaited', true);
      return { ok: false, msg: '💀 The card says: "Nice try, scammer ❤️". A file downloads itself… uh oh.' };
    }
    G.grossToday += hit.value; G.gross += hit.value;
    G.cash += hit.value * NR.CUT;
    G.stats.biggest = Math.max(G.stats.biggest, hit.value);
    NR.sfx('cash');
    NR.achieve('firstblood', true);
    NR.achieve('whale', hit.value >= 500);
    NR.emit('update');
    save();
    return { ok: true, msg: `✅ ${NR.money(hit.value)} credited. Your cut: ${NR.money(hit.value * NR.CUT)}` };
  };
  function diff(a, b) { let d = Math.abs(a.length - b.length); for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) d++; return d; }

  NR.sellIdentity = function (i) {
    const G = NR.G, it = G.vault[i];
    if (!it) return null;
    G.vault.splice(i, 1);
    if (it.baiter) { G.heat += 6; return { ok: false, msg: 'Buyer says the identity is fake. Your reputation (and heat) suffers.' }; }
    G.grossToday += it.price; G.gross += it.price; G.cash += it.price * NR.CUT;
    NR.sfx('cash'); save(); NR.emit('update');
    return { ok: true, msg: `Sold for ${NR.money(it.price)}.` };
  };

  // ------------------------------------------------------------- shop
  NR.buyUpgrade = function (id) {
    const G = NR.G, u = NR.UPGRADES.find((x) => x.id === id);
    if (!u || G.upgrades[id] || G.cash < u.cost) return false;
    G.cash -= u.cost; G.upgrades[id] = true;
    if (id === 'coffee' && G.clockedIn) startTicker();
    NR.sfx('coin'); save(); NR.emit('update');
    NR.achieve('collector', Object.keys(G.upgrades).length >= 5);
    return true;
  };
  NR.buyCard = function (id) {
    const G = NR.G, price = NR.CARD_PRICES[id];
    if (G.cash < price) return false;
    G.cash -= price; G.deck.push(id);
    NR.sfx('coin'); save(); NR.emit('update');
    return true;
  };
  NR.removeCard = function (idx) {
    const G = NR.G;
    if (G.cash < 50 || G.deck.length <= 8) return false;
    G.cash -= 50; G.deck.splice(idx, 1);
    save(); NR.emit('update');
    return true;
  };

  // ------------------------------------------------------------- events
  NR.raidResult = function (ok) {
    const G = NR.G;
    if (ok) { G.heat = 45; G.stats.raidsSurvived++; NR.achieve('slippery', true); }
    else {
      G.flags.busted = true;
      G.clockedIn = false; stopTicker();
      save();
      NR.emit('ending', 'busted');
    }
    NR.emit('update');
  };

  // ------------------------------------------------------------- achievements
  NR.ACHIEVEMENTS = {
    firstblood: ['First Blood', 'Redeem your first gift card.'],
    whale: ['Whale Watching', 'Redeem a $500 card.'],
    baiterhunter: ['Baiter Hunter', 'Catch 3 scambaiters.'],
    gotbaited: ['Got Baited', 'Redeem a scambaiter\'s fake card.'],
    combo: ['Combo Artist', 'Land a combo.'],
    slippery: ['Slippery', 'Survive a police raid.'],
    collector: ['Desk Hoarder', 'Own 5 desk upgrades.'],
    sgrade: ['Shark', 'Get an S grade.'],
    gambler: ['House Always Wins', 'Lose $200 at the casino.'],
    personal: ['Personal Touch', 'Mention a victim\'s personal detail in your own words.'],
    nomercy: ['No Mercy', 'Scam your own grandmother.'],
    redeemed: ['Redeemed', 'Get the Witness ending.'],
    kingpin: ['Kingpin', 'Get the Kingpin ending.'],
  };
  NR.achieve = function (id, cond) {
    const G = NR.G;
    if (!cond || !G || G.achievements[id]) return;
    G.achievements[id] = true;
    const all = NR.store.get('achievements', {}); all[id] = true; NR.store.set('achievements', all);
    NR.emit('toast', { text: `🏆 Achievement: ${NR.ACHIEVEMENTS[id][0]}`, kind: 'good' });
  };
})(window.NR);

</script>
<script>
// DeskOS window manager, taskbar, toasts and modals.
(function (NR) {
  'use strict';
  const el = NR.el;
  NR.apps = {};
  const wins = new Map(); // appId -> {node, body, app}
  let z = 10;

  NR.registerApp = (id, app) => { NR.apps[id] = Object.assign({ id, w: 420, h: 360 }, app); };

  NR.isMobile = () => window.innerWidth < 760;

  NR.openApp = function (id, arg) {
    const app = NR.apps[id];
    if (!app) return null;
    if (app.locked && app.locked()) { NR.toast(app.lockedMsg || 'Locked.', 'warn'); return null; }
    let w = wins.get(id);
    if (w) { w.node.hidden = false; focus(w); app.render(w.body, arg, w); renderTasks(); return w; }
    const area = NR.$('#windows');
    const W = Math.min(app.w, window.innerWidth - 20), H = Math.min(app.h, window.innerHeight - 50);
    const n = wins.size;
    const left = NR.clamp(110 + n * 26 + (app.x || 0), 0, window.innerWidth - W);
    const top = NR.clamp(20 + n * 22 + (app.y || 0), 0, window.innerHeight - 36 - H);
    const body = el('div.wbody');
    const node = el('div.window', { style: { left: left + 'px', top: top + 'px', width: W + 'px', height: H + 'px' } },
      el('div.titlebar', el('span', app.icon), el('span.t', app.title),
        el('button', { title: 'Minimize', onclick: (e) => { e.stopPropagation(); node.hidden = true; renderTasks(); } }, '_'),
        el('button', { title: 'Maximize', onclick: (e) => { e.stopPropagation(); node.classList.toggle('max'); } }, '□'),
        el('button', { title: 'Close', onclick: (e) => { e.stopPropagation(); NR.closeApp(id); } }, '✕')),
      body, el('div.resize'));
    if (NR.isMobile()) node.classList.add('max');
    w = { id, node, body, app };
    wins.set(id, w);
    area.append(node);
    drag(node, node.querySelector('.titlebar'), false);
    drag(node, node.querySelector('.resize'), true);
    node.addEventListener('pointerdown', () => focus(w));
    focus(w);
    app.render(body, arg, w);
    renderTasks();
    NR.sfx('click');
    return w;
  };

  NR.closeApp = function (id) {
    const w = wins.get(id);
    if (!w) return;
    if (w.app.onClose) w.app.onClose();
    w.node.remove();
    wins.delete(id);
    renderTasks();
  };
  NR.refreshApp = function (id, arg) { const w = wins.get(id); if (w && !w.node.hidden) w.app.render(w.body, arg, w); };
  let refreshing = false;
  NR.refreshAll = function () {
    if (refreshing) return;
    refreshing = true;
    try { for (const w of wins.values()) if (!w.node.hidden && w.app.live) w.app.render(w.body, undefined, w); } finally { refreshing = false; }
  };
  NR.isOpen = (id) => wins.has(id) && !wins.get(id).node.hidden;
  NR.shakeApp = (id) => { const w = wins.get(id); if (w) { w.node.classList.remove('shake'); void w.node.offsetWidth; w.node.classList.add('shake'); } };
  NR.closeAll = () => { for (const id of [...wins.keys()]) NR.closeApp(id); };

  function focus(w) {
    for (const o of wins.values()) o.node.classList.add('inactive');
    w.node.classList.remove('inactive');
    w.node.style.zIndex = ++z;
    renderTasks(w.id);
  }

  function drag(node, handle, resize) {
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.tagName === 'BUTTON' || node.classList.contains('max')) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY, r = node.getBoundingClientRect();
      const move = (ev) => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (resize) { node.style.width = Math.max(240, r.width + dx) + 'px'; node.style.height = Math.max(120, r.height + dy) + 'px'; }
        else {
          node.style.left = NR.clamp(r.left + dx, -r.width + 80, window.innerWidth - 80) + 'px';
          node.style.top = NR.clamp(r.top + dy, 0, window.innerHeight - 60) + 'px';
        }
      };
      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  }

  function renderTasks(activeId) {
    const t = NR.$('#tasks');
    if (!t) return;
    t.replaceChildren(...[...wins.values()].map((w) => el('button', {
      class: (activeId === w.id || (!activeId && !w.node.classList.contains('inactive'))) && !w.node.hidden ? 'active' : '',
      onclick: () => { if (w.node.hidden || w.node.classList.contains('inactive')) { w.node.hidden = false; focus(w); } else { w.node.hidden = true; renderTasks(); } },
    }, w.app.icon + ' ' + w.app.title)));
  }

  // ------------------------------------------------------------- icons
  NR.renderIcons = function () {
    const box = NR.$('#icons');
    box.replaceChildren(...Object.values(NR.apps).filter((a) => !a.hidden && !(a.locked && a.locked() && a.hideLocked)).map((a) => {
      const badge = a.badge ? a.badge() : 0;
      return el('button.icon', { ondblclick: () => NR.openApp(a.id), onclick: () => { if (NR.isMobile() || NR.settings.singleClick !== false) NR.openApp(a.id); } },
        el('span.ic', a.icon), a.title, badge ? el('span.badge', badge) : null);
    }));
  };

  // ------------------------------------------------------------- toasts
  NR.toast = function (text, kind = '') {
    const t = el('div.toast.' + (kind || 'x'), text);
    NR.$('#toasts').append(t);
    setTimeout(() => t.remove(), 4200);
  };
  NR.on('toast', (d) => NR.toast(d.text, d.kind));

  // ------------------------------------------------------------- modals
  NR.modal = function (title, content, buttons = []) {
    const ov = NR.$('#overlay');
    const close = () => { ov.hidden = true; ov.replaceChildren(); };
    const box = el('div.modal', el('div.titlebar', el('span.t', title)),
      el('div.mb', content, buttons.length ? el('div.row', { style: { justifyContent: 'flex-end', marginTop: '12px', flexWrap: 'wrap' } },
        buttons.map((b) => el('button', { class: b.cls || '', onclick: () => { if (b.keep !== true) close(); b.fn && b.fn(); } }, b.label))) : null));
    ov.replaceChildren(box);
    ov.hidden = false;
    return { close, box };
  };
  NR.modalOpen = () => !NR.$('#overlay').hidden;

  // ------------------------------------------------------------- start menu
  NR.toggleStart = function (force) {
    const m = NR.$('#start-menu');
    const show = force != null ? force : m.hidden;
    if (!show) { m.hidden = true; return; }
    const item = (label, fn) => el('button', { onclick: () => { m.hidden = true; fn(); } }, label);
    m.replaceChildren(el('div.side', 'DeskOS 98'), el('div.items',
      ...Object.values(NR.apps).filter((a) => !a.hidden).map((a) => item(a.icon + ' ' + a.title, () => NR.openApp(a.id))),
      el('hr'),
      item('⏭ End shift early', () => {
        if (NR.call) return NR.toast('Finish your call first.', 'warn');
        NR.modal('End shift?', el('p', 'Clock out now? Unredeemed codes expire.'), [{ label: 'Cancel' }, { label: 'Clock out', cls: 'primary', fn: NR.forceEndDay }]);
      }),
      item('💾 Save & quit to title', () => { NR.save(); location.reload(); })));
    m.hidden = false;
  };
})(window.NR);

</script>
